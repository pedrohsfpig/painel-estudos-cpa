<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Painel de estudos CPA</title>
<style>
:root{--bg:#fbfaf7;--fg:#1f1f1d;--mu:#6b6a65;--bd:#d9d7cf;--cd:#f1efe8;--ok:#2f7d32;--okb:#e3f1dd;--md:#8a5d00;--mdb:#faeeda;--hd:#a32d2d;--hdb:#fcebeb;--hc:#7b1e3a;--hcb:#f4dfe5;--ac:#185fa5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1a;--fg:#ece9df;--mu:#a8a69d;--bd:#3d3c38;--cd:#2a2a27;--ok:#9bd18a;--okb:#1f3a1f;--md:#efb85a;--mdb:#3a2c10;--hd:#f09595;--hdb:#3d1a1a;--hc:#c2506e;--hcb:#3b1424;--ac:#85b7eb}}
:root[data-theme="dark"]{--bg:#1c1c1a;--fg:#ece9df;--mu:#a8a69d;--bd:#3d3c38;--cd:#2a2a27;--ok:#9bd18a;--okb:#1f3a1f;--md:#efb85a;--mdb:#3a2c10;--hd:#f09595;--hdb:#3d1a1a;--hc:#c2506e;--hcb:#3b1424;--ac:#85b7eb}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:500;margin:4px 0 12px}h3{font-size:16px;font-weight:500;margin:22px 0 8px}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:6px 14px;cursor:pointer}
button:hover{background:var(--cd)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.m,.card{background:var(--cd);border-radius:10px;padding:12px 14px}.card{margin:12px 0}
.mv{font-size:24px;font-weight:500}.mu{color:var(--mu)}.s{font-size:13px}
.r{margin:8px 0}.rt{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar{height:8px;background:var(--cd);border-radius:4px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%}
.bd{font-size:12px;font-weight:500;padding:2px 10px;border-radius:8px;margin-right:8px}
.o{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 14px}
.o.ok{background:var(--okb);border-color:var(--ok)}.o.no{background:var(--hdb);border-color:var(--hd)}
.nav{display:flex;gap:8px;margin-bottom:8px}
.lay{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}.mn{flex:1;min-width:280px}
.tr{flex:0 0 280px;max-width:100%;border-left:2px solid var(--bd);padding-left:14px}
.st{position:relative;margin:0 0 8px}.st:before{content:"";position:absolute;left:-21px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--ac)}
.tb{width:100%;text-align:left}.tb.on{border-color:var(--ac)}
.tc{font-size:14px;padding:8px 2px}.tc ul{margin:4px 0 10px;padding-left:18px}.tc li{margin:4px 0}
.gp{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin:14px 0}
.pn{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;margin-bottom:14px}.gp .pn{margin:0}
.pn h3{margin:0 0 14px;font-size:16px}
.gt{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px 32px}
.pn .r{margin:0 0 14px}.pn .rt b{font-weight:500;font-size:17px}
.pn .bar{height:14px;border-radius:7px;background:var(--bg);margin-top:5px}.pn .bar i{border-radius:7px}
.rs{font-size:12px;color:var(--mu);margin-top:4px}
.en{font-size:20px;line-height:1.5;font-weight:500;margin:14px 0 18px;padding:16px 18px;background:var(--cd);border-left:4px solid var(--ac);border-radius:10px}
.tb2{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:8px 0;margin-bottom:6px;border-bottom:1px solid var(--bd)}
.tm{font-variant-numeric:tabular-nums;font-size:18px;font-weight:500;background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:2px 16px}
.aj{border:1px dashed var(--bd);border-radius:12px;padding:12px 14px;margin-top:18px}.aj .chips{margin:8px 0 0}
.hb{border-color:var(--ac);color:var(--ac)}.hb[disabled]{opacity:.45;cursor:default}
.tb{display:flex;justify-content:space-between;align-items:center;gap:8px}.tb .bd{margin:0}
.hoje{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-left:4px solid var(--ac)}
details.rv{background:var(--cd);border:1px solid var(--bd);border-radius:12px;margin:0 0 10px}details.rv summary{cursor:pointer;padding:12px 14px}details.rv .b{padding:0 14px 12px;font-size:14px}
details.acc{background:var(--cd);border:1px solid var(--bd);border-left:4px solid var(--c,var(--ac));border-radius:12px;margin:0 0 10px}
details.acc>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;font-size:17px;font-weight:500}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"▼ Visualizar";font-size:13px;font-weight:400;color:var(--mu);white-space:nowrap}
details.acc[open]>summary::after{content:"▲ Recolher"}
.acb{padding:2px 18px 16px}.acc .pt{background:var(--bg)}
.sg{margin:12px 0 4px}.sh{font-weight:500;font-size:15px;color:var(--c);margin-bottom:4px}.sb{padding-left:12px;border-left:2px solid var(--bd)}.ml{font-size:15px;padding:3px 0}.ml::before{content:"– ";color:var(--mu)}
.tbc{padding:20px 22px 12px}.pn h3.tt{font-size:21px;font-weight:500;margin:0 0 14px}
table.tx{border-collapse:collapse;width:100%;font-size:15px;line-height:1.5}.tx th{text-align:left;font-size:17px;font-weight:500;color:var(--ac);padding:8px 14px 12px;border-bottom:2px solid var(--bd)}.tx td{padding:13px 14px;border-bottom:1px solid var(--bd);vertical-align:top}.tx tr:last-child td{border-bottom:0}.tx td:first-child{font-size:17px;font-weight:500;color:var(--ac)}
.og{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.og.sm{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.og.qt{grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}
.oc{position:relative;display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 40px 14px 16px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);margin:0}.oc b{font-weight:500;font-size:16px}
.oc::after{content:"";position:absolute;top:14px;right:14px;width:16px;height:16px;border-radius:50%;border:2px solid var(--bd);box-sizing:border-box}
.oc.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.oc.on::after{border-color:var(--ac);background:var(--ac);box-shadow:inset 0 0 0 3px var(--bg)}
.oc.hc.on{border-color:var(--hc);box-shadow:0 0 0 1px var(--hc)}.oc.hc.on::after{border-color:var(--hc);background:var(--hc)}
.lv0 b::before,.lv1 b::before,.lv2 b::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}.lv0 b::before{background:var(--ok)}.lv1 b::before{background:var(--md)}.lv2 b::before{background:var(--hd)}
.stp{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;margin-bottom:14px}.sth{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.sn{width:28px;height:28px;border-radius:50%;background:var(--ac);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px;flex:none}.stt{font-size:18px;font-weight:500}
.sum{border:1px solid var(--ac);border-radius:14px;padding:18px 20px;background:var(--cd)}.sumt{font-size:18px;font-weight:500;margin:4px 0 8px}.big{padding:12px 28px;font-size:17px;margin:12px 0 0}
.fx{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}.bx{flex:1 1 150px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}.ar{align-self:center;color:var(--mu)}
.fcd{min-height:160px;display:flex;flex-direction:column;justify-content:center;gap:8px;text-align:center;font-size:20px;padding:24px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;cursor:pointer;margin:12px 0}
.hero{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:20px 22px;margin-bottom:14px}.hero h2{font-size:26px;font-weight:500;margin:4px 0 8px}
.sec{font-size:18px;font-weight:500;margin:26px 0 10px}.pt{background:var(--cd);border-left:4px solid var(--ac);border-radius:10px;padding:12px 16px;margin:0 0 10px;font-size:16px;line-height:1.6}
.qd{min-width:900px;display:grid;grid-template-columns:38px 2.4fr 1fr 1fr;gap:6px}.qw{overflow-x:auto}
.qhd{padding:12px 14px;color:#fff;font-weight:500;border-radius:8px;text-align:center}
.qv{writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font-weight:500;text-align:center;border-radius:0 8px 8px 0;padding:10px 0;display:flex;align-items:center;justify-content:center}
.qc{border-radius:8px;padding:16px 12px;display:flex;align-items:center;justify-content:space-around;text-align:center;gap:14px;border:1px solid var(--bd)}
.qw1{background:linear-gradient(rgba(70,130,210,.16),rgba(70,130,210,.16)),var(--cd)}.qg1{background:var(--cd)}
.qb b{display:block;font-size:34px;font-weight:700;color:var(--ac);line-height:1.1}.qb span{display:block;font-size:14px;color:var(--mu);margin-top:4px}
.qops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}.qo{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;min-width:0}
.ql{background:var(--bg);border-radius:6px;padding:8px 10px;font-size:13px;width:100%;box-sizing:border-box;min-height:58px;display:flex;align-items:center;justify-content:center;text-align:center}.qcol{flex-direction:column;gap:12px}.qtop{align-items:flex-start}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 0 0}.dt{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

.feedback{border:1px solid var(--bd)}.feedback h3{margin:0 0 12px;font-size:18px}
.fb-option{background:var(--bg);border-left:3px solid var(--bd);border-radius:8px;padding:12px 14px;margin:10px 0}
.fb-option.fb-correct{border-left-color:var(--ok)}.fb-option.fb-selected:not(.fb-correct){border-left-color:var(--hd)}
.fb-heading{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.fb-label{font-weight:600;color:var(--mu)}.fb-correct .fb-label{color:var(--ok)}
.fb-selected:not(.fb-correct) .fb-label{color:var(--hd)}
.fb-choice{padding:2px 8px;border:1px solid var(--bd);border-radius:6px;font-size:12px}
.fb-option h4{font-size:16px;font-weight:500;margin:0 0 6px}.fb-option p{margin:0;line-height:1.6}
button.o:disabled{cursor:default}
</style></head><body><div class="w"><div id="app"></div></div>
<script>
const L=["Fácil","Médio","Difícil","Hardcore"],LC=["ok","md","hd","hc"],AU=["","Aula 1: SFN","Aula 2: CMN","Aula 3: BACEN","Aula 4: CVM","Aula 5: Seguros e previdência","Aula 6: Operadores"];
const Q=[
[1,"Agentes e intermediação",0,"Sobre a intermediação financeira no SFN, é correto afirmar:","O SFN conecta agentes superavitários (com recursos excedentes) a deficitários (que precisam de recursos).","Deficitários são os que têm sobra de recursos e querem aplicá-los.","A intermediação ocorre só entre pessoas físicas, sem instituições.","Superavitários são aqueles cujos gastos superam a renda.","Superavitário tem sobra; deficitário tem falta de recursos.",0,"Pense no papel de intermediário: o sistema aproxima quem tem dinheiro parado de quem precisa dele. Desconfie das frases que invertem esses papéis.",["Superavitário tem sobra; deficitário tem falta de recursos.","Deficitários precisam de recursos; quem tem sobra é superavitário.","A intermediação envolve instituições e também pessoas jurídicas, não só pessoas físicas.","Gastos maiores que a renda caracterizam o deficitário, não o superavitário."]],
[1,"Spread",0,"Um banco capta a 10% a.a. e empresta a 18% a.a. A diferença entre as taxas é o:","Spread bancário","Taxa Selic","Compulsório","Taxa de câmbio","Spread é a diferença entre juros de empréstimo e de captação.",0,"Calcule a diferença entre as duas taxas. O nome dessa diferença é a receita bruta da intermediação, e não uma taxa definida por política monetária.",["Spread é a diferença entre juros de empréstimo e de captação.","A Selic é a taxa básica de juros cuja meta é definida pelo Copom; não a diferença entre juros de captação e empréstimo. Para esta pergunta: Spread é a diferença entre juros de empréstimo e de captação.","Compulsório é o recolhimento de recursos das instituições ao BACEN; não é uma diferença de juros nem uma troca de moedas. Para esta pergunta: Spread é a diferença entre juros de empréstimo e de captação.","Taxa de câmbio relaciona o valor de duas moedas; não a taxa básica nem a diferença entre juros pagos e cobrados. Para esta pergunta: Spread é a diferença entre juros de empréstimo e de captação."]],
[1,"Estrutura do SFN",0,"Sobre a estrutura do SFN, é correto afirmar que:","Normativos definem regras, supervisoras fiscalizam e operadoras atuam com o público.","Normativos fiscalizam diretamente as instituições.","Operacionais editam as normas gerais.","Supervisoras não têm relação com os normativos.","Regra (normativo), fiscalização (supervisora), operação (operacional).",0,"Cada nível do sistema tem uma função própria. Descarte as alternativas em que um nível faz o trabalho de outro.",["Regra (normativo), fiscalização (supervisora), operação (operacional).","Fiscalizar o cumprimento das regras é função das supervisoras.","Operadoras prestam serviços e intermedeiam recursos; normas gerais vêm dos órgãos normativos.","As supervisoras fiscalizam justamente o cumprimento das regras dos normativos."]],
[1,"Mercados",1,"Qual mercado opera no curtíssimo e no curto prazo e tem como objetivo controlar a liquidez e os juros?","Mercado monetário","Mercado de capitais","Mercado de câmbio","Mercado de seguros","O monetário trata da liquidez e da taxa básica de juros.",0,"Pense no mercado cujo foco são prazos muito curtos e o controle do dinheiro que circula na economia.",["O monetário trata da liquidez e da taxa básica de juros.","O mercado de capitais envolve ações e títulos corporativos e financia predominantemente o longo prazo, segundo a aula. Para esta pergunta: O monetário trata da liquidez e da taxa básica de juros.","O câmbio negocia moedas estrangeiras; não é o mercado de liquidez, de apólices ou de emissão de debêntures. Para esta pergunta: O monetário trata da liquidez e da taxa básica de juros.","O mercado de seguros oferece proteção contra riscos por apólices e inclui o segmento de previdência aberta. Para esta pergunta: O monetário trata da liquidez e da taxa básica de juros."]],
[1,"Serviços",1,"Qual item representa uma vantagem das instituições financeiras na função de intermediadoras?","Fornecem liquidez aos agentes e têm acesso a cadastros e históricos de crédito dos clientes.","Estão isentas de qualquer regulação e supervisão.","São proibidas de cobrar juros acima do teto da Lei da Usura.","Atuam apenas na emissão de moeda.","As instituições fornecem liquidez, conhecem seus clientes e são reguladas.",0,"Pense nas vantagens de uma instituição grande e regulada sobre um emprestador individual. Descarte as frases que negam a regulação.",["As instituições fornecem liquidez, conhecem seus clientes e são reguladas.","Regulação e supervisão são características das instituições financeiras, não uma isenção.","As instituições do SFN são exceção ao teto da Lei da Usura mencionado na aula.","A emissão de moeda é função do BACEN; os intermediários também captam, emprestam e prestam serviços."]],
[1,"Agentes e intermediação",1,"A empresa Alfa aplicou o caixa excedente em CDB; a Beta tomou financiamento no mesmo banco. Logo:","Alfa é superavitária, Beta é deficitária e o banco é intermediário.","Alfa é deficitária e Beta é superavitária.","Ambas são superavitárias e o banco só fiscaliza.","Ambas são deficitárias e o banco é órgão normativo.","Quem tem sobra é superavitário; o banco liga as pontas.",0,"Identifique quem tem sobra e quem tem falta de recursos. O banco fica entre os dois.",["Quem tem sobra é superavitário; o banco liga as pontas.","Inverte as posições: Alfa aplica uma sobra; Beta precisa de financiamento.","Beta é deficitária; o banco intermedeia os recursos, não apenas fiscaliza.","Alfa é superavitária e o banco é operador, não órgão normativo."]],
[1,"Spread",1,"Com a inadimplência em alta, o efeito esperado sobre o spread é:","Aumento, para compensar o risco maior de perdas.","Redução, pois o risco menor atrai clientes.","Eliminação, pois o BC cobre as perdas.","Manutenção obrigatória, fixada pelo CMN.","O spread remunera custos e risco da intermediação.",0,"Mais calotes elevam a perda esperada do banco. Pense em como ele compensa isso na diferença entre as taxas.",["O spread remunera custos e risco da intermediação.","Mais inadimplência aumenta o risco de perda, em vez de reduzir o risco e justificar queda do spread.","O BC não cobre automaticamente as perdas da carteira para eliminar o spread.","O spread depende dos custos e riscos da instituição; não é fixado igualmente pelo CMN."]],
[1,"Serviços",1,"Cobrar taxa de administração para gerir a carteira de um cliente é função de:","Prestação de serviços","Intermediação com spread","Supervisão do mercado","Normatização do sistema","Gestão de recursos de terceiros é serviço, remunerado por taxa.",0,"Observe de onde vem a receita: uma taxa pela gestão, e não a diferença entre os juros de captação e de empréstimo.",["Gestão de recursos de terceiros é serviço, remunerado por taxa.","Intermediação gera spread: diferença entre juros cobrados e pagos. Tarifas e taxas por serviços são outra fonte de receita. Para esta pergunta: Gestão de recursos de terceiros é serviço, remunerado por taxa.","Supervisionar é fiscalizar regras, não administrar a carteira do cliente por uma taxa.","Normatizar é editar regras; gerir recursos de terceiros é prestação de serviço."]],
[1,"Mercados",1,"Uma loja precisa de recursos de curto prazo para pagar fornecedores. Em qual mercado ocorre essa operação?","Mercado de crédito","Mercado de capitais","Mercado de seguros","Mercado de previdência fechada","Crédito atende necessidades de curto e médio prazo.",0,"O prazo é curto e o objetivo é pagar despesas da operação da loja. Pense no mercado de empréstimos e financiamentos.",["Crédito atende necessidades de curto e médio prazo.","O mercado de capitais envolve ações e títulos corporativos e financia predominantemente o longo prazo, segundo a aula. Para esta pergunta: Crédito atende necessidades de curto e médio prazo.","O mercado de seguros oferece proteção contra riscos por apólices e inclui o segmento de previdência aberta. Para esta pergunta: Crédito atende necessidades de curto e médio prazo.","A previdência fechada atende planos de entidades fechadas e é supervisionada pela Previc, não pela Susep. Para esta pergunta: Crédito atende necessidades de curto e médio prazo."]],
[1,"Mercados",1,"Uma exportadora converte dólares em reais. Em qual mercado ocorre essa conversão?","Mercado de câmbio","Mercado monetário","Mercado de crédito","Mercado de seguros","Câmbio é a compra e venda de moedas estrangeiras.",0,"Há duas moedas diferentes na operação. Pense no mercado em que elas são trocadas.",["Câmbio é a compra e venda de moedas estrangeiras.","O mercado monetário trata da liquidez e dos juros básicos com operações de curtíssimo e curto prazo. Para esta pergunta: Câmbio é a compra e venda de moedas estrangeiras.","O mercado de crédito envolve empréstimos e financiamentos de curto e médio prazo, na classificação da aula. Para esta pergunta: Câmbio é a compra e venda de moedas estrangeiras.","O mercado de seguros oferece proteção contra riscos por apólices e inclui o segmento de previdência aberta. Para esta pergunta: Câmbio é a compra e venda de moedas estrangeiras."]],
[1,"Mercados",1,"Uma companhia emite debêntures para financiar uma fábrica no longo prazo. Em qual mercado isso ocorre?","Mercado de capitais","Mercado de câmbio","Mercado monetário","Mercado de seguros","Capitais viabiliza captação de longo prazo (ações, debêntures).",0,"O prazo é longo e o instrumento capta recursos para a empresa sem ser um empréstimo bancário. Pense em ações e títulos corporativos.",["Capitais viabiliza captação de longo prazo (ações, debêntures).","O câmbio negocia moedas estrangeiras; não é o mercado de liquidez, de apólices ou de emissão de debêntures. Para esta pergunta: Capitais viabiliza captação de longo prazo (ações, debêntures).","O mercado monetário trata da liquidez e dos juros básicos com operações de curtíssimo e curto prazo. Para esta pergunta: Capitais viabiliza captação de longo prazo (ações, debêntures).","O mercado de seguros oferece proteção contra riscos por apólices e inclui o segmento de previdência aberta. Para esta pergunta: Capitais viabiliza captação de longo prazo (ações, debêntures)."]],
[1,"Estrutura do SFN",0,"Qual é um exemplo de órgão normativo do SFN?","CMN","Banco comercial","Corretora de valores","CVM","O CMN é o normativo máximo; a CVM supervisiona.",0,"Procure o órgão que define diretrizes gerais, sem operar com o público nem fiscalizar o dia a dia.",["O CMN é o normativo máximo; a CVM supervisiona.","Banco comercial é operador monetário, capta depósitos à vista e a prazo e concede crédito; não é normativo nem supervisor. Para esta pergunta: O CMN é o normativo máximo; a CVM supervisiona.","Corretora é operador não monetário do mercado de valores mobiliários; não é normativo, supervisor nem captador de depósitos à vista. Para esta pergunta: O CMN é o normativo máximo; a CVM supervisiona.","A CVM regula e supervisiona o mercado de valores mobiliários, como ações, debêntures e fundos. Para esta pergunta: O CMN é o normativo máximo; a CVM supervisiona."]],
[1,"Agentes e intermediação",1,"Sobre o teto de juros de 12% ao ano da Lei da Usura (Decreto 22.626/1933), as instituições do SFN:","Estão autorizadas a cobrar juros acima do teto, conforme o risco.","Estão proibidas de cobrar acima do teto.","São obrigadas a cobrar exatamente o teto.","Não estão sujeitas a nenhuma regra de juros.","As instituições financeiras são exceção ao teto da Lei da Usura.",0,"A lei fixa um teto geral, mas a aula trata um grupo de forma diferente.",["As instituições financeiras são exceção ao teto da Lei da Usura.","A restrição geral da Lei da Usura não se aplica da mesma forma às instituições do SFN.","O teto citado não obriga os bancos a praticar uma taxa fixa de 12%.","Ser exceção a esse teto não elimina outras normas aplicáveis aos juros."]],
[1,"Agentes e intermediação",0,"Liquidez é a facilidade e a rapidez com que um ativo pode ser convertido em dinheiro sem perda significativa de valor. Quanto maior a liquidez:","Mais fácil é transformar o ativo em dinheiro.","Maior é o prazo para obter o dinheiro.","Maior é a perda de valor na conversão.","Menor é a procura pelo ativo.","Maior liquidez significa conversão mais fácil e rápida em dinheiro.",0,"Se o ativo é mais líquido, o caminho entre ele e o dinheiro é mais curto e mais rápido.",["Maior liquidez significa conversão mais fácil e rápida em dinheiro.","Mais liquidez reduz a dificuldade e o tempo para obter dinheiro.","Alta liquidez pressupõe conversão sem perda significativa, não maior perda.","A definição trata da facilidade de conversão; não implica menor procura pelo ativo."]],
[1,"Estrutura do SFN",1,"Quando a supervisão e o controle das instituições são realizados por órgãos governamentais ou entidades externas e independentes das reguladas, trata-se de:","Heterorregulação","Autorregulação","Desregulação","Regulação exclusiva da própria indústria","Autorregulação é a própria indústria; heterorregulação é a externa.",0,"Observe quem controla: alguém de fora das instituições ou elas mesmas.",["Autorregulação é a própria indústria; heterorregulação é a externa.","Na autorregulação, entidades da própria indústria criam e aplicam regras; o controle externo caracteriza heterorregulação. Para esta pergunta: Autorregulação é a própria indústria; heterorregulação é a externa.","Desregulação significa reduzir regras ou controles; não é controle externo nem regulação pela própria indústria. Para esta pergunta: Autorregulação é a própria indústria; heterorregulação é a externa.","Controle pela própria indústria é autorregulação; o enunciado descreve controle externo."]],
[2,"Meta de inflação",0,"Quem define a meta de inflação e quem adota as medidas para alcançá-la?","CMN define; Banco Central persegue.","Banco Central define; CMN persegue.","CVM define; Banco Central persegue.","Copom define; CMN persegue.","O CMN é normativo; o BC executa.",0,"O CMN cria as regras e define metas. A ação de perseguir o resultado cabe a outro órgão.",["O CMN é normativo; o BC executa.","Inverte os papéis: o CMN define a meta e o BC age para alcançá-la.","A CVM cuida dos valores mobiliários; não define a meta de inflação.","O Copom define a meta da Selic; perseguir a inflação cabe ao BC, não ao CMN."]],
[2,"Meta de inflação",1,"A inflação acumulada em 12 meses (IPCA) é comparada mês a mês com a meta e a tolerância. Como é chamada essa sistemática?","Meta contínua","Meta fixa anual","Meta de liquidez","Meta de câmbio","Na meta contínua a apuração é mensal, em 12 meses.",0,"Observe a periodicidade da comparação: ela se repete todos os meses, sempre com a inflação de uma janela de 12 meses.",["Na meta contínua a apuração é mensal, em 12 meses.","A comparação ocorre mensalmente sobre uma janela móvel, não só ao fim do ano.","Liquidez não é a variável medida; a comparação usa inflação acumulada pelo IPCA.","A meta descrita é de inflação, não de cotação de moeda estrangeira."]],
[2,"Meta de inflação",1,"Alterar a meta ou a tolerância exige anúncio com antecedência mínima de:","36 meses","6 meses","12 meses","24 meses","O prazo mínimo é de 36 meses, para dar previsibilidade.",0,"É um prazo longo, medido em anos, para dar previsibilidade às mudanças.",["O prazo mínimo é de 36 meses, para dar previsibilidade.","O valor indicado nesta opção (6 meses) não corresponde ao resultado ou requisito pedido (36 meses). O prazo mínimo é de 36 meses, para dar previsibilidade.","O valor indicado nesta opção (12 meses) não corresponde ao resultado ou requisito pedido (36 meses). O prazo mínimo é de 36 meses, para dar previsibilidade.","O valor indicado nesta opção (24 meses) não corresponde ao resultado ou requisito pedido (36 meses). O prazo mínimo é de 36 meses, para dar previsibilidade."]],
[2,"CMN: papel e composição",1,"Qual é a composição correta do CMN?","3 membros: Min. da Fazenda (preside), Min. do Planejamento e Orçamento e Presidente do BC.","Todos os diretores do BC, presididos pelo presidente da CVM.","Presidente do BC e 4 diretores, presididos por ele.","8 membros, presididos pelo Secretário do Tesouro.","Os diretores do BC aparecem na Comoc, não no CMN.",0,"São poucos membros, e a presidência fica com um ministro da área econômica. Descarte as opções com diretores do BC ou da CVM.",["Os diretores do BC aparecem na Comoc, não no CMN.","O CMN não reúne todos os diretores do BC; a presidência é do Ministro da Fazenda.","O BC tem diretores na Comoc; o CMN reúne dois ministros e o Presidente do BC.","O CMN tem três membros e não é presidido pelo Secretário do Tesouro."]],
[2,"CMN x Banco Central",2,"Um banco concede a um cliente crédito acima do limite máximo. Quem faz o quê?","O CMN fixa o limite por norma; o BC verifica o cumprimento.","O CMN fiscaliza e pune diretamente.","O CMN executa a operação e o BC define o limite.","Não há limite; a decisão é só da instituição.","O CMN escreve a regra; o BC confere.",0,"Separe quem estabelece o limite de quem verifica se ele foi respeitado.",["O CMN escreve a regra; o BC confere.","O CMN normatiza; fiscalizar e aplicar a regra às instituições cabe ao BC.","Inverte as funções: o CMN fixa limites gerais e o BC verifica o cumprimento.","A instituição está sujeita aos limites de concentração definidos por norma."]],
[2,"CMN x Banco Central",2,"Quem decide a meta da taxa Selic?","Copom, do Banco Central","CMN, em reunião mensal","Comoc","Ministro da Fazenda, isoladamente","A Selic é do Copom; a meta de inflação é do CMN.",0,"Lembre que a taxa básica de juros não é decidida pelo mesmo órgão que define a meta de inflação.",["A Selic é do Copom; a meta de inflação é do CMN.","O CMN estabelece diretrizes e normas gerais; não executa operações nem fiscaliza diretamente as instituições. Para esta pergunta: A Selic é do Copom; a meta de inflação é do CMN.","A Comoc presta assessoramento técnico prévio ao CMN; não delibera em seu lugar nem define a meta da Selic. Para esta pergunta: A Selic é do Copom; a meta de inflação é do CMN.","O Ministro da Fazenda preside o CMN; não é o coordenador da Comoc nem decide sozinho a meta da Selic. Para esta pergunta: A Selic é do Copom; a meta de inflação é do CMN."]],
[2,"Comoc e Secretaria",2,"Qual órgão presta assessoramento técnico, manifesta-se previamente ao CMN, é coordenado pelo presidente do BC e realiza reuniões reservadas?","Comoc","Copom","CVM","Tesouro Nacional","A Comoc assessora o CMN; o Copom define a Selic.",0,"O nome é parecido com o do comitê dos juros, mas a função é de apoio técnico antes das decisões do CMN.",["A Comoc assessora o CMN; o Copom define a Selic.","O Copom é o comitê do Banco Central que define a meta da taxa Selic; não define a meta de inflação nem assessora o CMN como a Comoc. Para esta pergunta: A Comoc assessora o CMN; o Copom define a Selic.","A CVM regula e supervisiona o mercado de valores mobiliários, como ações, debêntures e fundos. Para esta pergunta: A Comoc assessora o CMN; o Copom define a Selic.","O Tesouro atua na administração das finanças e da dívida pública; não substitui as competências do CMN, BACEN ou CVM descritas na aula. Para esta pergunta: A Comoc assessora o CMN; o Copom define a Selic."]],
[2,"Comoc e Secretaria",1,"Pauta, convocação e atas do CMN são atribuições de:","Banco Central (Secretaria-Executiva do CMN e da Comoc)","CVM","Ministério da Fazenda","Comoc","A Secretaria-Executiva é exercida pelo BC.",0,"Pense em quem dá o suporte administrativo ao conselho, elabora documentos e organiza o calendário.",["A Secretaria-Executiva é exercida pelo BC.","A CVM regula e supervisiona o mercado de valores mobiliários, como ações, debêntures e fundos. Para esta pergunta: A Secretaria-Executiva é exercida pelo BC.","A Fazenda é a vinculação da CVM e da Susep e abriga o CNSP; o segmento de previdência fechada é ligado à Previdência Social. Para esta pergunta: A Secretaria-Executiva é exercida pelo BC.","A Comoc presta assessoramento técnico prévio ao CMN; não delibera em seu lugar nem define a meta da Selic. Para esta pergunta: A Secretaria-Executiva é exercida pelo BC."]],
[2,"Reuniões e normas",2,"Em urgência e relevante interesse, o presidente do CMN decide sem esperar a reunião mensal. A decisão é:","Ad referendum dos demais membros, levada à reunião seguinte.","Definitiva, sem análise posterior.","Condicionada à unanimidade prévia.","Dependente do Senado Federal.","Decisão ad referendum é depois submetida aos demais.",0,"A decisão é tomada em urgência, mas ainda passa por uma confirmação posterior do colegiado.",["Decisão ad referendum é depois submetida aos demais.","Ad referendum exige apreciação posterior pelos demais membros; não é decisão definitiva sem controle.","A urgência permite decisão antes da reunião, sem unanimidade prévia.","A confirmação cabe aos demais membros do CMN, não ao Senado."]],
[2,"Reuniões e normas",1,"Uma nova regra de crédito do CMN é regulamentada e divulgada como:","Resolução CMN, no DOU e no Busca de normas do CMN e do BC","Lei complementar","Circular da CVM","Ata reservada, sem divulgação","As matérias saem por Resoluções CMN.",0,"Procure o nome oficial das normas do CMN e o veículo em que o público as acessa.",["As matérias saem por Resoluções CMN.","Lei complementar é aprovada pelo Legislativo; a norma do conselho sai por Resolução CMN.","Circular da CVM não é o veículo de divulgação da norma do CMN.","A regra é publicada no DOU e na busca de normas; não fica só em ata reservada."]],
[1,"Serviços",2,"Um banco registrou três receitas no mês: (I) diferença entre os juros cobrados nos empréstimos e os pagos na captação; (II) tarifa de manutenção de conta; (III) taxa de administração de fundos. Como elas se classificam?","I é intermediação financeira (spread); II e III são prestação de serviços.","I, II e III são intermediação financeira.","I e II são prestação de serviços; III é spread.","I é prestação de serviços; II e III são intermediação financeira.","O spread vem da intermediação; tarifas e taxas de administração remuneram serviços.",0,"Classifique cada receita pela origem: diferença entre taxas ou pagamento por um serviço prestado.",["O spread vem da intermediação; tarifas e taxas de administração remuneram serviços.","Tarifa de conta e taxa de administração são serviços; apenas a diferença entre juros é spread.","A diferença entre juros é spread; administrar fundos é prestação de serviço, não spread.","Inverte as fontes de receita: juros geram spread, tarifas e taxas remuneram serviços."]],
[1,"Mercados",2,"Associe cada mercado à entidade que o supervisiona: seguros, valores mobiliários (capitais) e previdência fechada.","Seguros: Susep; capitais: CVM; previdência fechada: Previc.","Seguros: CVM; capitais: Susep; previdência fechada: Previc.","Seguros: Previc; capitais: CVM; previdência fechada: Susep.","Seguros: Susep; capitais: Previc; previdência fechada: CVM.","Susep supervisiona seguros, CVM os valores mobiliários e Previc a previdência fechada.",0,"Cada mercado tem um supervisor próprio. Associe pelo produto: apólices, valores mobiliários e fundos de pensão.",["Susep supervisiona seguros, CVM os valores mobiliários e Previc a previdência fechada.","Troca os supervisores de seguros e capitais: Susep cuida de seguros e CVM de valores mobiliários.","Troca os supervisores de seguros e previdência fechada: Susep e Previc, respectivamente.","Troca capitais e previdência fechada: CVM supervisiona capitais e Previc supervisiona a fechada."]],
[1,"Mercados",2,"O Banco Central atua para ajustar a liquidez da economia e conduzir a taxa básica de juros. Em qual mercado isso ocorre e qual o prazo típico das operações?","Mercado monetário; curtíssimo e curto prazo.","Mercado de crédito; médio e longo prazo.","Mercado de capitais; longo prazo.","Mercado de câmbio; longo prazo.","O monetário trata de liquidez e juros básicos, com operações de curtíssimo e curto prazo.",0,"Pense na ferramenta do BC para ajustar o dinheiro em circulação, em qual mercado ela atua e em que horizonte de tempo.",["O monetário trata de liquidez e juros básicos, com operações de curtíssimo e curto prazo.","Crédito é empréstimo e financiamento; o ajuste de liquidez e juros básicos ocorre no monetário.","Capitais financia longo prazo, não o controle da liquidez de curtíssimo prazo.","Câmbio negocia moedas estrangeiras; não é o mercado de controle da liquidez descrito."]],
[1,"Estrutura do SFN",2,"Assinale a alternativa INCORRETA sobre a estrutura do SFN.","Os órgãos normativos, como o CMN, fiscalizam diariamente as instituições que atendem o público.","Os órgãos normativos estabelecem as regras gerais do sistema.","As entidades supervisoras fiscalizam o cumprimento das regras.","Os bancos que atendem o público são entidades operacionais.","Fiscalizar é papel das supervisoras; o CMN normatiza.",0,"Procure a frase que dá a quem define as regras uma tarefa diária de fiscalização, que pertence a outro nível.",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. Fiscalizar é papel das supervisoras; o CMN normatiza.","Definir as regras gerais é a função normativa, portanto a afirmação é verdadeira. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Fiscalizar o cumprimento das regras é justamente a função das supervisoras. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Bancos que captam e emprestam ao público operam no sistema e são entidades operacionais. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[1,"Agentes e intermediação",2,"Um investidor aplica em um CDB, e o banco empresta o dinheiro a uma empresa por juros maiores. Se a empresa atrasar o pagamento, quem tem a obrigação de remunerar o investidor?","O banco, que assume o risco da operação e responde ao investidor.","A empresa tomadora, diretamente perante o investidor.","O CMN, por ser o órgão normativo.","Ninguém, pois o risco é sempre do investidor.","O banco intermedia e assume o risco de crédito; a obrigação com o investidor é dele.",0,"O investidor tem contrato com o banco, e não com quem tomou o empréstimo. Pense em quem deve a ele.",["O banco intermedia e assume o risco de crédito; a obrigação com o investidor é dele.","O investidor contratou o CDB com o banco, não diretamente com a empresa tomadora.","Ser órgão normativo não torna o CMN devedor do CDB.","O risco da operação não extingue a obrigação contratual do banco perante o investidor."]],
[2,"CMN: papel e composição",0,"O CMN é caracterizado como:","Órgão deliberativo máximo e normativo do SFN, sem funções executivas.","Órgão executivo que fiscaliza as instituições financeiras.","Entidade operacional que atende o público.","Órgão supervisor do mercado de valores mobiliários.","Ele cria regras e diretrizes; não as executa.",0,"Pense no que o CMN faz: cria regras e diretrizes, e não executa nem atende ao público.",["Ele cria regras e diretrizes; não as executa.","Executar e fiscalizar são funções de supervisoras como o BC, não do conselho normativo.","O CMN não capta nem concede crédito ao público.","A supervisão dos valores mobiliários cabe à CVM; o CMN é normativo."]],
