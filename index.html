[2,"Reuniões e normas",0,"Com que frequência os membros do CMN se reúnem em caráter ordinário?","Uma vez por mês","Uma vez por semana","Uma vez por ano","Uma vez por semestre","Ordinárias mensais; as extraordinárias dependem de convocação do presidente.",0,"A periodicidade é maior que uma semana e menor que um semestre.",["Ordinárias mensais; as extraordinárias dependem de convocação do presidente.","A periodicidade ordinária é mensal, não semanal.","Uma reunião anual não corresponde à periodicidade mensal indicada.","Uma reunião semestral deixaria de realizar as ordinárias mensais."]],
[2,"CMN: papel e composição",0,"Qual das opções é um dos objetivos do CMN?","Zelar pela liquidez e solvência das instituições financeiras.","Executar diariamente a política cambial no mercado.","Fiscalizar pessoalmente cada instituição financeira.","Preparar as atas das reuniões do conselho.","O CMN zela por meio de regras; a execução e a fiscalização cabem ao BC.",0,"Os objetivos do CMN são verbos de direção e de zelo. Descarte as ações operacionais do dia a dia.",["O CMN zela por meio de regras; a execução e a fiscalização cabem ao BC.","Executar operações cambiais é atividade do BC; o CMN define as diretrizes.","Fiscalizar diretamente é função supervisora do BC, não objetivo executivo do conselho.","Preparar atas é tarefa administrativa da Secretaria-Executiva, não esse objetivo do CMN."]],
[2,"Meta de inflação",1,"Qual item é elemento do regime de metas para a inflação?","Autonomia do Banco Central na adoção das medidas para cumprir a meta.","Meta mantida em sigilo até o fim do período.","Decisões da política monetária sem necessidade de justificativa.","Ausência de prestação de contas da autoridade monetária.","Meta pública e prévia, autonomia, comunicação transparente e prestação de contas.",0,"Procure o item que reforça a capacidade do BC de agir sem interferência. Descarte o que sugere sigilo.",["Meta pública e prévia, autonomia, comunicação transparente e prestação de contas.","A meta deve ser pública e anunciada previamente, permitindo previsibilidade.","Transparência exige comunicação dos objetivos e das razões das decisões.","A autoridade monetária deve prestar contas, inclusive quando descumpre a meta."]],
[2,"CMN x Banco Central",1,"Em que situação o CMN pode outorgar ao Banco Central o monopólio das operações de câmbio?","Em caso de grave desequilíbrio, ou sua iminência, no balanço de pagamentos.","Sempre que a inflação ficar acima da meta.","Quando houver aumento da taxa Selic.","Em qualquer reunião ordinária, por decisão do presidente.","É medida excepcional, ligada ao desequilíbrio do balanço de pagamentos.",0,"É uma medida excepcional, ligada às contas do país com o exterior, e não à inflação ou aos juros.",["É medida excepcional, ligada ao desequilíbrio do balanço de pagamentos.","Inflação acima da meta, por si só, não é a hipótese de grave desequilíbrio cambial citada.","A mudança da Selic não é o requisito para esse monopólio excepcional.","A medida exige grave desequilíbrio do balanço de pagamentos ou sua iminência, não uma decisão rotineira."]],
[2,"CMN x Banco Central",1,"Sobre os orçamentos monetários, que estimam as necessidades globais de moeda e crédito, é correto afirmar:","São preparados pelo Banco Central e aprovados pelo CMN.","São preparados pelo CMN e aprovados pela CVM.","São preparados pela Comoc e aprovados pelo Copom.","São preparados e aprovados apenas pelo Banco Central.","O BC prepara; o CMN aprova.",0,"Quem elabora o orçamento não é quem o aprova. O aprovador é o órgão normativo.",["O BC prepara; o CMN aprova.","O BC prepara e o CMN aprova; a CVM não aprova o orçamento monetário.","A Comoc assessora e o Copom decide a Selic; não substituem BC e CMN nessas etapas.","O BC prepara, mas a aprovação é do CMN, não do próprio BC."]],
[2,"Comoc e Secretaria",1,"Sobre as reuniões da Comoc, é correto afirmar que:","Ocorrem ordinariamente uma vez por mês e têm caráter reservado.","São abertas ao público e ocorrem semestralmente.","Só podem ser convocadas pelo Ministro da Fazenda.","Ocorrem apenas em caso de crise, sem periodicidade fixa.","Reunião mensal ordinária, extraordinária a qualquer tempo, com caráter reservado.",0,"Pense na regularidade de um calendário e no sigilo, características de um órgão técnico de apoio.",["Reunião mensal ordinária, extraordinária a qualquer tempo, com caráter reservado.","As ordinárias são mensais e reservadas, não públicas e semestrais.","A convocação extraordinária cabe ao coordenador ou à maioria dos membros, não exclusivamente ao Ministro da Fazenda.","Há reuniões ordinárias mensais, além das extraordinárias."]],
[2,"CMN: papel e composição",1,"Um município quer contrair um empréstimo externo. Qual é o papel do CMN nesse processo?","Colaborar com o Senado Federal na instrução do processo.","Aprovar sozinho a operação, sem outro órgão.","Executar a operação por meio do Banco Central.","Nenhum; a matéria é competência exclusiva da CVM.","O CMN colabora com o Senado na instrução de empréstimos externos de estados, DF e municípios.",0,"O CMN participa do processo ao lado de outro órgão, sem decidir sozinho.",["O CMN colabora com o Senado na instrução de empréstimos externos de estados, DF e municípios.","O CMN colabora com o Senado; não aprova sozinho esse processo.","O papel descrito é de instrução em colaboração com o Senado, não de execução da operação.","A competência descrita envolve CMN e Senado, não exclusivamente a CVM."]],
[2,"CMN x Banco Central",2,"Assinale a alternativa INCORRETA sobre o CMN.","A Comoc, que o assessora, delibera no lugar do CMN em suas reuniões.","Define a meta de inflação, que o Banco Central deve perseguir.","Tem funções normativas e não executivas.","A Secretaria-Executiva do CMN é exercida pelo Banco Central.","A Comoc só assessora tecnicamente; quem delibera é o CMN.",0,"Uma das frases altera o papel de um órgão que só dá apoio técnico.",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. A Comoc só assessora tecnicamente; quem delibera é o CMN.","O CMN define a meta e o BC atua para alcançá-la; a afirmação descreve corretamente os papéis. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","O CMN faz normas e diretrizes, sem executar as operações; esta afirmação é verdadeira. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","O Banco Central exerce a Secretaria-Executiva; a afirmação não contém o erro pedido. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[1,"Mercados",3,"Considere as afirmações: I. O spread bancário é a diferença entre a taxa cobrada do tomador e a taxa paga ao poupador. II. A prestação de serviços inclui a gestão de recursos de terceiros e os meios de pagamento. III. O mercado de capitais atende, principalmente, necessidades de recursos de curtíssimo prazo. Está(ão) correta(s):","Apenas I e II.","Apenas I e III.","Apenas II e III.","I, II e III.","A III está errada: o curtíssimo prazo é do mercado monetário; capitais trata do longo prazo.",0,"",["A III está errada: o curtíssimo prazo é do mercado monetário; capitais trata do longo prazo.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir II, que faz parte do conjunto correto. A III está errada: o curtíssimo prazo é do mercado monetário; capitais trata do longo prazo.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir I, que faz parte do conjunto correto. A III está errada: o curtíssimo prazo é do mercado monetário; capitais trata do longo prazo.","Inclui III, que não deve fazer parte do conjunto correto. A III está errada: o curtíssimo prazo é do mercado monetário; capitais trata do longo prazo."]],
[1,"Mercados",3,"Uma empresa emite debêntures para financiar uma nova planta, converte em reais um pagamento recebido em dólares e toma capital de giro de curto prazo em um banco. Em quais mercados ocorrem, respectivamente, essas três operações?","Capitais, câmbio e crédito.","Monetário, câmbio e capitais.","Capitais, monetário e crédito.","Crédito, câmbio e capitais.","Debêntures: capitais; conversão de moeda: câmbio; capital de giro: crédito.",0,"",["Debêntures: capitais; conversão de moeda: câmbio; capital de giro: crédito.","Debêntures pertencem a capitais; capital de giro bancário é crédito, não capitais.","A conversão entre dólares e reais é câmbio, não monetário.","Emitir debêntures é capitais; tomar capital de giro é crédito. As duas posições foram trocadas."]],
[1,"Spread",3,"Um banco capta a 8% a.a. e empresta a 20% a.a. Considere que 3% do valor emprestado se perde por inadimplência e que os custos administrativos equivalem a 2% do valor emprestado. Qual a margem que sobra, em pontos percentuais?","7 p.p.","12 p.p.","9 p.p.","5 p.p.","Spread de 12 p.p. menos 3 p.p. de inadimplência e 2 p.p. de custos resulta em 7 p.p.",0,"",["Spread de 12 p.p. menos 3 p.p. de inadimplência e 2 p.p. de custos resulta em 7 p.p.","12 p.p. é o spread bruto; ainda faltam descontar 3 p.p. de perdas e 2 p.p. de custos.","9 p.p. desconta as perdas, mas deixa de descontar os 2 p.p. de custos administrativos.","5 p.p. exigiria descontar 2 p.p. a mais do que os custos e as perdas informados. A conta é 20 − 8 − 3 − 2 = 7 p.p."]],
[1,"Agentes e intermediação",3,"Assinale a alternativa INCORRETA sobre a intermediação financeira.","Ela elimina o risco de crédito, pois o banco repassa integralmente as perdas ao poupador.","Uma mesma empresa pode ser superavitária em um período e deficitária em outro.","O spread remunera os custos e o risco assumidos pela instituição.","Os agentes superavitários têm sobra de recursos, e os deficitários precisam de recursos.","O banco assume o risco da intermediação; ela não o elimina nem o repassa integralmente ao poupador.",0,"",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. O banco assume o risco da intermediação; ela não o elimina nem o repassa integralmente ao poupador.","A posição de uma empresa pode mudar conforme ela tenha sobra ou necessidade de recursos em cada período. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Spread remunera os custos e o risco de crédito assumidos pelo intermediário. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","As definições estão certas: superavitário tem sobra e deficitário precisa de recursos. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[1,"Estrutura do SFN",3,"Uma instituição que capta depósitos e concede crédito ao público, a norma que fixa limites a essas operações e o órgão que verifica o cumprimento dessa norma correspondem, respectivamente, a quais níveis do SFN?","Entidade operacional, órgão normativo e entidade supervisora.","Órgão normativo, entidade operacional e entidade supervisora.","Entidade supervisora, órgão normativo e entidade operacional.","Entidade operacional, entidade supervisora e órgão normativo.","Quem atende o público opera; a regra vem do normativo; a verificação é da supervisora.",0,"",["Quem atende o público opera; a regra vem do normativo; a verificação é da supervisora.","Captação e crédito ao público são operações; editar a regra é normatização. As duas primeiras funções foram trocadas.","Atender o público é função operacional; verificar a norma é supervisão.","A regra vem do normativo e sua verificação é da supervisora; as duas últimas funções foram trocadas."]],
[2,"Meta de inflação",3,"Considere as afirmações sobre o regime de metas: I. O CMN define a meta e o Banco Central adota as medidas para alcançá-la. II. A inflação acumulada em 12 meses é comparada mês a mês com a meta e a tolerância. III. Mudanças na meta ou na tolerância devem ser anunciadas com 12 meses de antecedência. Está(ão) correta(s):","Apenas I e II.","Apenas II e III.","I, II e III.","Apenas I.","A III está errada: a antecedência mínima é de 36 meses.",0,"",["A III está errada: a antecedência mínima é de 36 meses.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir I, que faz parte do conjunto correto. A III está errada: a antecedência mínima é de 36 meses.","Inclui III, que não deve fazer parte do conjunto correto. A III está errada: a antecedência mínima é de 36 meses.","Deixa de incluir II, que faz parte do conjunto correto. A III está errada: a antecedência mínima é de 36 meses."]],
[2,"Reuniões e normas",3,"Os três membros do CMN votam uma proposta: o Ministro da Fazenda e o Ministro do Planejamento e Orçamento votam a favor, e o Presidente do Banco Central vota contra. Considerando a regra de decisão descrita na aula, o que ocorre?","A proposta é aprovada, pois dois de três votos formam maioria simples.","A proposta é rejeitada, pois exige unanimidade.","A proposta depende de aprovação prévia da Comoc.","A proposta fica suspensa até a reunião seguinte, ad referendum.","As decisões saem por maioria simples de votos.",0,"",["As decisões saem por maioria simples de votos.","A maioria simples é suficiente: dois votos favoráveis entre três; unanimidade não é exigida.","A Comoc presta assessoramento técnico, mas não substitui a votação do conselho.","Ad referendum é a decisão urgente do presidente submetida depois aos membros; aqui já houve votação e maioria."]],
[2,"CMN x Banco Central",3,"Associe: (1) define a meta de inflação; (2) define a meta da taxa Selic; (3) manifesta-se previamente sobre assuntos de competência do CMN; (4) exerce a Secretaria-Executiva do CMN.","(1) CMN; (2) Copom; (3) Comoc; (4) Banco Central.","(1) Copom; (2) CMN; (3) Comoc; (4) Banco Central.","(1) CMN; (2) Comoc; (3) Copom; (4) Banco Central.","(1) CMN; (2) Copom; (3) Banco Central; (4) Comoc.","Meta de inflação: CMN; Selic: Copom; manifestação prévia: Comoc; secretaria: Banco Central.",0,"",["Meta de inflação: CMN; Selic: Copom; manifestação prévia: Comoc; secretaria: Banco Central.","Troca as duas metas: inflação é do CMN e Selic é do Copom.","Troca os comitês: Copom define Selic e Comoc presta manifestação prévia.","Troca assessoramento e Secretaria: a manifestação é da Comoc e a Secretaria é do BC."]],
[2,"CMN: papel e composição",3,"Assinale a alternativa que NÃO é competência do CMN.","Aprovar individualmente cada operação de crédito concedida pelas instituições financeiras.","Fixar diretrizes e normas da política cambial.","Limitar taxas de juros, descontos e comissões, sempre que necessário.","Determinar o percentual máximo emprestado a um mesmo cliente ou grupo de empresas.","O CMN fixa regras e limites gerais; não aprova operações individuais.",0,"",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. O CMN fixa regras e limites gerais; não aprova operações individuais.","Diretrizes cambiais são regras gerais e estão entre as competências normativas do CMN. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Limitar juros, descontos e comissões é uma competência normativa prevista para o CMN. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Fixar o limite de concentração por cliente é normatizar, não aprovar individualmente cada empréstimo. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[2,"Comoc e Secretaria",3,"Qual dos itens abaixo NÃO é membro da Comoc, segundo a aula?","O Ministro do Planejamento e Orçamento.","O Presidente da CVM.","O Secretário do Tesouro Nacional.","Quatro diretores do Banco Central.","O Ministro integra o CMN; na Comoc está o Secretário-Executivo do ministério.",0,"",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. O Ministro integra o CMN; na Comoc está o Secretário-Executivo do ministério.","O Presidente da CVM está expressamente incluído entre os membros da Comoc. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","O Secretário do Tesouro Nacional integra a composição da Comoc descrita. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Quatro diretores do Banco Central integram a Comoc; não são a ausência pedida. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[3,"Natureza e funções",0,"O Banco Central do Brasil é classificado como:","Autarquia de natureza especial","Empresa pública vinculada ao Ministério da Fazenda","Órgão subordinado hierarquicamente ao CMN","Sociedade de economia mista","Não há vinculação a Ministério, tutela nem subordinação hierárquica.",0,"Pense no que a aula diz sobre a falta de vinculação a ministério e de subordinação hierárquica.",["Não há vinculação a Ministério, tutela nem subordinação hierárquica.","O BACEN é autarquia especial sem vinculação ministerial, não empresa pública da Fazenda.","O BACEN executa políticas do CMN, mas isso não configura subordinação hierárquica.","Sua natureza jurídica é autarquia, não sociedade empresarial de economia mista."]],
[3,"Natureza e funções",0,"Qual é o objetivo fundamental do Banco Central do Brasil?","Assegurar a estabilidade dos preços","Maximizar o lucro do sistema bancário","Emitir títulos da dívida pública","Fixar a meta de inflação","O objetivo fundamental é a estabilidade dos preços; a meta quem define é o CMN.",0,"O objetivo fundamental tem a ver com o poder de compra da moeda ao longo do tempo.",["O objetivo fundamental é a estabilidade dos preços; a meta quem define é o CMN.","A finalidade fundamental é estabilidade dos preços, não maximizar lucro bancário.","O BACEN não pode emitir títulos próprios de dívida desde 2002.","A meta é definida pelo CMN; o objetivo do BC é manter a estabilidade dos preços."]],
[3,"Diretoria e mandato",0,"Quantos membros tem a Diretoria Colegiada do BACEN?","9 (1 presidente e 8 diretores)","3","5","12","São 9 membros: 1 presidente e 8 diretores.",0,"Conte o presidente mais os diretores: a soma é um número ímpar menor que dez.",["São 9 membros: 1 presidente e 8 diretores.","O valor indicado nesta opção (3) não corresponde ao resultado ou requisito pedido (9 (1 presidente e 8 diretores)). São 9 membros: 1 presidente e 8 diretores.","O valor indicado nesta opção (5) não corresponde ao resultado ou requisito pedido (9 (1 presidente e 8 diretores)). São 9 membros: 1 presidente e 8 diretores.","O valor indicado nesta opção (12) não corresponde ao resultado ou requisito pedido (9 (1 presidente e 8 diretores)). São 9 membros: 1 presidente e 8 diretores."]],
[3,"Diretoria e mandato",0,"Qual a duração do mandato dos diretores do BACEN?","4 anos, com uma recondução possível","2 anos, sem recondução","8 anos, sem recondução","Indeterminada, enquanto o Presidente da República desejar","Mandato fixo de 4 anos, reconduzível uma vez (4 + 4).",0,"O mandato é fixo e pode ser renovado uma vez, o que dobra o período máximo.",["Mandato fixo de 4 anos, reconduzível uma vez (4 + 4).","O mandato inicial é de quatro anos e admite uma recondução.","Oito anos é o total possível de dois mandatos; não a duração de um mandato único.","O mandato é fixo; não depende apenas da vontade do Presidente da República."]],
[3,"Natureza e funções",0,"Quando o Banco Central oferece empréstimos às instituições financeiras, atua como:","Banco dos bancos","Banco do governo","Supervisor do SFN","Casa da Moeda","Banco dos bancos: recolhimentos, redesconto e empréstimos às instituições.",0,"Pense no papel de quem empresta às próprias instituições financeiras, como um banco para elas.",["Banco dos bancos: recolhimentos, redesconto e empréstimos às instituições.","Banco do governo envolve reservas e funções com títulos públicos, não empréstimos às instituições.","Fiscalizar e autorizar caracteriza supervisão; emprestar às instituições é banco dos bancos.","A Casa da Moeda realiza a impressão física de moeda; a emissão econômica e a política monetária cabem ao BACEN. Para esta pergunta: Banco dos bancos: recolhimentos, redesconto e empréstimos às instituições."]],
[3,"Diretoria e mandato",1,"Quem nomeia os diretores do BACEN e quem precisa aprová-los antes da nomeação?","Nomeia o Presidente da República; aprova o Senado Federal.","Nomeia o CMN; aprova a Câmara dos Deputados.","Nomeia o Senado Federal; aprova o Presidente da República.","Nomeia o Ministro da Fazenda; aprova o CMN.","Fluxo: indicação (Presidente), aprovação (Senado), nomeação (Presidente), mandato.",0,"O caminho tem quatro etapas: indicação e nomeação vêm de quem chefia o Executivo, e há uma aprovação no meio.",["Fluxo: indicação (Presidente), aprovação (Senado), nomeação (Presidente), mandato.","O CMN não nomeia e a Câmara não dá essa aprovação; os papéis são Presidente e Senado.","Inverte os papéis: o Senado aprova e o Presidente da República nomeia.","Ministro da Fazenda e CMN não substituem Presidente e Senado na nomeação e aprovação."]],
[3,"Política monetária",1,"Se a inflação ficar fora do intervalo de tolerância por seis meses consecutivos, ocorre:","Descumprimento da meta, e o BACEN deve divulgar as razões.","Substituição automática do Presidente do BACEN.","Alteração imediata da meta pelo CMN.","Nada, pois só o descumprimento anual é considerado.","Seis meses consecutivos fora da tolerância configuram descumprimento da meta.",0,"O prazo conta meses seguidos fora da tolerância, e não o ano-calendário.",["Seis meses consecutivos fora da tolerância configuram descumprimento da meta.","O descumprimento exige comunicação das razões, não substituição automática do presidente.","A meta não muda automaticamente para acomodar a inflação observada.","A regra contínua conta seis meses consecutivos fora da tolerância, sem esperar o encerramento anual."]],
[3,"Competências",1,"Quem imprime o dinheiro e quem faz a emissão da moeda?","A Casa da Moeda imprime; o BACEN faz a emissão.","O BACEN imprime; a Casa da Moeda faz a emissão.","O CMN imprime; o BACEN faz a emissão.","O Tesouro imprime; a CVM faz a emissão.","Emissão é o processo econômico (BACEN); impressão é o processo físico (Casa da Moeda).",0,"A emissão é um processo econômico (inserir moeda na economia); a impressão é um processo físico.",["Emissão é o processo econômico (BACEN); impressão é o processo físico (Casa da Moeda).","Inverte os processos: impressão física é da Casa da Moeda; emissão econômica é do BACEN.","O CMN normatiza, mas não imprime as cédulas.","O Tesouro não imprime e a CVM não emite moeda; os papéis são Casa da Moeda e BACEN."]],
[3,"Competências",1,"Sobre os recolhimentos compulsórios, o BACEN:","Determina os percentuais e recebe os recolhimentos.","Apenas recebe, pois os percentuais são fixados pela CVM.","Apenas determina, pois quem recebe é o Tesouro.","Não tem relação com eles.","O BACEN determina os percentuais e recebe os recolhimentos compulsórios.",0,"O BACEN atua nas duas pontas dos compulsórios: fixar o quanto e receber o recolhimento.",["O BACEN determina os percentuais e recebe os recolhimentos compulsórios.","Os percentuais também são determinados pelo BACEN, não pela CVM.","O BACEN determina e recebe; o recebimento não é atribuído ao Tesouro nessa regra.","Os compulsórios são um dos instrumentos diretamente administrados pelo BACEN."]],
[3,"BACEN x CMN",1,"Pelo macete da aula, “zelar pela liquidez e solvência das instituições financeiras” está associado a:","CMN","BACEN","CVM","Copom","Liquidez e solvência: CMN. Estabilidade e eficiência do sistema financeiro: BACEN.",0,"O macete separa dois sentidos de “zelar”: um ligado à saúde financeira das instituições e outro à estabilidade do sistema. Veja a que órgão normativo cabe o primeiro.",["Liquidez e solvência: CMN. Estabilidade e eficiência do sistema financeiro: BACEN.","O BACEN executa a política monetária e supervisiona instituições; não substitui o CMN na definição da meta de inflação. Para esta pergunta: Liquidez e solvência: CMN. Estabilidade e eficiência do sistema financeiro: BACEN.","A CVM regula e supervisiona o mercado de valores mobiliários, como ações, debêntures e fundos. Para esta pergunta: Liquidez e solvência: CMN. Estabilidade e eficiência do sistema financeiro: BACEN.","O Copom é o comitê do Banco Central que define a meta da taxa Selic; não define a meta de inflação nem assessora o CMN como a Comoc. Para esta pergunta: Liquidez e solvência: CMN. Estabilidade e eficiência do sistema financeiro: BACEN."]],
[3,"Política monetária",1,"No descumprimento da meta de inflação, o BACEN deve divulgar as razões por meio de:","Nota no Relatório de Política Monetária e carta aberta ao Ministro da Fazenda.","Decreto presidencial e nota na CVM.","Resolução do Senado Federal e carta ao Congresso.","Circular da Comoc e carta ao Copom.","A carta aberta vai ao Ministro da Fazenda, que preside o CMN.",0,"Pense em um documento que o BC já publica regularmente e em uma comunicação dirigida a uma autoridade.",["A carta aberta vai ao Ministro da Fazenda, que preside o CMN.","A prestação de contas descrita é nota no relatório e carta à Fazenda, não decreto nem nota na CVM.","Não se exige resolução do Senado nem carta ao Congresso nesse procedimento.","Comoc e Copom não são os destinatários da carta aberta prevista para descumprimento."]],
[3,"Diretoria e mandato",1,"Em que momento do mandato do Presidente da República começa o mandato do Presidente do BACEN?","No início do terceiro ano.","No primeiro dia do primeiro ano.","No fim do segundo ano.","No início do quarto ano.","O mandato do Presidente do BACEN começa no início do 3º ano do mandato presidencial.",0,"Lembre-se do cronograma escalonado: o presidente do BACEN não começa junto com o presidente da República.",["O mandato do Presidente do BACEN começa no início do 3º ano do mandato presidencial.","O início é no terceiro ano; não coincide com a posse presidencial.","O marco indicado é o início do terceiro ano, não o fim do segundo.","O quarto ano é posterior ao início de mandato previsto no terceiro."]],
[3,"Autorização e supervisão",1,"Qual das situações exige autorização do BACEN à instituição financeira?","Praticar operações de câmbio.","Abrir uma nova conta corrente para um cliente.","Lançar uma campanha publicitária.","Trocar o fornecedor de material de escritório.","Exigem autorização: funcionar, câmbio, alterar estatutos, transferir controle, entre outras.",0,"Procure a operação que muda a atuação ou a estrutura da própria instituição, e não uma rotina do dia a dia.",["Exigem autorização: funcionar, câmbio, alterar estatutos, transferir controle, entre outras.","Abrir a conta de um cliente é atendimento operacional, não a autorização institucional descrita.","Campanha publicitária não é o ato de câmbio ou reorganização sujeito à autorização citada.","Trocar material de escritório não é o ato institucional de autorização apontado pela aula."]],
[3,"Competências",1,"Desde 2002, o BACEN:","Não pode mais emitir títulos de dívida pública.","Pode emitir títulos de dívida pública sem limites.","Passou a imprimir papel-moeda diretamente.","Deixou de executar a política monetária.","Os títulos emitidos antes já foram resgatados.",0,"A vedação é recente e se refere à emissão de títulos pela autarquia, e não à emissão de moeda.",["Os títulos emitidos antes já foram resgatados.","Desde 2002 o BACEN não pode emitir seus próprios títulos de dívida pública.","Imprimir moeda continua sendo o processo físico da Casa da Moeda, distinto da emissão econômica pelo BACEN.","A vedação refere-se a emitir dívida própria; não extingue a execução da política monetária."]],
[3,"Natureza e funções",1,"Entre as características do BACEN, estão:","Autonomia, diretores com estabilidade e sede em Brasília com nove regionais.","Subordinação ao Ministro da Fazenda e diretores demissíveis a qualquer tempo.","Sede em São Paulo e quatro regionais.","Autonomia só administrativa e mandato indeterminado.","Autarquia especial, principal executor das políticas do CMN, autônoma, com diretores estáveis.",0,"Reúna as características gerais do BACEN: independência, situação dos diretores e estrutura física.",["Autarquia especial, principal executor das políticas do CMN, autônoma, com diretores estáveis.","O BACEN não tem subordinação hierárquica a ministério; os diretores têm mandato e estabilidade.","A sede é Brasília; a aula informa nove regionais, não quatro.","A autonomia possui quatro dimensões e os mandatos têm duração determinada."]],
[3,"Diretoria e mandato",2,"Em um mandato de quatro anos do Presidente da República, quantos diretores do BACEN iniciam mandato a cada ano, e em que ano começa o Presidente do BACEN?","Dois diretores por ano; o Presidente do BACEN no terceiro ano.","Um diretor por ano; o Presidente do BACEN no primeiro ano.","Dois diretores por ano; o Presidente do BACEN no primeiro ano.","Quatro diretores a cada dois anos; o Presidente do BACEN no quarto ano.","São 2 diretores por ano (8 no total), e o Presidente começa no 3º ano.",0,"São 8 diretores distribuídos em 4 anos, e o presidente tem um ano de início próprio.",["São 2 diretores por ano (8 no total), e o Presidente começa no 3º ano.","São dois diretores por ano, e o Presidente do BACEN começa no terceiro ano.","Acerta os dois diretores, mas antecipa indevidamente o início do Presidente do BACEN.","A distribuição é anual, dois diretores por ano; o Presidente começa no terceiro, não no quarto."]],
[3,"Diretoria e mandato",2,"Como segue a proposta de exoneração de um diretor do BACEN por desempenho insuficiente, comprovado e recorrente?","O CMN submete a proposta ao Presidente da República, condicionada à prévia aprovação do Senado por maioria absoluta.","O Presidente da República decide sozinho, sem consultar o Senado.","O Senado propõe e o CMN aprova por maioria simples.","A Comoc propõe e o Ministro da Fazenda decide.","O CMN propõe, e o Senado aprova previamente, por maioria absoluta.",0,"A exoneração por desempenho exige três etapas formais, envolvendo três atores.",["O CMN propõe, e o Senado aprova previamente, por maioria absoluta.","A exoneração por esse motivo exige aprovação prévia do Senado por maioria absoluta.","Inverte o procedimento: o CMN apresenta a proposta e o Senado dá a aprovação prévia.","Comoc e Ministro da Fazenda não substituem CMN, Senado e Presidente da República nesse processo."]],
[3,"Política monetária",2,"Depois do descumprimento da meta e da primeira comunicação, uma nova comunicação do BACEN ocorre:","Somente se a inflação não voltar ao intervalo no prazo ou se for preciso atualizar as providências ou o prazo.","A cada mês, até a inflação voltar ao intervalo.","Apenas por decisão do Senado Federal.","Nunca, pois a primeira carta encerra o assunto.","A nova comunicação é exceção: prazo estourado ou necessidade de atualizar as providências.",0,"A segunda comunicação é uma exceção: só ocorre em duas situações específicas.",["A nova comunicação é exceção: prazo estourado ou necessidade de atualizar as providências.","Não há obrigação de repetir a carta mensalmente; a nova comunicação depende das condições previstas.","O procedimento não depende de uma decisão do Senado.","É necessária nova comunicação se o prazo não for cumprido ou as providências precisarem ser atualizadas."]],
[3,"BACEN x CMN",2,"Um enunciado diz que o órgão deve “efetuar operações de compra e venda de títulos públicos federais como instrumento de política monetária”. Pelo conteúdo da aula, trata-se de atribuição do:","BACEN, como banco do governo e executor da política monetária.","CMN, que executa a política monetária.","CVM, que supervisiona o mercado de capitais.","Tesouro Nacional, por ser o banco dos bancos.","Verbos de execução (efetuar, emitir, realizar) apontam para o BACEN.",0,"Os verbos “efetuar”, “emitir” e “realizar” costumam indicar o órgão que executa, e não o que normatiza.",["Verbos de execução (efetuar, emitir, realizar) apontam para o BACEN.","O CMN estabelece diretrizes e normas gerais; não executa operações nem fiscaliza diretamente as instituições. Para esta pergunta: Verbos de execução (efetuar, emitir, realizar) apontam para o BACEN.","A CVM regula e supervisiona o mercado de valores mobiliários, como ações, debêntures e fundos. Para esta pergunta: Verbos de execução (efetuar, emitir, realizar) apontam para o BACEN.","O Tesouro atua na administração das finanças e da dívida pública; não substitui as competências do CMN, BACEN ou CVM descritas na aula. Para esta pergunta: Verbos de execução (efetuar, emitir, realizar) apontam para o BACEN."]],
[3,"Autorização e supervisão",2,"Sobre a instalação de novas agências de instituições financeiras domiciliadas no exterior, o BACEN:","Pode reconhecê-la como de interesse do Governo brasileiro, após análise técnica.","Não participa do processo, que é da CVM.","Só pode autorizar com prévia aprovação do Senado Federal.","Autoriza automaticamente, sem análise técnica.","A autorização envolve análise técnica e reconhecimento de interesse do Governo.",0,"A aula cita duas condições para o BACEN aceitar essa instalação.",["A autorização envolve análise técnica e reconhecimento de interesse do Governo.","O BACEN participa da autorização; a CVM não assume esse processo.","O requisito descrito é análise técnica e reconhecimento do interesse governamental, não aprovação prévia do Senado.","O reconhecimento exige análise técnica, portanto não é automático."]],
[3,"Competências",3,"Considere as afirmações: I. O BACEN determina os percentuais dos recolhimentos compulsórios e os recebe. II. A impressão de moeda é feita pelo BACEN, e a emissão, pela Casa da Moeda. III. Desde 2002, o BACEN não pode emitir títulos de dívida pública. Está(ão) correta(s):","Apenas I e III.","Apenas I e II.","Apenas II e III.","I, II e III.","A II inverte: a emissão é do BACEN, e a impressão é da Casa da Moeda.",0,"",["A II inverte: a emissão é do BACEN, e a impressão é da Casa da Moeda.","Inclui II, que não deve fazer parte do conjunto correto. Deixa de incluir III, que faz parte do conjunto correto. A II inverte: a emissão é do BACEN, e a impressão é da Casa da Moeda.","Inclui II, que não deve fazer parte do conjunto correto. Deixa de incluir I, que faz parte do conjunto correto. A II inverte: a emissão é do BACEN, e a impressão é da Casa da Moeda.","Inclui II, que não deve fazer parte do conjunto correto. A II inverte: a emissão é do BACEN, e a impressão é da Casa da Moeda."]],
[3,"Natureza e funções",3,"Assinale a alternativa INCORRETA sobre o BACEN.","É subordinado hierarquicamente ao Ministério da Fazenda, que pode exonerar seus diretores livremente.","É autarquia de natureza especial, com autonomia técnica, operacional, administrativa e financeira.","Seus diretores têm mandato fixo e estabilidade durante o mandato.","É o principal executor das políticas definidas pelo CMN.","O BACEN não tem vinculação a Ministério nem subordinação hierárquica.",0,"",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. O BACEN não tem vinculação a Ministério nem subordinação hierárquica.","As quatro dimensões de autonomia fazem parte da natureza especial do BACEN. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Mandato fixo e estabilidade protegem os diretores de exoneração livre. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","O BACEN executa as políticas estabelecidas pelo conselho normativo CMN. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[3,"Diretoria e mandato",3,"Considere as etapas de um diretor do BACEN: (1) nomeação; (2) aprovação; (3) indicação; (4) início do mandato. Qual é a ordem correta?","3, 2, 1, 4.","3, 1, 2, 4.","1, 3, 2, 4.","2, 3, 1, 4.","Indicação (Presidente), aprovação (Senado), nomeação (Presidente), mandato.",0,"",["Indicação (Presidente), aprovação (Senado), nomeação (Presidente), mandato.","Coloca a nomeação antes da aprovação do Senado; a aprovação deve precedê-la.","A nomeação não pode preceder a indicação e a aprovação.","A aprovação do Senado vem depois da indicação do Presidente da República."]],
[3,"Natureza e funções",3,"Classifique as atribuições: (a) receber depósitos voluntários e recolhimentos compulsórios das instituições; (b) ser depositário das reservas internacionais; (c) autorizar, normatizar, fiscalizar e intervir nas instituições. Correspondem, respectivamente, às funções de:","Banco dos bancos, banco do governo e supervisor do SFN.","Banco do governo, banco dos bancos e supervisor do SFN.","Banco dos bancos, supervisor do SFN e banco do governo.","Executor da política monetária, banco dos bancos e banco do governo.","(a) banco dos bancos; (b) banco do governo; (c) supervisor do SFN.",0,"",["(a) banco dos bancos; (b) banco do governo; (c) supervisor do SFN.","Troca as duas primeiras funções: receber recursos das instituições é banco dos bancos; reservas são banco do governo.","Reservas internacionais correspondem ao banco do governo; autorizar e fiscalizar corresponde à supervisão.","Receber compulsórios corresponde ao banco dos bancos; autorizar e intervir não é banco do governo."]],
[3,"Política monetária",3,"A inflação ficou acima do teto da tolerância por cinco meses consecutivos e, no sexto mês, voltou ao intervalo. Depois, ficou fora por seis meses seguidos. Pela regra da aula, o que se pode afirmar?","Houve descumprimento só após os seis meses consecutivos fora do intervalo, e o BACEN deve divulgar nota e carta aberta.","Houve descumprimento já nos cinco primeiros meses.","Não houve descumprimento, pois a meta é anual.","O descumprimento só ocorre se o CMN assim decidir.","Contam meses consecutivos: o bloco de cinco não configura; os seis seguidos configuram.",0,"",["Contam meses consecutivos: o bloco de cinco não configura; os seis seguidos configuram.","Cinco meses não atingem o requisito de seis consecutivos; o retorno à tolerância interrompe a sequência.","A regra é contínua e apurada mensalmente, não apenas ao fim do ano.","O critério é objetivo: seis meses consecutivos fora da tolerância; não depende de decisão discricionária do CMN."]],
[1,"Mercados",0,"Qual mercado do SFN está ligado à proteção contra riscos, por meio de apólices?","De seguros","De câmbio","Monetário","De capitais","O mercado de seguros oferece proteção contra riscos.",0,"Pense no mercado em que se contratam apólices para se proteger de prejuízos.",["O mercado de seguros oferece proteção contra riscos.","O câmbio negocia moedas estrangeiras; não é o mercado de liquidez, de apólices ou de emissão de debêntures. Para esta pergunta: O mercado de seguros oferece proteção contra riscos.","O mercado monetário trata da liquidez e dos juros básicos com operações de curtíssimo e curto prazo. Para esta pergunta: O mercado de seguros oferece proteção contra riscos.","O mercado de capitais envolve ações e títulos corporativos e financia predominantemente o longo prazo, segundo a aula. Para esta pergunta: O mercado de seguros oferece proteção contra riscos."]],
[1,"Serviços",0,"Qual das opções é um exemplo de meio de pagamento oferecido pelas instituições financeiras?","Boleto bancário","Debênture","Apólice de seguro","Ação de companhia aberta","Transferências, cartões e boletos são meios de pagamento (prestação de serviços).",0,"Meio de pagamento é um instrumento para movimentar dinheiro. Descarte o que é título de investimento ou de proteção.",["Transferências, cartões e boletos são meios de pagamento (prestação de serviços).","Debênture é um título de dívida corporativa do mercado de capitais; não moeda estrangeira, apólice ou meio de pagamento. Para esta pergunta: Transferências, cartões e boletos são meios de pagamento (prestação de serviços).","Apólice formaliza um contrato de seguro e a proteção contra riscos; não é um instrumento de pagamento ou crédito bancário. Para esta pergunta: Transferências, cartões e boletos são meios de pagamento (prestação de serviços).","Ação representa participação no capital de uma companhia e é valor mobiliário; não um depósito nem um meio de pagamento. Para esta pergunta: Transferências, cartões e boletos são meios de pagamento (prestação de serviços)."]],
[1,"Agentes e intermediação",0,"Uma pessoa física que aplica R$ 5 mil em um CDB é, nessa relação com o banco, um agente:","Superavitário","Deficitário","Supervisor","Normativo","Quem aplica tem sobra de recursos, logo é superavitário.",0,"Quem aplica o dinheiro está, em relação ao banco, com recursos sobrando.",["Quem aplica tem sobra de recursos, logo é superavitário.","Deficitário é quem necessita de recursos e pode tomar crédito; não é quem aplica uma sobra de caixa. Para esta pergunta: Quem aplica tem sobra de recursos, logo é superavitário.","O nível supervisor fiscaliza o cumprimento das regras; não se confunde com o operador que atende clientes. Para esta pergunta: Quem aplica tem sobra de recursos, logo é superavitário.","O nível normativo define as diretrizes e regras gerais; não atende clientes nem fiscaliza o dia a dia. Para esta pergunta: Quem aplica tem sobra de recursos, logo é superavitário."]],
[1,"Mercados",1,"Qual é a principal diferença entre o mercado de capitais e o mercado de crédito?","O de capitais atende recursos de longo prazo (ações e debêntures); o de crédito, recursos de curto e médio prazo.","O de capitais lida apenas com moedas estrangeiras; o de crédito, só com seguros.","O de capitais é de curtíssimo prazo; o de crédito, de longo prazo.","Não há diferença, pois os dois atendem o mesmo prazo.","Capitais: longo prazo. Crédito: curto e médio prazo.",0,"Compare o prazo típico de cada mercado e o tipo de produto que ele negocia.",["Capitais: longo prazo. Crédito: curto e médio prazo.","Moedas estrangeiras pertencem ao câmbio e proteção por apólices pertence a seguros.","Curtíssimo prazo caracteriza o monetário; capitais financia predominantemente o longo prazo.","Há diferença de instrumentos e de prazo: capitais, longo; crédito, curto e médio segundo a aula."]],
[1,"Spread",1,"Se um banco reduz a taxa que cobra nos empréstimos e mantém a taxa que paga aos poupadores, o que acontece com o spread?","Diminui, pois a diferença entre as taxas fica menor.","Aumenta, pois o banco empresta mais barato.","Permanece igual, pois depende só da captação.","Dobra, pois o risco de inadimplência cai.","Spread é a taxa cobrada menos a taxa paga; reduzir a cobrada o diminui.",0,"Spread é a taxa cobrada menos a taxa paga. Reduza o primeiro termo e observe o resultado da subtração.",["Spread é a taxa cobrada menos a taxa paga; reduzir a cobrada o diminui.","Reduzir o juro cobrado, mantendo o pago, diminui a diferença, não a aumenta.","O spread depende das duas taxas; mudar o juro do empréstimo altera a diferença.","Não há duplicação automática; com captação constante e juro cobrado menor, o spread cai."]],
[1,"Mercados",1,"Uma importadora compra euros para pagar um fornecedor no exterior e, para isso, toma um empréstimo de 90 dias. Quais mercados estão envolvidos?","Câmbio (compra da moeda) e crédito (empréstimo).","Capitais e seguros.","Monetário e previdência fechada.","Apenas o de câmbio.","A compra de moeda é câmbio; o empréstimo de curto prazo é crédito.",0,"Separe a operação de trocar de moeda da operação de tomar dinheiro, e associe cada uma a um mercado.",["A compra de moeda é câmbio; o empréstimo de curto prazo é crédito.","Nenhuma operação descrita é emissão de valores mobiliários ou contratação de seguro.","Comprar euros é câmbio; contratar empréstimo é crédito, não previdência.","Identifica a compra de moeda, mas omite o empréstimo de 90 dias no mercado de crédito."]],
[1,"Mercados",1,"Qual descrição corresponde ao mercado monetário?","Negociação de ativos de curto prazo, como títulos do governo e certificados de depósito, para gerenciar a liquidez da economia.","Negociação de ações e títulos corporativos de longo prazo.","Negociação de moedas estrangeiras.","Negociação de seguros privados e resseguros.","O monetário negocia ativos de curto prazo para gerenciar a liquidez.",0,"Pense no mercado cujo papel é ajustar a quantidade de dinheiro disponível na economia.",["O monetário negocia ativos de curto prazo para gerenciar a liquidez.","Ações e títulos corporativos de longo prazo caracterizam o mercado de capitais.","Negociar moedas estrangeiras caracteriza o mercado de câmbio.","Seguros e resseguros pertencem ao mercado de seguros, não ao monetário."]],
[1,"Estrutura do SFN",1,"Uma corretora de valores e uma cooperativa de crédito, na estrutura do SFN, são classificadas como:","Entidades operacionais","Órgãos normativos","Entidades supervisoras","Autoridades monetárias","Instituições que operam com o público são entidades operacionais.",0,"Ambas atendem diretamente o público. Pense em qual nível da estrutura isso as coloca.",["Instituições que operam com o público são entidades operacionais.","O nível normativo define as diretrizes e regras gerais; não atende clientes nem fiscaliza o dia a dia. Para esta pergunta: Instituições que operam com o público são entidades operacionais.","O nível supervisor fiscaliza o cumprimento das regras; não se confunde com o operador que atende clientes. Para esta pergunta: Instituições que operam com o público são entidades operacionais.","Corretoras e cooperativas atendem clientes como operadores; não são autoridades monetárias."]],
[1,"Spread",2,"Um banco capta a 9% a.a. e empresta a 15% a.a. Se perde 2% do valor emprestado com inadimplência, qual a margem que sobra, em pontos percentuais?","4 p.p.","6 p.p.","2 p.p.","8 p.p.","Spread de 6 p.p. menos 2 p.p. de perdas deixa 4 p.p.",0,"Calcule primeiro o spread e depois subtraia a perda por inadimplência.",["Spread de 6 p.p. menos 2 p.p. de perdas deixa 4 p.p.","6 p.p. é o spread antes de descontar as perdas de 2 p.p.","2 p.p. é o valor das perdas, não a margem restante após 15 − 9 − 2.","8 p.p. soma as perdas ao spread; elas devem ser subtraídas, deixando 4 p.p."]],
[1,"Estrutura do SFN",2,"Considere: I. A intermediação financeira gera o spread. II. Meios de pagamento são prestação de serviços. III. O CMN, como órgão normativo, fiscaliza diariamente as instituições. Está(ão) correta(s):","Apenas I e II.","Apenas I e III.","Apenas II e III.","I, II e III.","A III está errada: a fiscalização é das entidades supervisoras.",0,"Confira cada afirmação isoladamente. Uma delas dá a um órgão normativo uma tarefa diária de fiscalização.",["A III está errada: a fiscalização é das entidades supervisoras.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir II, que faz parte do conjunto correto. A III está errada: a fiscalização é das entidades supervisoras.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir I, que faz parte do conjunto correto. A III está errada: a fiscalização é das entidades supervisoras.","Inclui III, que não deve fazer parte do conjunto correto. A III está errada: a fiscalização é das entidades supervisoras."]],
[1,"Mercados",3,"Uma exportadora converte em reais os dólares recebidos (i), aplica parte do caixa por 30 dias em um CDB (ii) e toma um financiamento de 18 meses para comprar máquinas (iii). Qual alternativa classifica corretamente cada situação?","(i) mercado de câmbio; (ii) empresa como agente superavitária; (iii) mercado de crédito.","(i) mercado monetário; (ii) empresa como agente deficitária; (iii) mercado de capitais.","(i) mercado de câmbio; (ii) empresa como agente deficitária; (iii) mercado de seguros.","(i) mercado de crédito; (ii) empresa como agente superavitária; (iii) mercado de câmbio.","Conversão de moeda: câmbio; aplicar sobra: superavitário; financiamento: crédito.",0,"",["Conversão de moeda: câmbio; aplicar sobra: superavitário; financiamento: crédito.","A conversão é câmbio, a aplicação de sobra torna a empresa superavitária e o financiamento é crédito.","A empresa que aplica a sobra é superavitária; financiar máquinas é crédito, não seguro.","Converter dólares é câmbio; o financiamento é crédito. Só a classificação da aplicação está certa."]],
[1,"Spread",3,"Assinale a alternativa INCORRETA sobre o spread bancário.","O spread é fixado pelo CMN de forma igual para todas as instituições.","Maior risco de inadimplência tende a elevar o spread.","É a diferença entre a taxa cobrada de quem toma e a paga a quem aplica.","Remunera os custos e o risco da intermediação.","O spread remunera custos e risco da instituição; não é fixo nem igual para todas.",0,"",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. O spread remunera custos e risco da instituição; não é fixo nem igual para todas.","Maior risco de calote eleva a perda esperada que o spread precisa remunerar. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","A definição de spread é justamente a diferença entre a taxa cobrada e a paga. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","A intermediação envolve custos e risco, que são remunerados pelo spread. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[1,"Spread",3,"A captação de um banco sobe de 10% para 13% a.a. Ele quer manter uma margem líquida de 6 p.p., depois de cobrir custos de 1,5 p.p. e perdas de 0,5 p.p. Qual taxa de empréstimo deve cobrar?","21%","19%","19,5%","22,5%","13% + 6 + 1,5 + 0,5 = 21%.",0,"",["13% + 6 + 1,5 + 0,5 = 21%.","19% cobre captação e margem desejada, mas omite os 2 p.p. de custos e perdas.","19,5% ainda não cobre integralmente os custos de 1,5 p.p. e perdas de 0,5 p.p.","22,5% excede a taxa necessária: 13 + 6 + 1,5 + 0,5 = 21%."]],
[1,"Estrutura do SFN",3,"Associe cada segmento ao seu órgão normativo e ao seu supervisor: (a) seguros privados; (b) previdência fechada; (c) moeda, crédito, capitais e câmbio.","(a) CNSP e Susep; (b) CNPC e Previc; (c) CMN, com BCB e CVM.","(a) CNPC e Previc; (b) CNSP e Susep; (c) CMN, com BCB e CVM.","(a) CNSP e Susep; (b) CMN e BCB; (c) CNPC, com Previc e CVM.","(a) CMN e BCB; (b) CNPC e Previc; (c) CNSP, com Susep e CVM.","Seguros: CNSP e Susep. Previdência fechada: CNPC e Previc. Mercado financeiro: CMN, BCB e CVM.",0,"",["Seguros: CNSP e Susep. Previdência fechada: CNPC e Previc. Mercado financeiro: CMN, BCB e CVM.","Troca seguros com previdência fechada: seguros têm CNSP/Susep; fechada tem CNPC/Previc.","A fechada não é CMN/BCB e o financeiro não é CNPC/Previc; apenas seguros está certo.","O financeiro não é CNSP/Susep e seguros não é CMN/BCB; só a fechada está certa."]],
[1,"Estrutura do SFN",3,"Considere: I. Corretoras de valores são entidades operacionais. II. A CVM é supervisora do mercado de valores mobiliários. III. O CMN é a entidade que fiscaliza os bancos no dia a dia. IV. O mercado monetário opera no curtíssimo e curto prazo. Estão corretas:","Apenas I, II e IV.","Apenas I, II e III.","Apenas II, III e IV.","I, II, III e IV.","A III está errada: o CMN normatiza; a fiscalização é das supervisoras.",0,"",["A III está errada: o CMN normatiza; a fiscalização é das supervisoras.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir IV, que faz parte do conjunto correto. A III está errada: o CMN normatiza; a fiscalização é das supervisoras.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir I, que faz parte do conjunto correto. A III está errada: o CMN normatiza; a fiscalização é das supervisoras.","Inclui III, que não deve fazer parte do conjunto correto. A III está errada: o CMN normatiza; a fiscalização é das supervisoras."]],

[2,"CMN: papel e composição",0,"O CMN pode limitar taxas de juros, descontos e comissões?","Sim, sempre que necessário, como competência normativa.","Não, pois isso é competência exclusiva da CVM.","Não, pois o CMN só trata de câmbio.","Sim, mas apenas por decisão do Senado.","Limitar juros, descontos e comissões está entre as competências do CMN.",0,"Limitar remunerações é uma regra geral. Pense em quem escreve regras sobre juros e comissões.",["Limitar juros, descontos e comissões está entre as competências do CMN.","A competência normativa para limitar essas taxas é do CMN, não exclusiva da CVM.","As competências do CMN abrangem moeda e crédito, além de câmbio.","Essa competência normativa não fica condicionada a decisão do Senado na regra apresentada."]],

[2,"CMN: papel e composição",3,"Considere: I. Orientar a aplicação dos recursos das instituições é objetivo do CMN. II. Executar diariamente a política cambial no mercado é objetivo do CMN. III. Zelar pela liquidez e solvência das instituições é objetivo do CMN. IV. Coordenar as políticas monetária, creditícia, orçamentária, fiscal e da dívida pública é objetivo do CMN. Estão corretas:","Apenas I, III e IV.","Apenas I, II e III.","Apenas II, III e IV.","I, II, III e IV.","A II está errada: o CMN fixa as diretrizes do câmbio; quem executa é o Banco Central.",0,"",["A II está errada: o CMN fixa as diretrizes do câmbio; quem executa é o Banco Central.","Inclui II, que não deve fazer parte do conjunto correto. Deixa de incluir IV, que faz parte do conjunto correto. A II está errada: o CMN fixa as diretrizes do câmbio; quem executa é o Banco Central.","Inclui II, que não deve fazer parte do conjunto correto. Deixa de incluir I, que faz parte do conjunto correto. A II está errada: o CMN fixa as diretrizes do câmbio; quem executa é o Banco Central.","Inclui II, que não deve fazer parte do conjunto correto. A II está errada: o CMN fixa as diretrizes do câmbio; quem executa é o Banco Central."]],
[2,"Meta de inflação",3,"Em março de 2026, o governo anuncia uma alteração do intervalo de tolerância da meta de inflação. Pela regra de antecedência mínima, a nova regra só poderá valer a partir de:","março de 2029","março de 2027","março de 2028","março de 2030","São 36 meses de antecedência mínima: março de 2026 mais três anos.",0,"",["São 36 meses de antecedência mínima: março de 2026 mais três anos.","Março de 2027 dá só 12 meses; a antecedência mínima é de 36.","Março de 2028 dá só 24 meses; ainda falta um ano.","Março de 2030 seria posterior, mas não é a primeira data possível: os 36 meses completam-se em março de 2029."]],
[2,"CMN x Banco Central",3,"Qual alternativa aponta corretamente quem prepara o orçamento monetário, quem o aprova, quem define a meta de inflação e quem define a meta da Selic?","BC prepara; CMN aprova; CMN define a meta de inflação; Copom define a Selic.","CMN prepara; BC aprova; CMN define a meta de inflação; Copom define a Selic.","BC prepara; CMN aprova; Copom define a meta de inflação; CMN define a Selic.","Comoc prepara; Copom aprova; CMN define a meta de inflação; BC define a Selic.","O BC prepara e o CMN aprova; a meta de inflação é do CMN e a Selic é do Copom.",0,"",["O BC prepara e o CMN aprova; a meta de inflação é do CMN e a Selic é do Copom.","Inverte as etapas do orçamento: o BC prepara e o CMN aprova.","Inverte as metas: inflação é do CMN e Selic é do Copom.","Comoc assessora e Copom define a Selic; não preparam nem aprovam o orçamento monetário."]],

[4,"Natureza e vinculação",2,"Um enunciado afirma que a CVM é subordinada ao Ministério da Fazenda e que o BACEN não tem nenhuma relação com ministérios. Qual a correção adequada?","A CVM é vinculada ao Ministério da Fazenda, mas não subordinada; o BACEN não tem vinculação a Ministério.","A CVM não tem vinculação; o BACEN é subordinado à Fazenda.","Ambos são subordinados ao Ministério da Fazenda.","Ambos não têm vinculação a Ministério.","CVM: vinculada, sem subordinação. BACEN: ausência de vinculação.",0,"Vinculação e subordinação são coisas diferentes. Corrija as duas afirmações do enunciado.",["CVM: vinculada, sem subordinação. BACEN: ausência de vinculação.","Inverte as características: a CVM é vinculada à Fazenda; o BACEN não é subordinado a ela.","Vinculação da CVM não é subordinação; o BACEN também não tem essa subordinação.","A CVM tem vinculação ao Ministério da Fazenda, embora preserve autonomia."]],
[4,"Poderes e penalidades",2,"Qual alternativa descreve corretamente a proibição temporária prevista entre as penalidades da CVM?","Até 20 anos, para atividades ou operações de integrantes do sistema de distribuição ou de entidades com registro na CVM; e até 10 anos, para atuar no mercado de valores mobiliários.","Até 10 anos, para as duas modalidades.","Até 20 anos, para as duas modalidades.","Até 5 anos, sem possibilidade de ampliação.","Duas modalidades: até 20 anos (atividades ou operações) e até 10 anos (atuar no mercado).",0,"São duas proibições com tetos diferentes, e cada uma tem seu alcance.",["Duas modalidades: até 20 anos (atividades ou operações) e até 10 anos (atuar no mercado).","O teto de atividades e operações é 20 anos, não 10.","A proibição de atuar no mercado tem teto de 10 anos, não 20.","Os tetos citados são 20 e 10 anos; não existe esse limite geral de cinco na aula."]],
[4,"Poderes e penalidades",2,"Qual condição a aula destaca para o exercício do poder punitivo da CVM?","Que seja assegurado o direito de ampla defesa.","Que haja prévia autorização do Banco Central.","Que o Senado aprove cada penalidade.","Que a decisão seja tomada apenas pelo presidente da CVM.","O poder punitivo é exercido com ampla defesa.",0,"Penalizar exige respeitar um direito do acusado.",["O poder punitivo é exercido com ampla defesa.","O requisito destacado é assegurar ampla defesa; não se exige autorização prévia do BACEN para cada sanção da CVM.","O Senado não aprova cada penalidade aplicada pela CVM.","Decisão apenas do presidente não substitui a garantia de ampla defesa ao acusado."]],
[4,"Atribuições",2,"Qual alternativa associa corretamente o bloco de atribuições à ação da CVM?","Acesso à informação adequada: assegurar o acesso do público a informações sobre os valores mobiliários e as companhias emissoras.","Proteção dos investidores: fixar a meta de inflação.","Desenvolvimento do mercado: emitir moeda.","Fiscalização e punição: conduzir a política monetária.","Cada bloco corresponde a ações do mercado de valores mobiliários.",0,"Veja se a ação descrita pertence ao universo dos papéis negociados no mercado ou à política monetária.",["Cada bloco corresponde a ações do mercado de valores mobiliários.","Fixar a meta de inflação é competência do CMN, não ação da CVM na proteção dos investidores.","Emitir moeda é atribuição do BACEN, não instrumento de desenvolvimento do mercado pela CVM.","Conduzir a política monetária é do BACEN, não fiscalização e punição pela CVM."]],
[4,"Regulação e autorregulação",2,"Qual item NÃO é pressuposto da autorregulação?","Aumento dos custos do regulador.","Diminuição de custos do regulador.","Proximidade e conhecimento da entidade autorreguladora do mercado.","Maior aceitação das regras da entidade autorreguladora.","A autorregulação busca reduzir, e não aumentar, os custos do regulador.",0,"A autorregulação nasce da ideia de reduzir as despesas do regulador.",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. A autorregulação busca reduzir, e não aumentar, os custos do regulador.","Reduzir o custo do regulador é justamente um dos pressupostos favoráveis à autorregulação. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Conhecer de perto o mercado ajuda a entidade autorreguladora a estabelecer e aplicar regras. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Maior aceitação das regras é um dos benefícios esperados da autorregulação. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[4,"CVM x BACEN",2,"Na comparação entre CVM e BACEN quanto aos poderes sobre o respectivo mercado, qual afirmação reflete a aula?","A CVM tem poder normativo e fiscalizador sobre o mercado de capitais; no sistema do BACEN, a normatização geral cabe ao CMN.","O BACEN edita todas as normas gerais e a CVM apenas fiscaliza.","O CMN fiscaliza diretamente o mercado de capitais.","A CVM não tem poder punitivo.","Na CVM, normativo e punitivo estão no próprio órgão; no BACEN, a normatização geral é do CMN.",0,"Compare onde ficam os poderes normativo e fiscalizador em cada sistema.",["Na CVM, normativo e punitivo estão no próprio órgão; no BACEN, a normatização geral é do CMN.","O CMN define as normas gerais do sistema; a CVM também tem poder normativo na sua área.","O CMN define diretrizes; a supervisão direta do mercado de capitais é da CVM.","A CVM possui poder fiscalizador e punitivo, respeitando a ampla defesa."]],
[4,"Diretoria e mandato",3,"Considere: I. Os diretores da CVM têm mandato de 5 anos, vedada a recondução. II. O Senado Federal nomeia os diretores da CVM. III. A CVM é vinculada ao Ministério da Fazenda, sem subordinação. IV. A sede da CVM é em Brasília. Estão corretas:","Apenas I e III.","Apenas I, II e III.","Apenas II e IV.","I, II, III e IV.","II e IV estão erradas: o Presidente da República nomeia, e a sede é no Rio de Janeiro.",0,"",["II e IV estão erradas: o Presidente da República nomeia, e a sede é no Rio de Janeiro.","Inclui II, que não deve fazer parte do conjunto correto. II e IV estão erradas: o Presidente da República nomeia, e a sede é no Rio de Janeiro.","Inclui IV, II, que não deve fazer parte do conjunto correto. Deixa de incluir I, III, que faz parte do conjunto correto. II e IV estão erradas: o Presidente da República nomeia, e a sede é no Rio de Janeiro.","Inclui IV, II, que não deve fazer parte do conjunto correto. II e IV estão erradas: o Presidente da República nomeia, e a sede é no Rio de Janeiro."]],
[4,"Valores mobiliários",3,"Assinale a alternativa INCORRETA sobre valores mobiliários.","Todos os títulos cambiais de instituições financeiras são valores mobiliários, sem exceções.","Títulos da dívida pública federal, estadual ou municipal não são valores mobiliários.","Debêntures são valores mobiliários.","Cotas de fundos de investimento em valores mobiliários são valores mobiliários.","Títulos cambiais de instituição financeira não são valores mobiliários, exceto as debêntures.",0,"",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. Títulos cambiais de instituição financeira não são valores mobiliários, exceto as debêntures.","A dívida pública federal, estadual e municipal está entre as exclusões desse conceito na aula. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Debêntures estão expressamente incluídas nos valores mobiliários. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Cotas de fundos em valores mobiliários também estão incluídas no conceito. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[4,"Poderes e penalidades",3,"Um administrador de companhia aberta é punido com inabilitação para o cargo por 18 anos e, em outro processo, com proibição de atuar no mercado de valores mobiliários por 12 anos. Considerando os limites da aula, o que se pode afirmar?","A primeira penalidade está dentro do limite de 20 anos, mas a segunda excede o limite de 10 anos.","Ambas estão dentro dos limites.","Ambas excedem os limites.","A primeira excede o limite, e a segunda está dentro.","Inabilitação: até 20 anos. Proibição de atuar no mercado: até 10 anos.",0,"",["Inabilitação: até 20 anos. Proibição de atuar no mercado: até 10 anos.","Doze anos de proibição de atuar excedem o teto de dez; apenas a primeira está no limite.","Dezoito anos de inabilitação respeitam o teto de vinte; apenas a segunda excede.","Inverte a análise: dezoito respeita vinte e doze excede dez."]],
[4,"Poderes e penalidades",3,"Classifique: (a) regular a atuação dos agentes do mercado; (b) punir, com ampla defesa, quem descumpre normas; (c) assegurar o acesso do público a informações. Qual alternativa está correta?","(a) poder normativo; (b) poder punitivo; (c) atribuição de acesso à informação adequada.","(a) poder punitivo; (b) poder normativo; (c) atribuição de acesso à informação adequada.","(a) poder normativo; (b) atribuição de proteção; (c) poder punitivo.","(a) atribuição de fiscalização; (b) poder normativo; (c) poder punitivo.","Regular é poder normativo; punir é poder punitivo; informação é uma atribuição.",0,"",["Regular é poder normativo; punir é poder punitivo; informação é uma atribuição.","Inverte regular e punir: normas regulam; sanções exercem poder punitivo.","Punir é poder punitivo; divulgar informação não é punição.","Punir não é editar norma e assegurar informação não é aplicar sanção."]],
[4,"CVM x BACEN",3,"Uma diretoria de 9 membros com mandato de 4 anos, reconduzível uma vez, e outra de 5 membros com mandato de 5 anos, sem recondução, descrevem, respectivamente:","BACEN e CVM.","CVM e BACEN.","CMN e CVM.","BACEN e CMN.","BACEN: 9 membros, 4 + 4 anos. CVM: 5 membros, 5 anos sem recondução.",0,"",["BACEN: 9 membros, 4 + 4 anos. CVM: 5 membros, 5 anos sem recondução.","Inverte as diretorias e os mandatos: a primeira é BACEN; a segunda CVM.","CMN tem três membros e não corresponde à primeira diretoria de nove.","CMN não tem diretoria de cinco com mandato de cinco anos; essa é a CVM."]],
[4,"Regulação e autorregulação",3,"Considere: I. A autorregulação visa aumentar a eficiência da atividade regulatória. II. A diminuição de custos do regulador é um pressuposto. III. A autorregulação concentra na CVM todo o poder de editar normas. IV. A maior aceitação das regras é um pressuposto. Estão corretas:","Apenas I, II e IV.","Apenas I, II e III.","Apenas II, III e IV.","I, II, III e IV.","A III está errada: a autorregulação evita a centralização excessiva do poder.",0,"",["A III está errada: a autorregulação evita a centralização excessiva do poder.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir IV, que faz parte do conjunto correto. A III está errada: a autorregulação evita a centralização excessiva do poder.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir I, que faz parte do conjunto correto. A III está errada: a autorregulação evita a centralização excessiva do poder.","Inclui III, que não deve fazer parte do conjunto correto. A III está errada: a autorregulação evita a centralização excessiva do poder."]],
[4,"Valores mobiliários",3,"Uma companhia emite debêntures; uma instituição financeira emite um título cambial de sua responsabilidade; e o governo federal emite um título da dívida pública. Quais desses títulos são valores mobiliários?","Apenas as debêntures.","As debêntures e o título cambial.","As debêntures e o título público.","Os três.","Dívida pública e títulos cambiais de instituição financeira não são valores mobiliários.",0,"",["Dívida pública e títulos cambiais de instituição financeira não são valores mobiliários.","O título cambial de instituição financeira está excluído, ressalvada a exceção de debêntures.","O título da dívida pública federal está excluído do conceito apresentado.","Inclui indevidamente título cambial e dívida pública; só a debênture está incluída nesse caso."]],
[4,"Poderes e penalidades",3,"Qual alternativa NÃO é um instrumento da CVM descrito na aula?","Fixar a meta da taxa Selic.","Examinar livros e registros contábeis de quem atua na sua área.","Intimar pessoas à prestação de informações, com multa em caso de descumprimento.","Requisitar informações a outros órgãos do poder público.","A Selic é do Copom; os demais são poderes da CVM.",0,"",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. A Selic é do Copom; os demais são poderes da CVM.","Examinar livros e registros é instrumento de fiscalização da CVM. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Intimar pessoas para obter informações, com multa em caso de descumprimento, está entre seus instrumentos. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Requisitar informações de outros órgãos é instrumento previsto para a atuação da CVM. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[4,"CVM x BACEN",3,"Assinale a INCORRETA sobre a comparação entre CVM e BACEN.","Os diretores de ambos têm mandato de 4 anos, com uma recondução.","A CVM é vinculada ao Ministério da Fazenda; o BACEN não tem vinculação a Ministério.","A diretoria da CVM tem 5 membros, e a do BACEN, 9.","A sede da CVM é no Rio de Janeiro, e a do BACEN, em Brasília.","CVM: 5 anos sem recondução. BACEN: 4 anos com uma recondução.",0,"",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. CVM: 5 anos sem recondução. BACEN: 4 anos com uma recondução.","A CVM tem vinculação ministerial sem subordinação; o BACEN não tem vinculação a ministério. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","As diretorias têm, respectivamente, um presidente mais quatro e um presidente mais oito diretores. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","As sedes citadas estão certas: CVM no Rio e BACEN em Brasília. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[4,"Atribuições",3,"Classifique: (i) estimular a formação de poupança; (ii) coibir fraude e manipulação; (iii) assegurar a observância das condições de utilização de crédito fixadas pelo CMN. Em quais blocos de atribuições se encaixam, respectivamente?","(i) desenvolvimento do mercado; (ii) proteção dos investidores; (iii) eficiência e funcionamento do mercado.","(i) proteção dos investidores; (ii) desenvolvimento do mercado; (iii) acesso à informação.","(i) eficiência e funcionamento; (ii) fiscalização e punição; (iii) proteção dos investidores.","(i) acesso à informação; (ii) eficiência e funcionamento; (iii) desenvolvimento do mercado.","Poupança: desenvolvimento; fraude: proteção; crédito do CMN: eficiência e funcionamento.",0,"",["Poupança: desenvolvimento; fraude: proteção; crédito do CMN: eficiência e funcionamento.","Formação de poupança é desenvolvimento, fraude é proteção e condições de crédito são eficiência.","Troca o primeiro e o último bloco; a classificação da questão é desenvolvimento, proteção e eficiência.","Informação ao público não é a formação de poupança; combater fraude é proteção, não eficiência."]],

[1,"Agentes",0,"Quem toma recursos emprestados no SFN é um agente:","Deficitário","Superavitário","Normativo","Supervisor","Tomador é quem precisa de recursos.",1,"Quem recebe o recurso é quem precisa dele.",["Tomador é quem precisa de recursos.","Superavitário é quem tem recursos excedentes e pode aplicá-los; não é quem precisa tomar recursos. Para esta pergunta: Tomador é quem precisa de recursos.","O nível normativo define as diretrizes e regras gerais; não atende clientes nem fiscaliza o dia a dia. Para esta pergunta: Tomador é quem precisa de recursos.","O nível supervisor fiscaliza o cumprimento das regras; não se confunde com o operador que atende clientes. Para esta pergunta: Tomador é quem precisa de recursos."]],

[1,"Vantagens",2,"Assinale a INCORRETA sobre as vantagens das instituições financeiras.","Elas são isentas de regulação, o que aumenta a confiança.","Fornecem liquidez aos agentes.","Acessam informações dos clientes.","Podem cobrar juros acima do teto da Lei da Usura.","As instituições são reguladas e supervisionadas.",1,"Procure a frase que contradiz a ideia de que são reguladas e supervisionadas.",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. As instituições são reguladas e supervisionadas.","Fornecer liquidez é uma das vantagens da intermediação pelas instituições. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Acesso a cadastros e históricos ajuda as instituições a avaliar clientes e riscos. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","A aula apresenta as instituições do SFN como exceção ao teto geral da Lei da Usura. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[1,"Mercados",2,"Associe: (a) títulos do governo e CDs de curto prazo; (b) ações e títulos corporativos; (c) seguros e capitalização. Mercados, respectivamente:","Monetário, capitais e seguros","Capitais, monetário e seguros","Monetário, seguros e capitais","Crédito, capitais e previdência fechada","(a) monetário; (b) capitais; (c) seguros.",1,"Associe pelo tipo de ativo e pelo prazo: curto prazo, títulos corporativos e proteção.",["(a) monetário; (b) capitais; (c) seguros.","Troca monetário e capitais: ativos de curto prazo são monetário e ações são capitais.","Ações não são seguros e apólices não são capitais; as duas últimas posições estão trocadas.","Ativos de curto prazo para liquidez são monetário; seguros e capitalização não são previdência fechada."]],

[1,"Spread",3,"Banco A: capta a 9%, empresta a 17%, custos de 2 p.p. e perdas de 1 p.p. Banco B: capta a 10%, empresta a 18%, custos de 3 p.p. e perdas de 0,5 p.p. Qual afirmação é correta?","A tem margem de 5 p.p. e B tem 4,5 p.p.","A tem 4 p.p. e B tem 4,5 p.p.","Ambos têm 5 p.p.","B tem 5 p.p. e A tem 4 p.p.","A: 8 menos 3 resulta em 5. B: 8 menos 3,5 resulta em 4,5.",1,"Calcule cada banco.",["A: 8 menos 3 resulta em 5. B: 8 menos 3,5 resulta em 4,5.","Erra o banco A: 17 − 9 − 2 − 1 = 5 p.p.; B está corretamente em 4,5.","O banco B tem 18 − 10 − 3 − 0,5 = 4,5 p.p., não cinco.","Inverte e altera as margens: A fica com 5 p.p. e B com 4,5 p.p."]],
[1,"Quadro do SFN",3,"Considere: I. CMN, CNSP e CNPC são conselhos normativos. II. BCB e CVM supervisionam moeda, crédito, capitais e câmbio. III. A Previc supervisiona seguros privados. IV. Fundos de pensão operam na previdência fechada. Estão corretas:","Apenas I, II e IV","Apenas I, II e III","Apenas II, III e IV","I, II, III e IV","A III está errada: a Previc supervisiona a previdência fechada.",1,"Confira a Previc.",["A III está errada: a Previc supervisiona a previdência fechada.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir IV, que faz parte do conjunto correto. A III está errada: a Previc supervisiona a previdência fechada.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir I, que faz parte do conjunto correto. A III está errada: a Previc supervisiona a previdência fechada.","Inclui III, que não deve fazer parte do conjunto correto. A III está errada: a Previc supervisiona a previdência fechada."]],

const T=["Quem tem sobra de dinheiro e quem tem falta? O sistema liga os dois.","Pense na receita do banco: o que cobra menos o que paga.","São três níveis: quem faz a regra, quem fiscaliza e quem atende o cliente.","Está ligado à liquidez e à taxa básica de juros, no curtíssimo prazo.","É algo que o banco faz sem ganhar pela diferença entre juros.","Quem aplicou tem sobra; quem tomou financiamento tem falta. O banco fica no meio.","O spread também paga o risco de calote.","A receita aqui é uma taxa, não a diferença entre juros.","Curto e médio prazo, como capital de giro.","Há duas moedas diferentes envolvidas.","Debêntures e ações financiam o longo prazo.","Normativo escreve as regras; não opera nem fiscaliza.","Entre as supervisoras, qual cuida de valores mobiliários?","É a instituição do balcão e do app, que atende o cliente.","Ordem lógica: regra, fiscalização, operação.","O CMN é normativo, não executivo.","A comparação se repete todo mês, com a inflação de 12 meses.","É um prazo de três anos.","São só três membros, e o Ministro da Fazenda preside.","Quem escreve a regra não é quem confere o cumprimento.","A Selic é instrumento do Banco Central, decidida em comitê próprio.","O nome lembra o comitê da Selic, mas a função é só de assessoria técnica.","Pense em quem dá o apoio administrativo: pauta, convocação e atas.","Ad referendum: a decisão ainda será submetida aos demais.","Pense no nome oficial das normas do CMN.","Spread vem de juros; tarifas e taxas de administração remuneram serviços.","Relacione cada mercado ao órgão que o fiscaliza: seguros, valores mobiliários e previdência fechada.","Liquidez e taxa básica de juros: o prazo é bem curto.","Procure a afirmação que dá fiscalização direta ao órgão normativo.","Quem fez o contrato com o investidor responde por ele.","É normativo, não executivo.","Foi na virada para o fim dos anos 1990.","O prazo é curto: pense em calendário mensal.","O CMN zela pela liquidez e solvência, e quem executa é o Banco Central.","Pense em transparência, autonomia e prestação de contas.","Só em situação excepcional, ligada ao balanço de pagamentos.","Quem prepara não é quem aprova.","Mensal e reservada.","O CMN colabora com outro órgão; não decide sozinho.","Procure a afirmação que dá poder de decisão a quem só assessora.","","","","","","","","","","","Sem vinculação a Ministério nem subordinação hierárquica.","A palavra-chave são os preços.","1 presidente mais 8 diretores.","Quatro anos, com uma recondução.","Pense em quem empresta às instituições financeiras.","Quem indica também nomeia; o Senado aprova no meio do caminho.","Conta-se por meses consecutivos.","Processo econômico x processo físico.","O BACEN faz as duas coisas: determina e recebe.","Liquidez e solvência: pense em quem escreve as regras.","Uma nota em relatório e uma carta aberta.","Não é no começo do mandato presidencial.","Pense nas operações que mudam a estrutura ou a atuação da instituição.","O ano é 2002.","Autonomia, estabilidade e Brasília.","São 8 diretores para distribuir ao longo de 4 anos.","Quem propõe não é quem exonera, e o Senado participa antes.","É a exceção, não a regra.","Verbos como efetuar, emitir e realizar apontam para o executor.","Há análise técnica e reconhecimento de interesse.","","","","","","Pense em apólices e proteção.","Transferências, cartões e boletos.","Quem aplica tem sobra.","Compare os prazos de cada mercado.","Spread é a diferença entre duas taxas.","São duas operações diferentes.","Liquidez e juros básicos.","Quem atende o público não faz a regra nem a fiscalização.","Calcule o spread e depois desconte as perdas.","Quem fiscaliza não é o órgão normativo.","","","","","","É quem preside o conselho.","É uma competência normativa.","Pense em quem também preside o Banco Central.","É uma regra de limite, não de fiscalização.","O CMN disciplina; quem fiscaliza é outro.","Pense nas políticas que ele coordena.","É a entidade que supervisiona valores mobiliários.","É um número pequeno.","Quem prepara, quem avalia e quem decide.","Uma das afirmações troca o CMN pelo Copom.","","","","","","É a capital do país.","Depositário das reservas do governo.","Autorizar, normatizar, fiscalizar e intervir.","Mudanças na estrutura das instituições passam pelo BACEN.","Reputação e capacidade técnica.","Procure o motivo que não é previsto.","São quatro dimensões.","É o teto máximo.","Compulsórios e empréstimos às instituições.","O primeiro ano começa em março.","","","","","","Valores mobiliários fazem parte desse mercado.","Não é a capital do país.","1 presidente mais 4 diretores.","Cinco anos, sem recondução.","Ações e debêntures.","Um regula, o outro pune.","É uma sanção administrativa, não penal.","Vinculada é diferente de subordinada.","O mesmo caminho dos diretores do BACEN: o Presidente nomeia e o Senado aprova.","Procure uma hipótese prevista, não política.","Reputação, especialização e aprovação do Senado.","Títulos do governo não entram.","A exceção cita um tipo de título que é valor mobiliário.","Ações, debêntures e fundos.","Fraude, manipulação e informação privilegiada.","Bolsa e balcão: pense em funcionamento.","É o prazo mais longo da lista.","É o menor teto citado.","Duas hipóteses: arrependimento e confissão.","Existe um órgão de acusação para crimes.","Eficiência e menos centralização.","Pense no que protege toda a sociedade.","Compare 5 anos sem recondução com 4 anos com recondução.","Dívida pública não entra.","Vinculação não é subordinação.","São duas modalidades com prazos diferentes.","Um direito do acusado.","Relacione o bloco com a ação da CVM.","O objetivo é reduzir o custo.","Na CVM, os dois poderes ficam no mesmo órgão.","","","","","","","","","",""];
