<script>
function initThemeToggle(){
const root=document.documentElement,button=document.getElementById("theme-toggle"),systemTheme=matchMedia("(prefers-color-scheme: dark)");
let preference=root.dataset.theme||null;
const apply=theme=>{root.dataset.theme=theme;const dark=theme==="dark",label=dark?"Ativar modo claro":"Ativar modo escuro";button.setAttribute("aria-label",label);button.setAttribute("aria-pressed",String(dark));button.title=label};
apply(preference||(systemTheme.matches?"dark":"light"));
button.addEventListener("click",()=>{preference=root.dataset.theme==="dark"?"light":"dark";apply(preference);try{localStorage.setItem("cpaTheme",preference)}catch(e){}});
systemTheme.addEventListener("change",event=>{if(!preference)apply(event.matches?"dark":"light")});
}
initThemeToggle();
const L=["Fácil","Médio","Difícil","Hardcore"],LC=["ok","md","hd","hc"],AU=["","Aula 1: SFN","Aula 2: CMN","Aula 3: BACEN","Aula 4: CVM","Aula 5: Seguros e previdência","Aula 6: Operadores"];
const Q=[
[1,"Agentes e intermediação",0,"Sobre a intermediação financeira no SFN, é correto afirmar:","O SFN conecta poupadores a tomadores por meio de instituições financeiras.","O SFN conecta deficitários que aplicam recursos a superavitários que tomam crédito.","A intermediação conecta poupadores e tomadores sem participação de instituições.","Superavitários tomam crédito porque suas despesas excedem os recursos disponíveis.","Superavitário tem sobra; deficitário tem falta de recursos.",0,"Pense no papel de intermediário: o sistema aproxima quem tem dinheiro parado de quem precisa dele. Desconfie das frases que invertem esses papéis.",["Superavitário tem sobra; deficitário tem falta de recursos.","Deficitários precisam de recursos; quem tem sobra é superavitário.","A intermediação envolve instituições e também pessoas jurídicas, não só pessoas físicas.","Gastos maiores que a renda caracterizam o deficitário, não o superavitário."]],
[1,"Spread",0,"Um banco capta a 10% a.a. e empresta a 18% a.a. A diferença entre as taxas é o:","Spread bancário","Taxa Selic","Compulsório bancário","Taxa de câmbio","Spread é a diferença entre juros de empréstimo e de captação.",0,"Calcule a diferença entre as duas taxas. O nome dessa diferença é a receita bruta da intermediação, e não uma taxa definida por política monetária.",["Spread é a diferença entre juros de empréstimo e de captação.","A Selic é a taxa básica de juros cuja meta é definida pelo Copom; não a diferença entre juros de captação e empréstimo. Para esta pergunta: Spread é a diferença entre juros de empréstimo e de captação.","Compulsório é o recolhimento de recursos das instituições ao BACEN; não é uma diferença de juros nem uma troca de moedas. Para esta pergunta: Spread é a diferença entre juros de empréstimo e de captação.","Taxa de câmbio relaciona o valor de duas moedas; não a taxa básica nem a diferença entre juros pagos e cobrados. Para esta pergunta: Spread é a diferença entre juros de empréstimo e de captação."]],
[1,"Estrutura do SFN",0,"Sobre a estrutura do SFN, é correto afirmar que:","Normativos editam regras; supervisoras fiscalizam; operadoras atendem clientes.","Normativos fiscalizam; supervisoras atendem clientes; operadoras editam regras.","Normativos atendem clientes; supervisoras editam regras; operadoras fiscalizam.","Normativos editam regras; supervisoras captam depósitos; operadoras fiscalizam.","Regra (normativo), fiscalização (supervisora), operação (operacional).",0,"Cada nível do sistema tem uma função própria. Descarte as alternativas em que um nível faz o trabalho de outro.",["Regra (normativo), fiscalização (supervisora), operação (operacional).","Troca os papéis dos três níveis: fiscalizar é das supervisoras, atender clientes é das operadoras e editar diretrizes gerais é dos normativos.","As três atribuições foram trocadas: normativos definem regras, supervisoras fiscalizam seu cumprimento e operadoras atendem os clientes.","Normativos editam regras, mas captar depósitos é atividade operacional. Supervisoras fiscalizam; operadoras não substituem a fiscalização do sistema."]],
[1,"Mercados",1,"Qual mercado opera no curtíssimo e no curto prazo e tem como objetivo controlar a liquidez e os juros?","Mercado monetário","Mercado de capitais","Mercado de câmbio","Mercado de seguros","O monetário trata da liquidez e da taxa básica de juros.",0,"Pense no mercado cujo foco são prazos muito curtos e o controle do dinheiro que circula na economia.",["O monetário trata da liquidez e da taxa básica de juros.","O mercado de capitais envolve ações e títulos corporativos e financia predominantemente o longo prazo, segundo a aula. Para esta pergunta: O monetário trata da liquidez e da taxa básica de juros.","O câmbio negocia moedas estrangeiras; não é o mercado de liquidez, de apólices ou de emissão de debêntures. Para esta pergunta: O monetário trata da liquidez e da taxa básica de juros.","O mercado de seguros oferece proteção contra riscos por apólices e inclui o segmento de previdência aberta. Para esta pergunta: O monetário trata da liquidez e da taxa básica de juros."]],
[1,"Serviços",1,"Qual item representa uma vantagem das instituições financeiras na função de intermediadoras?","Oferecer liquidez e analisar informações para avaliar o risco do crédito.","Oferecer liquidez eliminando o risco de inadimplência nas operações de crédito.","Avaliar o crédito garantindo retorno positivo em cada operação realizada.","Avaliar o crédito dispensando a supervisão externa das operações realizadas.","As instituições fornecem liquidez, conhecem seus clientes e são reguladas.",0,"Pense nas vantagens de uma instituição grande e regulada sobre um emprestador individual. Descarte as frases que negam a regulação.",["As instituições fornecem liquidez, conhecem seus clientes e são reguladas.","A intermediação pode avaliar e gerir o risco, mas não elimina a possibilidade de inadimplência. A vantagem é dispor de informações e controles para analisar o crédito.","Informações de crédito ajudam a avaliar o cliente, mas não garantem retorno positivo em cada operação. Ainda existem risco de crédito, custos e perdas.","As instituições continuam sujeitas a regulação e supervisão. Acesso a informações e avaliação de risco não dispensam controle externo."]],
[1,"Agentes e intermediação",1,"A empresa Alfa aplicou o caixa excedente em CDB; a Beta tomou financiamento no mesmo banco. Logo:","Alfa aplica como superavitária; Beta toma como deficitária; o banco intermedeia.","Alfa aplica como deficitária; Beta toma como superavitária; o banco intermedeia.","Alfa e Beta são superavitárias; o banco atua como supervisor das duas operações.","Alfa e Beta são deficitárias; o banco atua como normativo das duas operações.","Quem tem sobra é superavitário; o banco liga as pontas.",0,"Identifique quem tem sobra e quem tem falta de recursos. O banco fica entre os dois.",["Quem tem sobra é superavitário; o banco liga as pontas.","Inverte as posições: Alfa aplica uma sobra; Beta precisa de financiamento.","Beta é deficitária; o banco intermedeia os recursos, não apenas fiscaliza.","Alfa é superavitária e o banco é operador, não órgão normativo."]],
[1,"Spread",1,"Com a inadimplência em alta, o efeito esperado sobre o spread é:","Aumento, para compensar o risco adicional de inadimplência.","Redução, porque o maior risco reduz o custo do crédito.","Eliminação, porque as perdas passam a ser cobertas pelo BC.","Manutenção, porque o CMN determina um spread uniforme.","O spread remunera custos e risco da intermediação.",0,"Mais calotes elevam a perda esperada do banco. Pense em como ele compensa isso na diferença entre as taxas.",["O spread remunera custos e risco da intermediação.","Mais inadimplência aumenta o risco de perda, em vez de reduzir o risco e justificar queda do spread.","O BC não cobre automaticamente as perdas da carteira para eliminar o spread.","O spread depende dos custos e riscos da instituição; não é fixado igualmente pelo CMN."]],
[1,"Serviços",1,"Cobrar taxa de administração para gerir a carteira de um cliente é função de:","Prestação de serviços","Intermediação com spread","Supervisão do mercado","Normatização do sistema","Gestão de recursos de terceiros é serviço, remunerado por taxa.",0,"Observe de onde vem a receita: uma taxa pela gestão, e não a diferença entre os juros de captação e de empréstimo.",["Gestão de recursos de terceiros é serviço, remunerado por taxa.","Intermediação gera spread: diferença entre juros cobrados e pagos. Tarifas e taxas por serviços são outra fonte de receita. Para esta pergunta: Gestão de recursos de terceiros é serviço, remunerado por taxa.","Supervisionar é fiscalizar regras, não administrar a carteira do cliente por uma taxa.","Normatizar é editar regras; gerir recursos de terceiros é prestação de serviço."]],
[1,"Mercados",1,"Uma loja precisa de recursos de curto prazo para pagar fornecedores. Em qual mercado ocorre essa operação?","Mercado de crédito","Mercado de capitais","Mercado de seguros","Mercado de previdência fechada","Crédito atende necessidades de curto e médio prazo.",0,"O prazo é curto e o objetivo é pagar despesas da operação da loja. Pense no mercado de empréstimos e financiamentos.",["Crédito atende necessidades de curto e médio prazo.","O mercado de capitais envolve ações e títulos corporativos e financia predominantemente o longo prazo, segundo a aula. Para esta pergunta: Crédito atende necessidades de curto e médio prazo.","O mercado de seguros oferece proteção contra riscos por apólices e inclui o segmento de previdência aberta. Para esta pergunta: Crédito atende necessidades de curto e médio prazo.","A previdência fechada atende planos de entidades fechadas e é supervisionada pela Previc, não pela Susep. Para esta pergunta: Crédito atende necessidades de curto e médio prazo."]],
[1,"Mercados",1,"Uma exportadora converte dólares em reais. Em qual mercado ocorre essa conversão?","Mercado de câmbio","Mercado monetário","Mercado de crédito","Mercado de seguros","Câmbio é a compra e venda de moedas estrangeiras.",0,"Há duas moedas diferentes na operação. Pense no mercado em que elas são trocadas.",["Câmbio é a compra e venda de moedas estrangeiras.","O mercado monetário trata da liquidez e dos juros básicos com operações de curtíssimo e curto prazo. Para esta pergunta: Câmbio é a compra e venda de moedas estrangeiras.","O mercado de crédito envolve empréstimos e financiamentos de curto e médio prazo, na classificação da aula. Para esta pergunta: Câmbio é a compra e venda de moedas estrangeiras.","O mercado de seguros oferece proteção contra riscos por apólices e inclui o segmento de previdência aberta. Para esta pergunta: Câmbio é a compra e venda de moedas estrangeiras."]],
[1,"Mercados",1,"Uma companhia emite debêntures para financiar uma fábrica no longo prazo. Em qual mercado isso ocorre?","Mercado de capitais","Mercado de câmbio","Mercado monetário","Mercado de seguros","Capitais viabiliza captação de longo prazo (ações, debêntures).",0,"O prazo é longo e o instrumento capta recursos para a empresa sem ser um empréstimo bancário. Pense em ações e títulos corporativos.",["Capitais viabiliza captação de longo prazo (ações, debêntures).","O câmbio negocia moedas estrangeiras; não é o mercado de liquidez, de apólices ou de emissão de debêntures. Para esta pergunta: Capitais viabiliza captação de longo prazo (ações, debêntures).","O mercado monetário trata da liquidez e dos juros básicos com operações de curtíssimo e curto prazo. Para esta pergunta: Capitais viabiliza captação de longo prazo (ações, debêntures).","O mercado de seguros oferece proteção contra riscos por apólices e inclui o segmento de previdência aberta. Para esta pergunta: Capitais viabiliza captação de longo prazo (ações, debêntures)."]],
[1,"Estrutura do SFN",0,"Qual é um exemplo de órgão normativo do SFN?","CMN","Banco comercial","Corretora de valores","CVM","O CMN é o normativo máximo; a CVM supervisiona.",0,"Procure o órgão que define diretrizes gerais, sem operar com o público nem fiscalizar o dia a dia.",["O CMN é o normativo máximo; a CVM supervisiona.","Banco comercial é operador monetário, capta depósitos à vista e a prazo e concede crédito; não é normativo nem supervisor. Para esta pergunta: O CMN é o normativo máximo; a CVM supervisiona.","Corretora é operador não monetário do mercado de valores mobiliários; não é normativo, supervisor nem captador de depósitos à vista. Para esta pergunta: O CMN é o normativo máximo; a CVM supervisiona.","A CVM regula e supervisiona o mercado de valores mobiliários, como ações, debêntures e fundos. Para esta pergunta: O CMN é o normativo máximo; a CVM supervisiona."]],
[1,"Agentes e intermediação",1,"Sobre o teto de juros de 12% ao ano da Lei da Usura (Decreto 22.626/1933), as instituições do SFN:","Podem ultrapassar o teto; há exceção para instituições do SFN.","Devem respeitar o teto, inclusive nos contratos de maior risco.","Devem usar o teto como taxa obrigatória em seus empréstimos.","Podem cobrar sem observar regulação ou controle dos juros.","As instituições financeiras são exceção ao teto da Lei da Usura.",0,"A lei fixa um teto geral, mas a aula trata um grupo de forma diferente.",["As instituições financeiras são exceção ao teto da Lei da Usura.","A restrição geral da Lei da Usura não se aplica da mesma forma às instituições do SFN.","O teto citado não obriga os bancos a praticar uma taxa fixa de 12%.","Ser exceção a esse teto não elimina outras normas aplicáveis aos juros."]],
[1,"Agentes e intermediação",0,"Liquidez é a facilidade e a rapidez com que um ativo pode ser convertido em dinheiro sem perda significativa de valor. Quanto maior a liquidez:","Mais fácil e rápida é a conversão do ativo em dinheiro disponível.","Maior é o tempo necessário para converter o ativo em dinheiro.","Maior é a perda de valor exigida para converter o ativo em dinheiro.","Menor é a demanda por ativos disponíveis para conversão em dinheiro.","Maior liquidez significa conversão mais fácil e rápida em dinheiro.",0,"Se o ativo é mais líquido, o caminho entre ele e o dinheiro é mais curto e mais rápido.",["Maior liquidez significa conversão mais fácil e rápida em dinheiro.","Mais liquidez reduz a dificuldade e o tempo para obter dinheiro.","Alta liquidez pressupõe conversão sem perda significativa, não maior perda.","A definição trata da facilidade de conversão; não implica menor procura pelo ativo."]],
[1,"Estrutura do SFN",1,"Quando a supervisão e o controle das instituições são realizados por órgãos governamentais ou entidades externas e independentes das reguladas, trata-se de:","Heterorregulação","Autorregulação","Desregulação","Corregulação","Autorregulação é a própria indústria; heterorregulação é a externa.",0,"Observe quem controla: alguém de fora das instituições ou elas mesmas.",["Autorregulação é a própria indústria; heterorregulação é a externa.","Na autorregulação, entidades da própria indústria criam e aplicam regras; o controle externo caracteriza heterorregulação. Para esta pergunta: Autorregulação é a própria indústria; heterorregulação é a externa.","Desregulação significa reduzir regras ou controles; não é controle externo nem regulação pela própria indústria. Para esta pergunta: Autorregulação é a própria indústria; heterorregulação é a externa.","Corregulação envolve participação conjunta da indústria e do poder público. O enunciado descreve controle externo e independente das reguladas: heterorregulação."]],
[2,"Meta de inflação",0,"Quem define a meta de inflação e quem adota as medidas para alcançá-la?","CMN define; Banco Central persegue.","Banco Central define; CMN persegue.","CVM define; Banco Central persegue.","Copom define; CMN persegue.","O CMN é normativo; o BC executa.",0,"O CMN cria as regras e define metas. A ação de perseguir o resultado cabe a outro órgão.",["O CMN é normativo; o BC executa.","Inverte os papéis: o CMN define a meta e o BC age para alcançá-la.","A CVM cuida dos valores mobiliários; não define a meta de inflação.","O Copom define a meta da Selic; perseguir a inflação cabe ao BC, não ao CMN."]],
[2,"Meta de inflação",1,"A inflação acumulada em 12 meses (IPCA) é comparada mês a mês com a meta e a tolerância. Como é chamada essa sistemática?","Meta contínua","Meta fixa anual","Meta de liquidez","Meta de câmbio","Na meta contínua a apuração é mensal, em 12 meses.",0,"Observe a periodicidade da comparação: ela se repete todos os meses, sempre com a inflação de uma janela de 12 meses.",["Na meta contínua a apuração é mensal, em 12 meses.","A comparação ocorre mensalmente sobre uma janela móvel, não só ao fim do ano.","Liquidez não é a variável medida; a comparação usa inflação acumulada pelo IPCA.","A meta descrita é de inflação, não de cotação de moeda estrangeira."]],
[2,"Meta de inflação",1,"Alterar a meta ou a tolerância exige anúncio com antecedência mínima de:","36 meses","6 meses","12 meses","24 meses","O prazo mínimo é de 36 meses, para dar previsibilidade.",0,"É um prazo longo, medido em anos, para dar previsibilidade às mudanças.",["O prazo mínimo é de 36 meses, para dar previsibilidade.","O valor indicado nesta opção (6 meses) não corresponde ao resultado ou requisito pedido (36 meses). O prazo mínimo é de 36 meses, para dar previsibilidade.","O valor indicado nesta opção (12 meses) não corresponde ao resultado ou requisito pedido (36 meses). O prazo mínimo é de 36 meses, para dar previsibilidade.","O valor indicado nesta opção (24 meses) não corresponde ao resultado ou requisito pedido (36 meses). O prazo mínimo é de 36 meses, para dar previsibilidade."]],
[2,"CMN: papel e composição",1,"Qual é a composição correta do CMN?","Fazenda, Planejamento e Orçamento e presidente do BC; presidência da Fazenda.","Presidente e oito diretores do BC; presidência do presidente do Banco Central.","Fazenda, presidente do BC e presidente da CVM; presidência do Banco Central.","Fazenda, Planejamento e Orçamento e presidente da CVM; presidência da Fazenda.","Os diretores do BC aparecem na Comoc, não no CMN.",0,"São poucos membros, e a presidência fica com um ministro da área econômica. Descarte as opções com diretores do BC ou da CVM.",["O CMN reúne os ministros da Fazenda e do Planejamento e Orçamento e o presidente do BC. A presidência cabe ao Ministro da Fazenda; os oito diretores compõem a diretoria do BC, não o CMN.","Presidente e oito diretores compõem a Diretoria Colegiada do BC, não o CMN. O conselho tem Fazenda, Planejamento e Orçamento e presidente do BC.","O presidente da CVM não integra o CMN e a presidência do conselho cabe à Fazenda, não ao Banco Central.","O presidente do BC, e não o da CVM, completa o CMN ao lado dos ministros da Fazenda e do Planejamento e Orçamento."]],
[2,"CMN x Banco Central",2,"Um banco concede a um cliente crédito acima do limite máximo. Quem faz o quê?","O CMN estabelece o limite por norma; o BC verifica seu cumprimento.","O CMN fixa o limite e aplica a punição diretamente ao banco.","O BC fixa o limite; o CMN executa a concessão ao cliente.","O banco fixa o limite por conta própria, sem observar norma do CMN.","O CMN escreve a regra; o BC confere.",0,"Separe quem estabelece o limite de quem verifica se ele foi respeitado.",["O CMN escreve a regra; o BC confere.","O CMN normatiza; fiscalizar e aplicar a regra às instituições cabe ao BC.","O CMN fixa diretrizes e limites gerais e não concede o crédito. O BC supervisiona o banco que executa a operação e verifica o cumprimento da norma.","A instituição está sujeita aos limites de concentração definidos por norma."]],
[2,"CMN x Banco Central",2,"Quem decide a meta da taxa Selic?","Copom, comitê do Banco Central","CMN, conselho normativo do SFN","Comoc, comissão de assessoramento","Ministério da Fazenda, por decisão ministerial","A Selic é do Copom; a meta de inflação é do CMN.",0,"Lembre que a taxa básica de juros não é decidida pelo mesmo órgão que define a meta de inflação.",["A Selic é do Copom; a meta de inflação é do CMN.","O CMN estabelece diretrizes e normas gerais; não executa operações nem fiscaliza diretamente as instituições. Para esta pergunta: A Selic é do Copom; a meta de inflação é do CMN.","A Comoc presta assessoramento técnico prévio ao CMN; não delibera em seu lugar nem define a meta da Selic. Para esta pergunta: A Selic é do Copom; a meta de inflação é do CMN.","O Ministro da Fazenda preside o CMN; não é o coordenador da Comoc nem decide sozinho a meta da Selic. Para esta pergunta: A Selic é do Copom; a meta de inflação é do CMN."]],
[2,"Comoc e Secretaria",2,"Qual órgão presta assessoramento técnico, manifesta-se previamente ao CMN, é coordenado pelo presidente do BC e realiza reuniões reservadas?","Comoc","Copom","CVM","Tesouro Nacional","A Comoc assessora o CMN; o Copom define a Selic.",0,"O nome é parecido com o do comitê dos juros, mas a função é de apoio técnico antes das decisões do CMN.",["A Comoc assessora o CMN; o Copom define a Selic.","O Copom é o comitê do Banco Central que define a meta da taxa Selic; não define a meta de inflação nem assessora o CMN como a Comoc. Para esta pergunta: A Comoc assessora o CMN; o Copom define a Selic.","A CVM regula e supervisiona o mercado de valores mobiliários, como ações, debêntures e fundos. Para esta pergunta: A Comoc assessora o CMN; o Copom define a Selic.","O Tesouro atua na administração das finanças e da dívida pública; não substitui as competências do CMN, BACEN ou CVM descritas na aula. Para esta pergunta: A Comoc assessora o CMN; o Copom define a Selic."]],
[2,"Comoc e Secretaria",1,"Pauta, convocação e atas do CMN são atribuições de:","Banco Central do Brasil","Comissão de Valores Mobiliários","Ministério da Fazenda","Comissão Técnica da Moeda e do Crédito","A Secretaria-Executiva é exercida pelo BC.",0,"Pense em quem dá o suporte administrativo ao conselho, elabora documentos e organiza o calendário.",["A Secretaria-Executiva é exercida pelo BC.","A CVM regula e supervisiona o mercado de valores mobiliários, como ações, debêntures e fundos. Para esta pergunta: A Secretaria-Executiva é exercida pelo BC.","A Fazenda é a vinculação da CVM e da Susep e abriga o CNSP; o segmento de previdência fechada é ligado à Previdência Social. Para esta pergunta: A Secretaria-Executiva é exercida pelo BC.","A Comoc presta assessoramento técnico prévio ao CMN; não delibera em seu lugar nem define a meta da Selic. Para esta pergunta: A Secretaria-Executiva é exercida pelo BC."]],
[2,"Reuniões e normas",2,"Em urgência e relevante interesse, o presidente do CMN decide sem esperar a reunião mensal. A decisão é:","Ad referendum, para análise dos demais na reunião seguinte.","Decisão definitiva, comunicada aos demais na reunião seguinte.","Decisão condicionada à aprovação unânime antes da reunião.","Decisão submetida à aprovação do Senado na reunião seguinte.","Decisão ad referendum é depois submetida aos demais.",0,"A decisão é tomada em urgência, mas ainda passa por uma confirmação posterior do colegiado.",["Decisão ad referendum é depois submetida aos demais.","Ad referendum exige apreciação posterior pelos demais membros; não é decisão definitiva sem controle.","A urgência permite decisão antes da reunião, sem unanimidade prévia.","A confirmação cabe aos demais membros do CMN, não ao Senado."]],
[2,"Reuniões e normas",1,"Uma nova regra de crédito do CMN é regulamentada e divulgada como:","Resolução CMN publicada no Diário Oficial da União.","Lei complementar publicada no Diário Oficial da União.","Circular CVM publicada no Diário Oficial da União.","Ata de reunião reservada aos membros, sem publicação externa.","As matérias saem por Resoluções CMN.",0,"Procure o nome oficial das normas do CMN e o veículo em que o público as acessa.",["As matérias saem por Resoluções CMN.","Lei complementar é aprovada pelo Legislativo; a norma do conselho sai por Resolução CMN.","Circular da CVM não é o veículo de divulgação da norma do CMN.","A regra é publicada no DOU e na busca de normas; não fica só em ata reservada."]],
[1,"Serviços",2,"Um banco registrou três receitas no mês: (I) diferença entre os juros cobrados nos empréstimos e os pagos na captação; (II) tarifa de manutenção de conta; (III) taxa de administração de fundos. Como elas se classificam?","I gera spread por intermediação; II e III remuneram serviços.","I, II e III são receitas de intermediação financeira.","I e II são serviços; III é receita de intermediação financeira.","I é serviço; II e III são receitas de intermediação financeira.","O spread vem da intermediação; tarifas e taxas de administração remuneram serviços.",0,"Classifique cada receita pela origem: diferença entre taxas ou pagamento por um serviço prestado.",["O spread vem da intermediação; tarifas e taxas de administração remuneram serviços.","Tarifa de conta e taxa de administração são serviços; apenas a diferença entre juros é spread.","A diferença entre juros é spread; administrar fundos é prestação de serviço, não spread.","Inverte as fontes de receita: juros geram spread, tarifas e taxas remuneram serviços."]],
[1,"Mercados",2,"Associe cada mercado à entidade que o supervisiona: seguros, valores mobiliários (capitais) e previdência fechada.","Seguros: Susep; capitais: CVM; previdência fechada: Previc.","Seguros: CVM; capitais: Susep; previdência fechada: Previc.","Seguros: Previc; capitais: CVM; previdência fechada: Susep.","Seguros: Susep; capitais: Previc; previdência fechada: CVM.","Susep supervisiona seguros, CVM os valores mobiliários e Previc a previdência fechada.",0,"Cada mercado tem um supervisor próprio. Associe pelo produto: apólices, valores mobiliários e fundos de pensão.",["Susep supervisiona seguros, CVM os valores mobiliários e Previc a previdência fechada.","Troca os supervisores de seguros e capitais: Susep cuida de seguros e CVM de valores mobiliários.","Troca os supervisores de seguros e previdência fechada: Susep e Previc, respectivamente.","Troca capitais e previdência fechada: CVM supervisiona capitais e Previc supervisiona a fechada."]],
[1,"Mercados",2,"O Banco Central atua para ajustar a liquidez da economia e conduzir a taxa básica de juros. Em qual mercado isso ocorre e qual o prazo típico das operações?","Monetário; operações de curtíssimo e curto prazo.","Crédito; operações de médio e longo prazo.","Capitais; operações de financiamento de longo prazo.","Câmbio; operações de financiamento em moeda nacional.","O monetário trata de liquidez e juros básicos, com operações de curtíssimo e curto prazo.",0,"Pense na ferramenta do BC para ajustar o dinheiro em circulação, em qual mercado ela atua e em que horizonte de tempo.",["O monetário trata de liquidez e juros básicos, com operações de curtíssimo e curto prazo.","Crédito é empréstimo e financiamento; o ajuste de liquidez e juros básicos ocorre no monetário.","Capitais financia longo prazo, não o controle da liquidez de curtíssimo prazo.","O mercado de câmbio envolve troca de moedas. A gestão da liquidez e dos juros no curtíssimo e curto prazo pertence ao mercado monetário."]],
[1,"Estrutura do SFN",2,"Assinale a alternativa INCORRETA sobre a estrutura do SFN.","Normativos fiscalizam as instituições no dia a dia.","Os normativos estabelecem as regras gerais do sistema.","As supervisoras fiscalizam o cumprimento das regras.","As operadoras atendem o público nos serviços financeiros.","Fiscalizar é papel das supervisoras; o CMN normatiza.",0,"Procure a frase que dá a quem define as regras uma tarefa diária de fiscalização, que pertence a outro nível.",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. Fiscalizar é papel das supervisoras; o CMN normatiza.","Definir as regras gerais é a função normativa, portanto a afirmação é verdadeira. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Fiscalizar o cumprimento das regras é justamente a função das supervisoras. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Bancos que captam e emprestam ao público operam no sistema e são entidades operacionais. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[1,"Agentes e intermediação",2,"Um investidor aplica em um CDB, e o banco empresta o dinheiro a uma empresa por juros maiores. Se a empresa atrasar o pagamento, quem tem a obrigação de remunerar o investidor?","O banco emissor, que deve remunerar o investidor do CDB.","A empresa, responsável diretamente pelo CDB do investidor.","O CMN, responsável por remunerar o CDB por editar as normas.","O investidor assume a perda da empresa sem cobrar do banco.","O banco intermedia e assume o risco de crédito; a obrigação com o investidor é dele.",0,"O investidor tem contrato com o banco, e não com quem tomou o empréstimo. Pense em quem deve a ele.",["O banco intermedia e assume o risco de crédito; a obrigação com o investidor é dele.","O investidor contratou o CDB com o banco, não diretamente com a empresa tomadora.","Ser órgão normativo não torna o CMN devedor do CDB.","O risco da operação não extingue a obrigação contratual do banco perante o investidor."]],
[2,"CMN: papel e composição",0,"O CMN é caracterizado como:","Órgão normativo e deliberativo máximo, sem função executiva.","Órgão executivo e fiscalizador das instituições financeiras.","Entidade operacional que oferece serviços financeiros ao público.","Órgão supervisor das operações com valores mobiliários.","Ele cria regras e diretrizes; não as executa.",0,"Pense no que o CMN faz: cria regras e diretrizes, e não executa nem atende ao público.",["Ele cria regras e diretrizes; não as executa.","Executar e fiscalizar são funções de supervisoras como o BC, não do conselho normativo.","O CMN não capta nem concede crédito ao público.","A supervisão dos valores mobiliários cabe à CVM; o CMN é normativo."]],
[2,"Meta de inflação",0,"Desde que ano o Brasil adota o regime de metas para a inflação?","1999","1988","1994","2008","O regime de metas para a inflação vigora desde 1999.",0,"Foi no final da década de 1990.",["O regime de metas para a inflação vigora desde 1999.","O valor indicado nesta opção (1988) não corresponde ao resultado ou requisito pedido (1999). O regime de metas para a inflação vigora desde 1999.","O valor indicado nesta opção (1994) não corresponde ao resultado ou requisito pedido (1999). O regime de metas para a inflação vigora desde 1999.","O valor indicado nesta opção (2008) não corresponde ao resultado ou requisito pedido (1999). O regime de metas para a inflação vigora desde 1999."]],
[2,"Reuniões e normas",0,"Com que frequência os membros do CMN se reúnem em caráter ordinário?","Uma vez por mês","Uma vez por semana","Uma vez por ano","Uma vez por semestre","Ordinárias mensais; as extraordinárias dependem de convocação do presidente.",0,"A periodicidade é maior que uma semana e menor que um semestre.",["Ordinárias mensais; as extraordinárias dependem de convocação do presidente.","A periodicidade ordinária é mensal, não semanal.","Uma reunião anual não corresponde à periodicidade mensal indicada.","Uma reunião semestral deixaria de realizar as ordinárias mensais."]],
[2,"CMN: papel e composição",0,"Qual das opções é um dos objetivos do CMN?","Zelar pela liquidez e solvência das instituições do SFN.","Executar a política cambial por operações no mercado.","Fiscalizar as instituições em inspeções presenciais.","Elaborar as atas para a aprovação pelos conselheiros.","O CMN zela por meio de regras; a execução e a fiscalização cabem ao BC.",0,"Os objetivos do CMN são verbos de direção e de zelo. Descarte as ações operacionais do dia a dia.",["O CMN zela por meio de regras; a execução e a fiscalização cabem ao BC.","Executar operações cambiais é atividade do BC; o CMN define as diretrizes.","Fiscalizar diretamente é função supervisora do BC, não objetivo executivo do conselho.","Preparar atas é tarefa administrativa da Secretaria-Executiva, não esse objetivo do CMN."]],
[2,"Meta de inflação",1,"Qual item é elemento do regime de metas para a inflação?","Autonomia do BC na escolha das medidas para cumprir a meta.","Divulgação da meta depois de encerrado o período de apuração.","Decisões monetárias dispensadas de justificativa ao público.","Autoridade monetária dispensada de prestar contas dos resultados.","Meta pública e prévia, autonomia, comunicação transparente e prestação de contas.",0,"Procure o item que reforça a capacidade do BC de agir sem interferência. Descarte o que sugere sigilo.",["Meta pública e prévia, autonomia, comunicação transparente e prestação de contas.","A meta deve ser pública e anunciada previamente, permitindo previsibilidade.","Transparência exige comunicação dos objetivos e das razões das decisões.","A autoridade monetária deve prestar contas, inclusive quando descumpre a meta."]],
[2,"CMN x Banco Central",1,"Em que situação o CMN pode outorgar ao Banco Central o monopólio das operações de câmbio?","Diante de grave desequilíbrio ou sua iminência no balanço de pagamentos nacional.","Diante de inflação acima da meta, mesmo sem desequilíbrio nas contas externas.","Diante de aumento da Selic, mesmo sem desequilíbrio no balanço de pagamentos.","Diante de decisão ordinária do presidente, sem desequilíbrio nas contas externas.","É medida excepcional, ligada ao desequilíbrio do balanço de pagamentos.",0,"É uma medida excepcional, ligada às contas do país com o exterior, e não à inflação ou aos juros.",["É medida excepcional, ligada ao desequilíbrio do balanço de pagamentos.","Inflação acima da meta, por si só, não é a hipótese de grave desequilíbrio cambial citada.","A mudança da Selic não é o requisito para esse monopólio excepcional.","A medida exige grave desequilíbrio do balanço de pagamentos ou sua iminência, não uma decisão rotineira."]],
[2,"CMN x Banco Central",1,"Sobre os orçamentos monetários, que estimam as necessidades globais de moeda e crédito, é correto afirmar:","São preparados pelo Banco Central e aprovados pelo CMN.","São preparados pelo CMN e aprovados pela CVM.","São preparados pela Comoc e aprovados pelo Copom.","São preparados e aprovados apenas pelo Banco Central.","O BC prepara; o CMN aprova.",0,"Quem elabora o orçamento não é quem o aprova. O aprovador é o órgão normativo.",["O BC prepara; o CMN aprova.","O BC prepara e o CMN aprova; a CVM não aprova o orçamento monetário.","A Comoc assessora e o Copom decide a Selic; não substituem BC e CMN nessas etapas.","O BC prepara, mas a aprovação é do CMN, não do próprio BC."]],
[2,"Comoc e Secretaria",1,"Sobre as reuniões da Comoc, é correto afirmar que:","Ordinárias uma vez por mês, com reuniões de caráter reservado.","Ordinárias semestrais, com acesso ao público.","Ordinárias mensais, convocadas exclusivamente pela Fazenda.","Extraordinárias em crises, sem previsão de reuniões ordinárias.","Reunião mensal ordinária, extraordinária a qualquer tempo, com caráter reservado.",0,"Pense na regularidade de um calendário e no sigilo, características de um órgão técnico de apoio.",["Reunião mensal ordinária, extraordinária a qualquer tempo, com caráter reservado.","As ordinárias são mensais e reservadas, não públicas e semestrais.","A comissão é coordenada pelo presidente do BC. A convocação extraordinária pode partir do coordenador ou da maioria dos membros; a Fazenda não é convocadora exclusiva das reuniões.","Há reuniões ordinárias mensais, além das extraordinárias."]],
[2,"CMN: papel e composição",1,"Um município quer contrair um empréstimo externo. Qual é o papel do CMN nesse processo?","Colaborar com o Senado na instrução do empréstimo externo.","Aprovar o empréstimo externo sem participação do Senado.","Executar a contratação do empréstimo por intermédio do BC.","Delegar à CVM a instrução e a aprovação do empréstimo externo.","O CMN colabora com o Senado na instrução de empréstimos externos de estados, DF e municípios.",0,"O CMN participa do processo ao lado de outro órgão, sem decidir sozinho.",["O CMN colabora com o Senado na instrução de empréstimos externos de estados, DF e municípios.","O CMN colabora com o Senado; não aprova sozinho esse processo.","O papel descrito é de instrução em colaboração com o Senado, não de execução da operação.","A competência do CMN é colaborar com o Senado na instrução do empréstimo externo. A CVM não substitui esses órgãos na aprovação da operação."]],
[2,"CMN x Banco Central",2,"Assinale a alternativa INCORRETA sobre o CMN.","A Comoc delibera em lugar do CMN sobre matérias do conselho.","O CMN define a meta de inflação para o BC perseguir.","O CMN exerce funções normativas, sem funções executivas.","O BC exerce a Secretaria-Executiva do CMN.","A Comoc só assessora tecnicamente; quem delibera é o CMN.",0,"Uma das frases altera o papel de um órgão que só dá apoio técnico.",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. A Comoc só assessora tecnicamente; quem delibera é o CMN.","O CMN define a meta e o BC atua para alcançá-la; a afirmação descreve corretamente os papéis. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","O CMN faz normas e diretrizes, sem executar as operações; esta afirmação é verdadeira. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","O Banco Central exerce a Secretaria-Executiva; a afirmação não contém o erro pedido. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[1,"Mercados",3,"Considere as afirmações: I. O spread bancário é a diferença entre a taxa cobrada do tomador e a taxa paga ao poupador. II. A prestação de serviços inclui a gestão de recursos de terceiros e os meios de pagamento. III. O mercado de capitais atende, principalmente, necessidades de recursos de curtíssimo prazo. Está(ão) correta(s):","Apenas I e II.","Apenas I e III.","Apenas II e III.","I, II e III.","A III está errada: o curtíssimo prazo é do mercado monetário; capitais trata do longo prazo.",0,"",["A III está errada: o curtíssimo prazo é do mercado monetário; capitais trata do longo prazo.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir II, que faz parte do conjunto correto. A III está errada: o curtíssimo prazo é do mercado monetário; capitais trata do longo prazo.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir I, que faz parte do conjunto correto. A III está errada: o curtíssimo prazo é do mercado monetário; capitais trata do longo prazo.","Inclui III, que não deve fazer parte do conjunto correto. A III está errada: o curtíssimo prazo é do mercado monetário; capitais trata do longo prazo."]],
[1,"Mercados",3,"Uma empresa emite debêntures para financiar uma nova planta, converte em reais um pagamento recebido em dólares e toma capital de giro de curto prazo em um banco. Em quais mercados ocorrem, respectivamente, essas três operações?","Capitais, câmbio e crédito.","Monetário, câmbio e capitais.","Capitais, monetário e crédito.","Crédito, câmbio e capitais.","Debêntures: capitais; conversão de moeda: câmbio; capital de giro: crédito.",0,"",["Debêntures: capitais; conversão de moeda: câmbio; capital de giro: crédito.","Debêntures pertencem a capitais; capital de giro bancário é crédito, não capitais.","A conversão entre dólares e reais é câmbio, não monetário.","Emitir debêntures é capitais; tomar capital de giro é crédito. As duas posições foram trocadas."]],
[1,"Spread",3,"Um banco capta a 8% a.a. e empresta a 20% a.a. Considere que 3% do valor emprestado se perde por inadimplência e que os custos administrativos equivalem a 2% do valor emprestado. Qual a margem que sobra, em pontos percentuais?","7 p.p.","12 p.p.","9 p.p.","5 p.p.","Spread de 12 p.p. menos 3 p.p. de inadimplência e 2 p.p. de custos resulta em 7 p.p.",0,"",["Spread de 12 p.p. menos 3 p.p. de inadimplência e 2 p.p. de custos resulta em 7 p.p.","12 p.p. é o spread bruto; ainda faltam descontar 3 p.p. de perdas e 2 p.p. de custos.","9 p.p. desconta as perdas, mas deixa de descontar os 2 p.p. de custos administrativos.","5 p.p. exigiria descontar 2 p.p. a mais do que os custos e as perdas informados. A conta é 20 − 8 − 3 − 2 = 7 p.p."]],
[1,"Agentes e intermediação",3,"Assinale a alternativa INCORRETA sobre a intermediação financeira.","A intermediação elimina o risco de crédito ao repassá-lo ao poupador.","Uma empresa pode ser superavitária e depois se tornar deficitária.","O spread remunera os custos e o risco assumidos pela instituição.","Superavitários têm recursos excedentes; deficitários precisam captá-los.","O banco assume o risco da intermediação; ela não o elimina nem o repassa integralmente ao poupador.",0,"",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. O banco assume o risco da intermediação; ela não o elimina nem o repassa integralmente ao poupador.","A posição de uma empresa pode mudar conforme ela tenha sobra ou necessidade de recursos em cada período. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Spread remunera os custos e o risco de crédito assumidos pelo intermediário. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","As definições estão certas: superavitário tem sobra e deficitário precisa de recursos. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[1,"Estrutura do SFN",3,"Uma instituição que capta depósitos e concede crédito ao público, a norma que fixa limites a essas operações e o órgão que verifica o cumprimento dessa norma correspondem, respectivamente, a quais níveis do SFN?","Entidade operacional, órgão normativo e entidade supervisora.","Órgão normativo, entidade operacional e entidade supervisora.","Entidade supervisora, órgão normativo e entidade operacional.","Entidade operacional, entidade supervisora e órgão normativo.","Quem atende o público opera; a regra vem do normativo; a verificação é da supervisora.",0,"",["Quem atende o público opera; a regra vem do normativo; a verificação é da supervisora.","Captação e crédito ao público são operações; editar a regra é normatização. As duas primeiras funções foram trocadas.","Atender o público é função operacional; verificar a norma é supervisão.","A regra vem do normativo e sua verificação é da supervisora; as duas últimas funções foram trocadas."]],
[2,"Meta de inflação",3,"Considere as afirmações sobre o regime de metas: I. O CMN define a meta e o Banco Central adota as medidas para alcançá-la. II. A inflação acumulada em 12 meses é comparada mês a mês com a meta e a tolerância. III. Mudanças na meta ou na tolerância devem ser anunciadas com 12 meses de antecedência. Está(ão) correta(s):","Apenas I e II.","Apenas II e III.","I, II e III.","Apenas I.","A III está errada: a antecedência mínima é de 36 meses.",0,"",["A III está errada: a antecedência mínima é de 36 meses.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir I, que faz parte do conjunto correto. A III está errada: a antecedência mínima é de 36 meses.","Inclui III, que não deve fazer parte do conjunto correto. A III está errada: a antecedência mínima é de 36 meses.","Deixa de incluir II, que faz parte do conjunto correto. A III está errada: a antecedência mínima é de 36 meses."]],
[2,"Reuniões e normas",3,"Os três membros do CMN votam uma proposta: o Ministro da Fazenda e o Ministro do Planejamento e Orçamento votam a favor, e o Presidente do Banco Central vota contra. Considerando a regra de decisão descrita na aula, o que ocorre?","É aprovada: dois votos atendem à maioria simples.","É rejeitada: dois votos não atendem à unanimidade exigida.","É condicionada: os votos exigem aprovação prévia da Comoc.","É suspensa: os votos exigem nova deliberação ad referendum.","As decisões saem por maioria simples de votos.",0,"",["As decisões saem por maioria simples de votos.","A maioria simples é suficiente: dois votos favoráveis entre três; unanimidade não é exigida.","A Comoc presta assessoramento técnico, mas não substitui a votação do conselho.","Ad referendum é a decisão urgente do presidente submetida depois aos membros; aqui já houve votação e maioria."]],
[2,"CMN x Banco Central",3,"Associe: (1) define a meta de inflação; (2) define a meta da taxa Selic; (3) manifesta-se previamente sobre assuntos de competência do CMN; (4) exerce a Secretaria-Executiva do CMN.","(1) CMN; (2) Copom; (3) Comoc; (4) Banco Central.","(1) Copom; (2) CMN; (3) Comoc; (4) Banco Central.","(1) CMN; (2) Comoc; (3) Copom; (4) Banco Central.","(1) CMN; (2) Copom; (3) Banco Central; (4) Comoc.","Meta de inflação: CMN; Selic: Copom; manifestação prévia: Comoc; secretaria: Banco Central.",0,"",["Meta de inflação: CMN; Selic: Copom; manifestação prévia: Comoc; secretaria: Banco Central.","Troca as duas metas: inflação é do CMN e Selic é do Copom.","Troca os comitês: Copom define Selic e Comoc presta manifestação prévia.","Troca assessoramento e Secretaria: a manifestação é da Comoc e a Secretaria é do BC."]],
[2,"CMN: papel e composição",3,"Assinale a alternativa que NÃO é competência do CMN.","Aprovar cada operação de crédito dos bancos individualmente.","Fixar diretrizes e normas para a política cambial brasileira.","Limitar juros, descontos e comissões quando for necessário.","Fixar o limite de crédito para um cliente ou grupo de empresas.","O CMN fixa regras e limites gerais; não aprova operações individuais.",0,"",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. O CMN fixa regras e limites gerais; não aprova operações individuais.","Diretrizes cambiais são regras gerais e estão entre as competências normativas do CMN. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Limitar juros, descontos e comissões é uma competência normativa prevista para o CMN. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Fixar o limite de concentração por cliente é normatizar, não aprovar individualmente cada empréstimo. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[2,"Comoc e Secretaria",3,"Qual dos itens abaixo NÃO é membro da Comoc, segundo a aula?","Ministro do Planejamento e Orçamento","Presidente da Comissão de Valores Mobiliários","Secretário do Tesouro Nacional","Quatro diretores do Banco Central","O Ministro integra o CMN; na Comoc está o Secretário-Executivo do ministério.",0,"",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. O Ministro integra o CMN; na Comoc está o Secretário-Executivo do ministério.","O Presidente da CVM está expressamente incluído entre os membros da Comoc. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","O Secretário do Tesouro Nacional integra a composição da Comoc descrita. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Quatro diretores do Banco Central integram a Comoc; não são a ausência pedida. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[3,"Natureza e funções",0,"O Banco Central do Brasil é classificado como:","Autarquia de natureza especial","Empresa pública vinculada ao Ministério da Fazenda","Órgão subordinado hierarquicamente ao CMN","Sociedade de economia mista","Não há vinculação a Ministério, tutela nem subordinação hierárquica.",0,"Pense no que a aula diz sobre a falta de vinculação a ministério e de subordinação hierárquica.",["Não há vinculação a Ministério, tutela nem subordinação hierárquica.","O BACEN é autarquia especial sem vinculação ministerial, não empresa pública da Fazenda.","O BACEN executa políticas do CMN, mas isso não configura subordinação hierárquica.","Sua natureza jurídica é autarquia, não sociedade empresarial de economia mista."]],
[3,"Natureza e funções",0,"Qual é o objetivo fundamental do Banco Central do Brasil?","Assegurar a estabilidade dos preços","Maximizar o lucro do sistema bancário","Emitir títulos da dívida pública","Fixar a meta de inflação","O objetivo fundamental é a estabilidade dos preços; a meta quem define é o CMN.",0,"O objetivo fundamental tem a ver com o poder de compra da moeda ao longo do tempo.",["O objetivo fundamental é a estabilidade dos preços; a meta quem define é o CMN.","A finalidade fundamental é estabilidade dos preços, não maximizar lucro bancário.","O BACEN não pode emitir títulos próprios de dívida desde 2002.","A meta é definida pelo CMN; o objetivo do BC é manter a estabilidade dos preços."]],
[3,"Diretoria e mandato",0,"Quantos membros tem a Diretoria Colegiada do BACEN?","9 membros","3 membros","5 membros","12 membros","São 9 membros: 1 presidente e 8 diretores.",0,"Conte o presidente mais os diretores: a soma é um número ímpar menor que dez.",["São 9 membros: 1 presidente e 8 diretores.","Três membros é a composição do CMN. A diretoria do BACEN soma um presidente e oito diretores: 1 + 8 = 9.","Cinco membros é a composição da diretoria da CVM. A diretoria do BACEN soma um presidente e oito diretores, totalizando nove.","Doze excede a composição da diretoria do BACEN: são um presidente e oito diretores, totalizando nove membros."]],
[3,"Diretoria e mandato",0,"Qual a duração do mandato dos diretores do BACEN?","Mandato fixo de quatro anos, permitida uma recondução.","Dois anos, sem possibilidade de recondução.","Oito anos, sem possibilidade de recondução.","Prazo indeterminado, com exoneração por decisão presidencial.","Mandato fixo de 4 anos, reconduzível uma vez (4 + 4).",0,"O mandato é fixo e pode ser renovado uma vez, o que dobra o período máximo.",["Mandato fixo de 4 anos, reconduzível uma vez (4 + 4).","O mandato inicial é de quatro anos e admite uma recondução.","Oito anos é o total possível de dois mandatos; não a duração de um mandato único.","O mandato é fixo; não depende apenas da vontade do Presidente da República."]],
[3,"Natureza e funções",0,"Quando o Banco Central oferece empréstimos às instituições financeiras, atua como:","Banco dos bancos","Banco do governo","Supervisor do SFN","Casa da Moeda","Banco dos bancos: recolhimentos, redesconto e empréstimos às instituições.",0,"Pense no papel de quem empresta às próprias instituições financeiras, como um banco para elas.",["Banco dos bancos: recolhimentos, redesconto e empréstimos às instituições.","Banco do governo envolve reservas e funções com títulos públicos, não empréstimos às instituições.","Fiscalizar e autorizar caracteriza supervisão; emprestar às instituições é banco dos bancos.","A Casa da Moeda realiza a impressão física de moeda; a emissão econômica e a política monetária cabem ao BACEN. Para esta pergunta: Banco dos bancos: recolhimentos, redesconto e empréstimos às instituições."]],
[3,"Diretoria e mandato",1,"Quem nomeia os diretores do BACEN e quem precisa aprová-los antes da nomeação?","Nomeia o Presidente da República; aprova o Senado Federal.","Nomeia o CMN; aprova a Câmara dos Deputados.","Nomeia o Senado Federal; aprova o Presidente da República.","Nomeia o Ministro da Fazenda; aprova o CMN.","Fluxo: indicação (Presidente), aprovação (Senado), nomeação (Presidente), mandato.",0,"O caminho tem quatro etapas: indicação e nomeação vêm de quem chefia o Executivo, e há uma aprovação no meio.",["Fluxo: indicação (Presidente), aprovação (Senado), nomeação (Presidente), mandato.","O CMN não nomeia e a Câmara não dá essa aprovação; os papéis são Presidente e Senado.","Inverte os papéis: o Senado aprova e o Presidente da República nomeia.","Ministro da Fazenda e CMN não substituem Presidente e Senado na nomeação e aprovação."]],
[3,"Política monetária",1,"Se a inflação ficar fora do intervalo de tolerância por seis meses consecutivos, ocorre:","Descumprimento da meta, exigindo divulgação das causas pelo BC.","Descumprimento da meta e substituição automática do presidente do BC.","Revisão imediata da meta pelo CMN para acomodar a inflação observada.","Ausência de descumprimento, pois a verificação seria apenas anual.","Seis meses consecutivos fora da tolerância configuram descumprimento da meta.",0,"O prazo conta meses seguidos fora da tolerância, e não o ano-calendário.",["Seis meses consecutivos fora da tolerância configuram descumprimento da meta.","O descumprimento exige comunicação das razões, não substituição automática do presidente.","A meta não muda automaticamente para acomodar a inflação observada.","A regra contínua conta seis meses consecutivos fora da tolerância, sem esperar o encerramento anual."]],
[3,"Competências",1,"Quem imprime o dinheiro e quem faz a emissão da moeda?","Casa da Moeda imprime; BACEN emite.","BACEN imprime; Casa da Moeda emite.","CMN imprime; BACEN emite.","Tesouro Nacional imprime; CVM emite.","Emissão é o processo econômico (BACEN); impressão é o processo físico (Casa da Moeda).",0,"A emissão é um processo econômico (inserir moeda na economia); a impressão é um processo físico.",["Emissão é o processo econômico (BACEN); impressão é o processo físico (Casa da Moeda).","Inverte os processos: impressão física é da Casa da Moeda; emissão econômica é do BACEN.","O CMN normatiza, mas não imprime as cédulas.","O Tesouro não imprime e a CVM não emite moeda; os papéis são Casa da Moeda e BACEN."]],
[3,"Competências",1,"Sobre os recolhimentos compulsórios, o BACEN:","Define os percentuais e recebe os recolhimentos compulsórios.","Recebe os recolhimentos; a CVM determina os percentuais.","Determina os percentuais; o Tesouro recebe os recolhimentos.","Delega ao CMN a determinação e o recebimento dos recolhimentos.","O BACEN determina os percentuais e recebe os recolhimentos compulsórios.",0,"O BACEN atua nas duas pontas dos compulsórios: fixar o quanto e receber o recolhimento.",["O BACEN determina os percentuais e recebe os recolhimentos compulsórios.","Os percentuais também são determinados pelo BACEN, não pela CVM.","O BACEN determina e recebe; o recebimento não é atribuído ao Tesouro nessa regra.","O BACEN determina os percentuais e recebe os compulsórios. Essa execução não é delegada ao CMN."]],
[3,"BACEN x CMN",1,"Pelo macete da aula, “zelar pela liquidez e solvência das instituições financeiras” está associado a:","CMN","BACEN","CVM","Copom","Liquidez e solvência: CMN. Estabilidade e eficiência do sistema financeiro: BACEN.",0,"O macete separa dois sentidos de “zelar”: um ligado à saúde financeira das instituições e outro à estabilidade do sistema. Veja a que órgão normativo cabe o primeiro.",["Liquidez e solvência: CMN. Estabilidade e eficiência do sistema financeiro: BACEN.","O BACEN executa a política monetária e supervisiona instituições; não substitui o CMN na definição da meta de inflação. Para esta pergunta: Liquidez e solvência: CMN. Estabilidade e eficiência do sistema financeiro: BACEN.","A CVM regula e supervisiona o mercado de valores mobiliários, como ações, debêntures e fundos. Para esta pergunta: Liquidez e solvência: CMN. Estabilidade e eficiência do sistema financeiro: BACEN.","O Copom é o comitê do Banco Central que define a meta da taxa Selic; não define a meta de inflação nem assessora o CMN como a Comoc. Para esta pergunta: Liquidez e solvência: CMN. Estabilidade e eficiência do sistema financeiro: BACEN."]],
[3,"Política monetária",1,"No descumprimento da meta de inflação, o BACEN deve divulgar as razões por meio de:","Nota no relatório monetário e carta ao Ministro da Fazenda.","Decreto presidencial e nota enviada ao presidente da CVM.","Resolução do Senado e carta encaminhada ao Congresso Nacional.","Circular da Comoc e carta encaminhada aos membros do Copom.","A carta aberta vai ao Ministro da Fazenda, que preside o CMN.",0,"Pense em um documento que o BC já publica regularmente e em uma comunicação dirigida a uma autoridade.",["A carta aberta vai ao Ministro da Fazenda, que preside o CMN.","A prestação de contas descrita é nota no relatório e carta à Fazenda, não decreto nem nota na CVM.","Não se exige resolução do Senado nem carta ao Congresso nesse procedimento.","Comoc e Copom não são os destinatários da carta aberta prevista para descumprimento."]],
[3,"Diretoria e mandato",1,"Em que momento do mandato do Presidente da República começa o mandato do Presidente do BACEN?","No início do terceiro ano.","No início do primeiro ano.","No início do segundo ano.","No início do quarto ano.","O mandato do Presidente do BACEN começa no início do 3º ano do mandato presidencial.",0,"Lembre-se do cronograma escalonado: o presidente do BACEN não começa junto com o presidente da República.",["O mandato do Presidente do BACEN começa no início do 3º ano do mandato presidencial.","O início é no terceiro ano; não coincide com a posse presidencial.","O segundo ano antecede o marco de início do mandato: o presidente do BACEN começa no início do terceiro ano do mandato presidencial.","O quarto ano é posterior ao início de mandato previsto no terceiro."]],
[3,"Autorização e supervisão",1,"Qual das situações exige autorização do BACEN à instituição financeira?","Praticar operações de câmbio.","Abrir uma nova conta corrente para um cliente.","Lançar uma campanha publicitária.","Trocar o fornecedor de material de escritório.","Exigem autorização: funcionar, câmbio, alterar estatutos, transferir controle, entre outras.",0,"Procure a operação que muda a atuação ou a estrutura da própria instituição, e não uma rotina do dia a dia.",["Exigem autorização: funcionar, câmbio, alterar estatutos, transferir controle, entre outras.","Abrir a conta de um cliente é atendimento operacional, não a autorização institucional descrita.","Campanha publicitária não é o ato de câmbio ou reorganização sujeito à autorização citada.","Trocar material de escritório não é o ato institucional de autorização apontado pela aula."]],
[3,"Competências",1,"Desde 2002, o BACEN:","Não pode mais emitir títulos de dívida pública.","Pode emitir títulos de dívida pública sem limites.","Passou a imprimir papel-moeda diretamente.","Deixou de executar a política monetária.","Os títulos emitidos antes já foram resgatados.",0,"A vedação é recente e se refere à emissão de títulos pela autarquia, e não à emissão de moeda.",["Os títulos emitidos antes já foram resgatados.","Desde 2002 o BACEN não pode emitir seus próprios títulos de dívida pública.","Imprimir moeda continua sendo o processo físico da Casa da Moeda, distinto da emissão econômica pelo BACEN.","A vedação refere-se a emitir dívida própria; não extingue a execução da política monetária."]],
[3,"Natureza e funções",1,"Entre as características do BACEN, estão:","Autonomia, estabilidade dos mandatos e sede em Brasília.","Subordinação à Fazenda, exoneração livre e sede em Brasília.","Autonomia, mandatos fixos e sede em São Paulo.","Autonomia administrativa, mandato indeterminado e sede em Brasília.","Autarquia especial, principal executor das políticas do CMN, autônoma, com diretores estáveis.",0,"Reúna as características gerais do BACEN: independência, situação dos diretores e estrutura física.",["Autarquia especial, principal executor das políticas do CMN, autônoma, com diretores estáveis.","O BACEN não tem subordinação hierárquica a ministério; os diretores têm mandato e estabilidade.","A sede é Brasília; a aula informa nove regionais, não quatro.","A autonomia possui quatro dimensões e os mandatos têm duração determinada."]],
[3,"Diretoria e mandato",2,"Em um mandato de quatro anos do Presidente da República, quantos diretores do BACEN iniciam mandato a cada ano, e em que ano começa o Presidente do BACEN?","Dois diretores por ano; o Presidente do BACEN no terceiro ano.","Um diretor por ano; o Presidente do BACEN no primeiro ano.","Dois diretores por ano; o Presidente do BACEN no primeiro ano.","Quatro diretores a cada dois anos; o Presidente do BACEN no quarto ano.","São 2 diretores por ano (8 no total), e o Presidente começa no 3º ano.",0,"São 8 diretores distribuídos em 4 anos, e o presidente tem um ano de início próprio.",["São 2 diretores por ano (8 no total), e o Presidente começa no 3º ano.","São dois diretores por ano, e o Presidente do BACEN começa no terceiro ano.","Acerta os dois diretores, mas antecipa indevidamente o início do Presidente do BACEN.","A distribuição é anual, dois diretores por ano; o Presidente começa no terceiro, não no quarto."]],
[3,"Diretoria e mandato",2,"Como segue a proposta de exoneração de um diretor do BACEN por desempenho insuficiente, comprovado e recorrente?","Proposta do CMN ao Presidente; aprovação prévia do Senado por maioria absoluta.","Decisão direta do Presidente; dispensa de aprovação prévia por parte do Senado.","Proposta do Senado ao Presidente; aprovação do CMN por maioria simples.","Proposta da Comoc ao Ministro da Fazenda; aprovação ministerial da exoneração.","O CMN propõe, e o Senado aprova previamente, por maioria absoluta.",0,"A exoneração por desempenho exige três etapas formais, envolvendo três atores.",["O CMN propõe, e o Senado aprova previamente, por maioria absoluta.","A exoneração por esse motivo exige aprovação prévia do Senado por maioria absoluta.","Inverte o procedimento: o CMN apresenta a proposta e o Senado dá a aprovação prévia.","Comoc e Ministro da Fazenda não substituem CMN, Senado e Presidente da República nesse processo."]],
[3,"Política monetária",2,"Depois do descumprimento da meta e da primeira comunicação, uma nova comunicação do BACEN ocorre:","Se o retorno não ocorrer no prazo ou for preciso rever medidas ou prazo.","A cada mês fora do intervalo, mesmo sem necessidade de rever medidas ou prazo.","Se o Senado decidir solicitar outra carta, independentemente do prazo anunciado.","Não há nova comunicação, mesmo se falhar o prazo ou mudarem as medidas previstas.","A nova comunicação é exceção: prazo estourado ou necessidade de atualizar as providências.",0,"A segunda comunicação é uma exceção: só ocorre em duas situações específicas.",["A nova comunicação é exceção: prazo estourado ou necessidade de atualizar as providências.","Não há obrigação de repetir a carta mensalmente; a nova comunicação depende das condições previstas.","O procedimento não depende de uma decisão do Senado.","É necessária nova comunicação se o prazo não for cumprido ou as providências precisarem ser atualizadas."]],
[3,"BACEN x CMN",2,"Um enunciado diz que o órgão deve “efetuar operações de compra e venda de títulos públicos federais como instrumento de política monetária”. Pelo conteúdo da aula, trata-se de atribuição do:","BACEN, que executa a política monetária e ajusta a liquidez.","CMN, executor direto da política monetária.","CVM, supervisora do mercado de valores mobiliários.","Tesouro Nacional, prestador de redesconto aos bancos.","Verbos de execução (efetuar, emitir, realizar) apontam para o BACEN.",0,"Os verbos “efetuar”, “emitir” e “realizar” costumam indicar o órgão que executa, e não o que normatiza.",["Verbos de execução (efetuar, emitir, realizar) apontam para o BACEN.","O CMN estabelece diretrizes e normas gerais; não executa operações nem fiscaliza diretamente as instituições. Para esta pergunta: Verbos de execução (efetuar, emitir, realizar) apontam para o BACEN.","A CVM regula e supervisiona o mercado de valores mobiliários, como ações, debêntures e fundos. Para esta pergunta: Verbos de execução (efetuar, emitir, realizar) apontam para o BACEN.","O Tesouro atua na administração das finanças e da dívida pública; não substitui as competências do CMN, BACEN ou CVM descritas na aula. Para esta pergunta: Verbos de execução (efetuar, emitir, realizar) apontam para o BACEN."]],
[3,"Autorização e supervisão",2,"Sobre a instalação de novas agências de instituições financeiras domiciliadas no exterior, o BACEN:","Pode reconhecer o interesse do governo com base em análise técnica.","Delega a análise à CVM, que decide sobre o interesse do governo.","Precisa de aprovação prévia do Senado para reconhecer esse interesse.","Reconhece o interesse de forma automática, dispensando análise técnica.","A autorização envolve análise técnica e reconhecimento de interesse do Governo.",0,"A aula cita duas condições para o BACEN aceitar essa instalação.",["A autorização envolve análise técnica e reconhecimento de interesse do Governo.","O BACEN participa da autorização; a CVM não assume esse processo.","O requisito descrito é análise técnica e reconhecimento do interesse governamental, não aprovação prévia do Senado.","O reconhecimento exige análise técnica, portanto não é automático."]],
[3,"Competências",3,"Considere as afirmações: I. O BACEN determina os percentuais dos recolhimentos compulsórios e os recebe. II. A impressão de moeda é feita pelo BACEN, e a emissão, pela Casa da Moeda. III. Desde 2002, o BACEN não pode emitir títulos de dívida pública. Está(ão) correta(s):","Apenas I e III.","Apenas I e II.","Apenas II e III.","I, II e III.","A II inverte: a emissão é do BACEN, e a impressão é da Casa da Moeda.",0,"",["A II inverte: a emissão é do BACEN, e a impressão é da Casa da Moeda.","Inclui II, que não deve fazer parte do conjunto correto. Deixa de incluir III, que faz parte do conjunto correto. A II inverte: a emissão é do BACEN, e a impressão é da Casa da Moeda.","Inclui II, que não deve fazer parte do conjunto correto. Deixa de incluir I, que faz parte do conjunto correto. A II inverte: a emissão é do BACEN, e a impressão é da Casa da Moeda.","Inclui II, que não deve fazer parte do conjunto correto. A II inverte: a emissão é do BACEN, e a impressão é da Casa da Moeda."]],
[3,"Natureza e funções",3,"Assinale a alternativa INCORRETA sobre o BACEN.","O BACEN é subordinado à Fazenda e seus diretores podem ser demitidos livremente.","O BACEN tem autonomia técnica, operacional, administrativa e financeira.","Os diretores do BACEN possuem mandato fixo e estabilidade durante o mandato.","O BACEN é o principal executor das políticas monetárias definidas pelo CMN.","O BACEN não tem vinculação a Ministério nem subordinação hierárquica.",0,"",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. O BACEN não tem vinculação a Ministério nem subordinação hierárquica.","As quatro dimensões de autonomia fazem parte da natureza especial do BACEN. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Mandato fixo e estabilidade protegem os diretores de exoneração livre. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","O BACEN executa as políticas estabelecidas pelo conselho normativo CMN. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[3,"Diretoria e mandato",3,"Considere as etapas de um diretor do BACEN: (1) nomeação; (2) aprovação; (3) indicação; (4) início do mandato. Qual é a ordem correta?","3, 2, 1, 4.","3, 1, 2, 4.","1, 3, 2, 4.","2, 3, 1, 4.","Indicação (Presidente), aprovação (Senado), nomeação (Presidente), mandato.",0,"",["Indicação (Presidente), aprovação (Senado), nomeação (Presidente), mandato.","Coloca a nomeação antes da aprovação do Senado; a aprovação deve precedê-la.","A nomeação não pode preceder a indicação e a aprovação.","A aprovação do Senado vem depois da indicação do Presidente da República."]],
[3,"Natureza e funções",3,"Classifique as atribuições: (a) receber depósitos voluntários e recolhimentos compulsórios das instituições; (b) ser depositário das reservas internacionais; (c) autorizar, normatizar, fiscalizar e intervir nas instituições. Correspondem, respectivamente, às funções de:","Banco dos bancos, banco do governo e supervisor do SFN.","Banco do governo, banco dos bancos e supervisor do SFN.","Banco dos bancos, supervisor do SFN e banco do governo.","Executor da política monetária, banco dos bancos e banco do governo.","(a) banco dos bancos; (b) banco do governo; (c) supervisor do SFN.",0,"",["(a) banco dos bancos; (b) banco do governo; (c) supervisor do SFN.","Troca as duas primeiras funções: receber recursos das instituições é banco dos bancos; reservas são banco do governo.","Reservas internacionais correspondem ao banco do governo; autorizar e fiscalizar corresponde à supervisão.","Receber compulsórios corresponde ao banco dos bancos; autorizar e intervir não é banco do governo."]],
[3,"Política monetária",3,"A inflação ficou acima do teto da tolerância por cinco meses consecutivos e, no sexto mês, voltou ao intervalo. Depois, ficou fora por seis meses seguidos. Pela regra da aula, o que se pode afirmar?","Só o segundo episódio descumpre a meta; o BC divulga as razões.","Os dois episódios descumprem a meta; bastam cinco meses consecutivos.","Nenhum episódio descumpre a meta; a verificação ocorre ao fim do ano.","Só há descumprimento nos episódios se o CMN deliberar sobre cada caso.","Contam meses consecutivos: o bloco de cinco não configura; os seis seguidos configuram.",0,"",["Contam meses consecutivos: o bloco de cinco não configura; os seis seguidos configuram.","Cinco meses não atingem o requisito de seis consecutivos; o retorno à tolerância interrompe a sequência.","A regra é contínua e apurada mensalmente, não apenas ao fim do ano.","O critério é objetivo: seis meses consecutivos fora da tolerância; não depende de decisão discricionária do CMN."]],
[1,"Mercados",0,"Qual mercado do SFN está ligado à proteção contra riscos, por meio de apólices?","De seguros","De câmbio","Monetário","De capitais","O mercado de seguros oferece proteção contra riscos.",0,"Pense no mercado em que se contratam apólices para se proteger de prejuízos.",["O mercado de seguros oferece proteção contra riscos.","O câmbio negocia moedas estrangeiras; não é o mercado de liquidez, de apólices ou de emissão de debêntures. Para esta pergunta: O mercado de seguros oferece proteção contra riscos.","O mercado monetário trata da liquidez e dos juros básicos com operações de curtíssimo e curto prazo. Para esta pergunta: O mercado de seguros oferece proteção contra riscos.","O mercado de capitais envolve ações e títulos corporativos e financia predominantemente o longo prazo, segundo a aula. Para esta pergunta: O mercado de seguros oferece proteção contra riscos."]],
[1,"Serviços",0,"Qual das opções é um exemplo de meio de pagamento oferecido pelas instituições financeiras?","Boleto bancário","Debênture","Apólice de seguro","Ação de companhia aberta","Transferências, cartões e boletos são meios de pagamento (prestação de serviços).",0,"Meio de pagamento é um instrumento para movimentar dinheiro. Descarte o que é título de investimento ou de proteção.",["Transferências, cartões e boletos são meios de pagamento (prestação de serviços).","Debênture é um título de dívida corporativa do mercado de capitais; não moeda estrangeira, apólice ou meio de pagamento. Para esta pergunta: Transferências, cartões e boletos são meios de pagamento (prestação de serviços).","Apólice formaliza um contrato de seguro e a proteção contra riscos; não é um instrumento de pagamento ou crédito bancário. Para esta pergunta: Transferências, cartões e boletos são meios de pagamento (prestação de serviços).","Ação representa participação no capital de uma companhia e é valor mobiliário; não um depósito nem um meio de pagamento. Para esta pergunta: Transferências, cartões e boletos são meios de pagamento (prestação de serviços)."]],
[1,"Agentes e intermediação",0,"Uma pessoa física que aplica R$ 5 mil em um CDB é, nessa relação com o banco, um agente:","Provedor de recursos, na posição de superavitário.","Tomador de recursos, na posição de deficitário.","Intermediador entre o banco e outros investidores.","Garantidor dos empréstimos concedidos pelo banco.","Quem aplica tem sobra de recursos, logo é superavitário.",0,"Quem aplica o dinheiro está, em relação ao banco, com recursos sobrando.",["Quem aplica tem sobra de recursos, logo é superavitário.","Deficitário é quem necessita de recursos e pode tomar crédito; não é quem aplica uma sobra de caixa. Para esta pergunta: Quem aplica tem sobra de recursos, logo é superavitário.","A pessoa fornece recursos ao banco ao aplicar no CDB. Quem conecta a aplicação ao crédito é o banco, não esse investidor.","Aplicar no CDB não torna a pessoa garantidora dos empréstimos do banco. Ela é credora do banco, na posição de agente superavitário."]],
[1,"Mercados",1,"Qual é a principal diferença entre o mercado de capitais e o mercado de crédito?","Capitais: longo prazo por valores mobiliários; crédito: empréstimos e financiamentos.","Capitais: moedas estrangeiras; crédito: cobertura de riscos por contratos de seguro.","Capitais: liquidez de curtíssimo prazo; crédito: financiamento de longo prazo.","Capitais e crédito: mesmos instrumentos e prazos, sem diferença de função.","Capitais: longo prazo. Crédito: curto e médio prazo.",0,"Compare o prazo típico de cada mercado e o tipo de produto que ele negocia.",["Capitais: longo prazo. Crédito: curto e médio prazo.","Moedas estrangeiras pertencem ao câmbio e proteção por apólices pertence a seguros.","Curtíssimo prazo caracteriza o monetário; capitais financia predominantemente o longo prazo.","Há diferença de instrumentos e de prazo: capitais, longo; crédito, curto e médio segundo a aula."]],
[1,"Spread",1,"Se um banco reduz a taxa que cobra nos empréstimos e mantém a taxa que paga aos poupadores, o que acontece com o spread?","Diminui, pela queda na diferença entre empréstimo e captação.","Aumenta: a redução da taxa de empréstimo amplia a diferença.","Não muda: a diferença depende da taxa de captação isolada.","Dobra: emprestar mais barato reduz pela metade o risco.","Spread é a taxa cobrada menos a taxa paga; reduzir a cobrada o diminui.",0,"Spread é a taxa cobrada menos a taxa paga. Reduza o primeiro termo e observe o resultado da subtração.",["Spread é a taxa cobrada menos a taxa paga; reduzir a cobrada o diminui.","Reduzir o juro cobrado, mantendo o pago, diminui a diferença, não a aumenta.","O spread depende das duas taxas; mudar o juro do empréstimo altera a diferença.","Não há duplicação automática; com captação constante e juro cobrado menor, o spread cai."]],
[1,"Mercados",1,"Uma importadora compra euros para pagar um fornecedor no exterior e, para isso, toma um empréstimo de 90 dias. Quais mercados estão envolvidos?","Câmbio na compra de euros; crédito no empréstimo de 90 dias.","Câmbio na compra de euros; capitais no empréstimo de 90 dias.","Monetário na compra de euros; crédito no empréstimo de 90 dias.","Crédito na compra de euros; câmbio no empréstimo de 90 dias.","A compra de moeda é câmbio; o empréstimo de curto prazo é crédito.",0,"Separe a operação de trocar de moeda da operação de tomar dinheiro, e associe cada uma a um mercado.",["A compra de moeda é câmbio; o empréstimo de curto prazo é crédito.","A compra de euros é câmbio, mas o empréstimo bancário de 90 dias é crédito; não é uma captação por valores mobiliários no mercado de capitais.","O empréstimo é crédito, mas a compra de euros envolve câmbio, não o mercado monetário de gestão de liquidez.","As funções foram invertidas: comprar euros é câmbio; tomar o empréstimo é crédito."]],
[1,"Mercados",1,"Qual descrição corresponde ao mercado monetário?","Negociação de ativos de curto prazo para gestão da liquidez monetária.","Negociação de ações e títulos corporativos para obter capital de longo prazo.","Negociação de moedas estrangeiras para realizar pagamentos internacionais.","Negociação de seguros e resseguros para transferir riscos entre agentes.","O monetário negocia ativos de curto prazo para gerenciar a liquidez.",0,"Pense no mercado cujo papel é ajustar a quantidade de dinheiro disponível na economia.",["O monetário negocia ativos de curto prazo para gerenciar a liquidez.","Ações e títulos corporativos de longo prazo caracterizam o mercado de capitais.","Negociar moedas estrangeiras caracteriza o mercado de câmbio.","Seguros e resseguros pertencem ao mercado de seguros, não ao monetário."]],
[1,"Estrutura do SFN",1,"Uma corretora de valores e uma cooperativa de crédito, na estrutura do SFN, são classificadas como:","Entidades operacionais","Órgãos normativos","Entidades supervisoras","Autoridades monetárias","Instituições que operam com o público são entidades operacionais.",0,"Ambas atendem diretamente o público. Pense em qual nível da estrutura isso as coloca.",["Instituições que operam com o público são entidades operacionais.","O nível normativo define as diretrizes e regras gerais; não atende clientes nem fiscaliza o dia a dia. Para esta pergunta: Instituições que operam com o público são entidades operacionais.","O nível supervisor fiscaliza o cumprimento das regras; não se confunde com o operador que atende clientes. Para esta pergunta: Instituições que operam com o público são entidades operacionais.","Corretoras e cooperativas atendem clientes como operadores; não são autoridades monetárias."]],
[1,"Spread",2,"Um banco capta a 9% a.a. e empresta a 15% a.a. Se perde 2% do valor emprestado com inadimplência, qual a margem que sobra, em pontos percentuais?","4 p.p.","6 p.p.","2 p.p.","8 p.p.","Spread de 6 p.p. menos 2 p.p. de perdas deixa 4 p.p.",0,"Calcule primeiro o spread e depois subtraia a perda por inadimplência.",["Spread de 6 p.p. menos 2 p.p. de perdas deixa 4 p.p.","6 p.p. é o spread antes de descontar as perdas de 2 p.p.","2 p.p. é o valor das perdas, não a margem restante após 15 − 9 − 2.","8 p.p. soma as perdas ao spread; elas devem ser subtraídas, deixando 4 p.p."]],
[1,"Estrutura do SFN",2,"Considere: I. A intermediação financeira gera o spread. II. Meios de pagamento são prestação de serviços. III. O CMN, como órgão normativo, fiscaliza diariamente as instituições. Está(ão) correta(s):","Apenas I e II.","Apenas I e III.","Apenas II e III.","I, II e III.","A III está errada: a fiscalização é das entidades supervisoras.",0,"Confira cada afirmação isoladamente. Uma delas dá a um órgão normativo uma tarefa diária de fiscalização.",["A III está errada: a fiscalização é das entidades supervisoras.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir II, que faz parte do conjunto correto. A III está errada: a fiscalização é das entidades supervisoras.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir I, que faz parte do conjunto correto. A III está errada: a fiscalização é das entidades supervisoras.","Inclui III, que não deve fazer parte do conjunto correto. A III está errada: a fiscalização é das entidades supervisoras."]],
[1,"Mercados",3,"Uma exportadora converte em reais os dólares recebidos (i), aplica parte do caixa por 30 dias em um CDB (ii) e toma um financiamento de 18 meses para comprar máquinas (iii). Qual alternativa classifica corretamente cada situação?","(i) mercado de câmbio; (ii) empresa como agente superavitária; (iii) mercado de crédito.","(i) mercado monetário; (ii) empresa como agente deficitária; (iii) mercado de capitais.","(i) mercado de câmbio; (ii) empresa como agente deficitária; (iii) mercado de seguros.","(i) mercado de crédito; (ii) empresa como agente superavitária; (iii) mercado de câmbio.","Conversão de moeda: câmbio; aplicar sobra: superavitário; financiamento: crédito.",0,"",["Conversão de moeda: câmbio; aplicar sobra: superavitário; financiamento: crédito.","A conversão é câmbio, a aplicação de sobra torna a empresa superavitária e o financiamento é crédito.","A empresa que aplica a sobra é superavitária; financiar máquinas é crédito, não seguro.","Converter dólares é câmbio; o financiamento é crédito. Só a classificação da aplicação está certa."]],
