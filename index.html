function flow(t,st){return `<div class="pn"><h3>${t}</h3><div class="fx">${st.map(([a,b,k],i)=>`${i?'<span class="ar">→</span>':""}<div class="bx"${k?` style="border-left:4px solid var(--${k})"`:""}><b>${a}</b><div class="s mu">${b}</div></div>`).join("")}</div></div>`}
function dgv(d){return d[0]==="f"?flow(d[1],d[2]):`<div class="pn"><h3>${d[1]}</h3><div class="fx">${d[2].map(([a,b,k])=>`<div class="bx"${k?` style="border-left:4px solid var(--${k})"`:""}><b>${a}</b><div class="s mu">${b}</div></div>`).join("")}</div></div>`}
function tbl(t,h,r){return `<div class="pn tbc"><h3 class="tt">${t}</h3><div style="overflow-x:auto"><table class="tx"><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div></div>`}
function tlv(t,it){const k=["ac","ok","md","hd"];return `<div class="pn"><h3>${t}</h3><div class="fx">${it.map(([a,b,c],i)=>`<div class="bx" style="border-top:4px solid var(--${k[i%4]})"><b>${a}</b><div>${b}</div>${c?`<div class="s mu">${c}</div>`:""}</div>`).join("")}</div></div>`}
function fcv(F){const c=F[fi];return `<div class="fcd" onclick="ff=!ff;go()">${ff?`<div>${badge(c[2])}<span class="s mu">Resposta</span></div><div>${c[1]}</div>`:`<div>${badge(c[2])}<span class="s mu">Pergunta ${fi+1} de ${F.length}</span></div><div>${c[0]}</div>`}</div><button class="chip on" style="width:100%;padding:14px;font-size:17px" onclick="ff=!ff;go()">${ff?"Voltar à pergunta":"Virar cartão"}</button><div class="chips" style="margin-top:10px"><button onclick="fi=(fi+${F.length}-1)%${F.length};ff=0;go()">Anterior</button><button onclick="fi=(fi+1)%${F.length};ff=0;go()">Próximo</button><button onclick="fi=Math.floor(Math.random()*${F.length});ff=0;go()">Aleatório</button></div>`}
function mchips(t,key,o){return `<div class="s mu">${t}</div><div class="chips">${o.map(([l,v])=>`<button class="chip${mt[key]===v?" on":""}" onclick="mt['${key}']=${JSON.stringify(v).replace(/"/g,"'")};fi=0;ff=0;go()">${l}</button>`).join("")}</div>`}
function mat(){const M=MAT[mt.a];return `<p class="mu s">Material de apoio, separado por aula e por tipo. Eu redesenho o conteúdo a partir das aulas, então confira com o que o professor ensina.</p>${mchips("Aula","a",AL.map((a,i)=>["Aula "+(i+1),i+1]))}${mchips("Tipo","c",MC)}`+({mapa:()=>mapa(M),diag:()=>'<p class="s mu">Nos diagramas, a mesma cor indica o mesmo papel.</p>'+M.dg.map(dgv).join(""),tab:()=>M.tb.map(x=>tbl(...x)).join(""),tl:()=>M.tl.map(x=>tlv(...x)).join(""),fc:()=>fcv(M.fc)})[mt.c]()}
function estuda(n,md){cfg.a=n;cfg.n=-1;cfg.m="all";cfg.md=md;cfg.c=10;begin(mix(),md)}
// Destaques exclusivos da trilha: negrito, condições/exceções e negações/proibições.
function lessonText(text){return escapeText(text).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\{\{(atencao|negacao)\|([^{}]+)\}\}/g,(_,kind,label)=>`<strong class="lesson-${kind==="atencao"?"attention":"negative"}">${label}</strong>`)}
function acc(t,it,c){return `<details class="acc" style="--c:var(--${c})"><summary>${t}</summary><div class="acb">${it.map(x=>`<div class="pt" style="border-left-color:var(--${c})">${lessonText(x)}</div>`).join("")}</div></details>`}
function trilhaV(){const n=tr,a=AL[n-1],E=H.filter(x=>Q[x[0]-1]&&Q[x[0]-1][0]===n),p=pct(E.filter(x=>x[1]).length,E.length),c=E.length?sem(p):"",er=errs().filter(i=>Q[i-1][0]===n).length,tot=Q.filter(q=>q[0]===n&&q[2]<3).length,hc=Q.filter(q=>q[0]===n&&q[2]===3).length;
return `<div class="lay"><nav class="tr"><div class="s mu" style="margin-bottom:8px">Minha trilha</div>${AL.map((x,i)=>{const k=x.t.split(": ");return `<div class="st"><button class="tb${tr===i+1?" on":""}" onclick="tr=${i+1};go()"><span>${k[0]}<br><span class="s mu">${k[1]}</span></span>${pc(i+1)}</button></div>`}).join("")}</nav>
<div class="mn" style="max-width:820px"><div class="hero"><div class="s mu">Aula ${n} de ${AL.length}</div><h2>${a.t.split(": ")[1]}</h2><p class="mu" style="margin:0 0 12px">${a.o}</p><div class="chips" style="margin:0"><button class="chip on" onclick="estuda(${n},'e')">Estudar esta aula</button><button class="chip" style="border-color:var(--hc);color:var(--hc)" onclick="estuda(${n},'h')">Hardcore desta aula</button><button class="chip" onclick="mt.a=${n};fi=0;ff=0;view='m';go()">Material de apoio</button></div></div>
<div class="g4">${[["Aproveitamento",E.length?p+"%":"sem dados",c],["Respondidas",E.length,""],["Erros pendentes",er,""],["Questões",tot+" + "+hc+" hardcore",""]].map(([l,v,k])=>`<div class="m"><div class="mu s">${l}</div><div class="mv" style="${k?`color:var(--${k});`:""}font-size:22px">${v}</div></div>`).join("")}</div>
<h3 class="sec">Números para decorar</h3><div class="g4">${a.n.map(([v,l])=>`<div class="m"><div class="mv" style="color:var(--ac)">${v}</div><div class="s mu">${l}</div></div>`).join("")}</div><div style="margin-top:22px">${acc("Resumo da aula",a.r,"ac")}${acc("Dicas e macetes",a.d,"md")}${acc("Pegadinhas",a.p,"hd")}</div></div></div>`}
const IC={bk:'<path d="M8 40V18l6-4v-4h4v4h4v-4h4v4h4v-4h4v4l6 4v22z" fill="#f5a623"/><rect x="20" y="26" width="8" height="14" fill="#fff" opacity=".4"/>',ch:'<circle cx="30" cy="14" r="7" fill="none" stroke="#f5a623" stroke-width="4"/><path d="M26 19L10 38M14 33l5 4M18 29l5 4" stroke="#f5a623" stroke-width="4" fill="none"/>',bv:'<rect x="6" y="8" width="36" height="32" fill="#e8f0fb" stroke="#4a86d6" stroke-width="2"/><path d="M10 34l8-10 6 6 10-14" stroke="#4a86d6" stroke-width="3" fill="none"/><circle cx="18" cy="24" r="2.5" fill="#f5a623"/><circle cx="34" cy="16" r="2.5" fill="#f5a623"/>',co:'<circle cx="16" cy="14" r="5" fill="#1d3b72"/><path d="M8 40V26a8 8 0 0116 0v14z" fill="#1d3b72"/><circle cx="32" cy="14" r="5" fill="#3d5f9e"/><path d="M24 40V26a8 8 0 0116 0v14z" fill="#3d5f9e"/>',cr:'<ellipse cx="22" cy="36" rx="14" ry="5" fill="#f5a623"/><ellipse cx="22" cy="29" rx="14" ry="5" fill="#f8bb4a"/><ellipse cx="22" cy="22" rx="14" ry="5" fill="#f5a623"/><circle cx="38" cy="14" r="5" fill="#1d3b72"/>',bm:'<path d="M8 10h22a4 4 0 014 4v10a4 4 0 01-4 4H20l-8 7v-7H8a4 4 0 01-4-4V14a4 4 0 014-4z" fill="#f5a623"/><circle cx="34" cy="28" r="11" fill="#bfe0f5" stroke="#4a86d6" stroke-width="2"/><text x="34" y="33" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d3b72">$</text>',ip:'<rect x="4" y="12" width="28" height="19" rx="3" fill="#2f5fb0"/><rect x="14" y="20" width="28" height="19" rx="3" fill="#4a86d6"/><rect x="14" y="24" width="28" height="4" fill="#1d3b72"/>',dn:'<rect x="6" y="20" width="12" height="20" fill="#7ab0e6"/><rect x="18" y="8" width="14" height="32" fill="#4a86d6"/><rect x="32" y="16" width="10" height="24" fill="#2f5fb0"/>',sg:'<rect x="6" y="8" width="36" height="32" rx="4" fill="#4a86d6"/><rect x="12" y="14" width="24" height="20" rx="2" fill="#e8f0fb"/><circle cx="24" cy="24" r="5" fill="#f5a623"/>',ea:'<path d="M10 8c-6 8-6 24 0 32M38 8c6 8 6 24 0 32" stroke="#4a86d6" stroke-width="4" fill="none"/><text x="24" y="31" text-anchor="middle" font-size="22" font-weight="bold" fill="#4a86d6">$</text>',sc:'<rect x="6" y="30" width="6" height="10" fill="#4a86d6"/><rect x="16" y="24" width="6" height="16" fill="#4a86d6"/><rect x="26" y="18" width="6" height="22" fill="#4a86d6"/><circle cx="34" cy="12" r="8" fill="#f5a623"/><text x="34" y="17" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">$</text>',fp:'<circle cx="24" cy="24" r="16" fill="#e8f0fb" stroke="#4a86d6" stroke-width="3"/><text x="24" y="31" text-anchor="middle" font-size="20" font-weight="bold" fill="#4a86d6">$</text>'};

<div class="qv" style="background:#19a7d6">Operadores</div><div class="qc qw1"><div class="qops">${[["bk","Bancos e caixas econômicas"],["ch","Administradoras de consórcios"],["bv","Bolsa de Valores"],["co","Cooperativas de crédito"],["cr","Corretoras e distribuidoras*"],["bm","Bolsa de mercadorias e futuros"],["ip","Instituições de pagamento**"],["dn","Demais instituições não bancárias"]].map(x=>qo(...x)).join("")}</div></div><div class="qc qg1 qcol">${qo("sg","Seguradoras e Resseguradoras")}${qo("ea","Entidades abertas de previdência")}${qo("sc","Sociedades de capitalização")}</div><div class="qc qg1 qtop">${qo("fp","Entidades fechadas de previdência complementar (fundos de pensão)")}</div></div></div>`}
function go(){$("#app").innerHTML=`<h1>Painel de estudos CPA</h1><div class="nav">${[["d","Painel"],["x","Quadro do SFN"],["t","Trilha"],["q","Praticar"],["e","Erros ("+errs().length+")"],["m","Material de apoio"]].map(([v,t])=>`<button class="chip${view===v?" on":""}" onclick="view='${v}';${v==="d"?"sync();":""}go()">${t}</button>`).join("")}</div>`+(view==="d"?'<div style="max-width:960px">'+dash()+'</div>':view==="x"?quadro():view==="t"?trilhaV():'<div style="max-width:'+(view==="m"?"900":"720")+'px">'+(view==="m"?mat():view==="e"?revisao():qz?(qz.i>=qz.ids.length?fin():ques()):setup())+'</div>')}
