{"t":"Aula 1: Sistema Financeiro Nacional","o":"O que é o SFN, quem são os agentes, como o dinheiro circula e quem é quem na estrutura do sistema.","r":["O SFN é o conjunto de entidades e instituições que promovem a intermediação financeira entre poupadores (superavitários) e tomadores (deficitários).","Vantagens das instituições como intermediárias: fornecem liquidez, gerenciam riscos e informações, acessam dados dos clientes, são reguladas e supervisionadas e podem cobrar juros acima do teto da Lei da Usura (12% ao ano; Decreto 22.626/1933), conforme o risco.","Liquidez: facilidade e rapidez de converter um ativo em dinheiro sem perda significativa de valor.","Na intermediação, o spread (taxa cobrada do tomador menos taxa paga ao poupador) é receita bruta: o lucro só aparece depois de abater custos como agências e funcionários.","Prestação de serviços e gerenciamento de recursos: sistema de pagamentos, custódia de valores, meios de pagamento (cartões, cheques) e seguros.","Mercados: monetário (curto prazo e liquidez), crédito, câmbio, capitais (longo prazo), seguros (inclui previdência aberta) e previdência fechada.","Estrutura: entidades normativas (diretrizes, sem função executiva), supervisoras (fiscalização) e operacionais (intermediação ou serviços).","Regulação: heterorregulação (órgãos externos e independentes) e autorregulação (a própria indústria cria e aplica suas normas).","Quem é quem: moeda, crédito, capitais e câmbio (CMN; BCB e CVM), seguros privados (CNSP; Susep) e previdência fechada (CNPC; Previc)."],"d":["Quem tem sobra é superavitário; quem tem falta é deficitário.","Fixe os prazos: monetário (curto), crédito (curto e médio), capitais (longo).","Trio-chave: normativo faz a regra, supervisor fiscaliza, operacional atende o cliente.","Memorize o quadro: cada segmento tem um normativo e um supervisor (CMN com BCB e CVM; CNSP com Susep; CNPC com Previc).","Seguros inclui a previdência complementar aberta; a previdência fechada é outro mercado.","Na prova, primeiro identifique em qual mercado ou função o cenário se encaixa.","Mnemônico dos normativos: os três principais são “Conselhos” (CMN, CNSP e CNPC): todos começam com C e têm “Nacional” no nome.","Spread não é lucro: é receita bruta, antes dos custos operacionais.","“Poupador”, no SFN, é o agente superavitário, e não a caderneta de poupança.","Meta de desempenho do professor: busque mais de 80% de aproveitamento nos simulados."],"n":[["6","mercados do SFN"],["3","tipos de entidade: normativa, supervisora e operacional"],["3","segmentos no quadro do SFN"],["2","tipos de regulação"],["1933","Decreto da Lei da Usura (22.626)"],["12% a.a.","teto da Lei da Usura (as instituições financeiras são exceção)"],["80%","aproveitamento recomendado nos simulados"]],"p":["Não troque superavitário (sobra) e deficitário (falta).","O spread tende a subir quando o risco de calote sobe.","As instituições financeiras podem cobrar juros acima do teto da Lei da Usura.","Seguros inclui previdência aberta; a previdência fechada é um mercado à parte.","Heterorregulação é externa; autorregulação é feita pela própria indústria.","Spread não é lucro bancário: é receita bruta.","Poupador é o agente superavitário, não a caderneta de poupança.","O teto da Lei da Usura é de 12% ao ano, mas as instituições financeiras são exceção."]},
{t:"Aula 2: Conselho Monetário Nacional (CMN)",o:"O órgão que cria as regras do sistema financeiro e define a meta de inflação.",
r:["O CMN é o órgão deliberativo máximo e normativo superior do SFN, com funções normativas e não executivas.","Composição: Ministro da Fazenda (preside), Ministro do Planejamento e Orçamento e Presidente do Banco Central.","Atua como conselho de política econômica, coordenando as políticas monetária, creditícia, orçamentária, fiscal e da dívida pública.","Objetivos: orientar, propiciar, zelar (liquidez e solvência) e coordenar.","Define a meta de inflação (meta contínua, 12 meses); o Banco Central a persegue. Mudanças exigem aviso de 36 meses.","Reuniões mensais, decisão por maioria simples; em urgência, o presidente decide ad referendum. As normas saem como Resoluções CMN no DOU.","Comoc faz o assessoramento técnico; a Secretaria-Executiva do CMN e da Comoc é do Banco Central."],
d:["O verbo engana: o CMN decide e escreve a regra; quem fiscaliza e executa é o Banco Central ou a CVM.","Pergunta-teste: isso cria a regra ou confere o cumprimento?","Macete dos objetivos: O Povo Zela pelo Crescimento (Orientar, Propiciar, Zelar, Coordenar).","O CMN tem 3 membros; os diretores do BC aparecem na Comoc.","O número a lembrar sobre mudança de meta é 36 meses."],
n:[["3","membros do CMN"],["36 meses","aviso para mudar a meta"],["1999","início do regime de metas"],["Mensal","reuniões ordinárias do CMN e da Comoc"]],
p:["O CMN não fiscaliza: escreve a regra.","A meta da Selic é do Copom; a meta de inflação é do CMN.","Comoc (assessoria técnica) e Copom (Selic) têm nomes parecidos.","Orçamentos monetários: o BC prepara e o CMN aprova.","Ad referendum: o presidente decide e os demais confirmam depois."]},
{t:"Aula 3: Banco Central do Brasil (BACEN)",o:"A autarquia que executa a política monetária e supervisiona as instituições financeiras.",
r:["O BACEN é autarquia de natureza especial: sem vinculação a Ministério, sem tutela nem subordinação hierárquica, com autonomia técnica, operacional, administrativa e financeira.","Objetivo fundamental: assegurar a estabilidade dos preços. Também zela pela estabilidade e eficiência do sistema financeiro, suaviza flutuações da atividade econômica e fomenta o pleno emprego.","Quatro funções: banco do governo, banco dos bancos, executor da política monetária e supervisor do SFN.","O CMN define a meta de inflação e o BACEN conduz a política monetária. Seis meses consecutivos fora da tolerância é descumprimento: nota no Relatório de Política Monetária e carta aberta ao Ministro da Fazenda.","Diretoria Colegiada de 9 membros (presidente + 8 diretores). Diretores: indicados e nomeados pelo Presidente da República, aprovados pelo Senado, mandato de 4 anos com uma recondução.","Mandatos escalonados: 2 diretores por ano, e o presidente do BACEN começa no início do 3º ano do mandato presidencial. Exoneração por desempenho insuficiente: proposta do CMN e prévia aprovação do Senado (maioria absoluta).","Competências: emitir moeda, determinar e receber compulsórios, redesconto e empréstimos, controlar crédito e capitais estrangeiros, ser depositário das reservas, fiscalizar e punir, comprar e vender títulos públicos e regulamentar o câmbio. Autoriza as instituições a funcionar, operar câmbio, alterar estatutos etc."],
d:["Verbos de execução (emitir, realizar, exercer, efetuar) tendem a apontar para o BACEN; regular e regulamentar são mais do CMN, com exceções (câmbio). É um macete, não uma regra absoluta.","Zelar: estabilidade e eficiência do sistema financeiro é BACEN; liquidez e solvência das instituições é CMN.","Emissão da moeda (processo econômico) é do BACEN; a impressão (processo físico) é da Casa da Moeda.","Desde 2002 o BACEN não pode emitir títulos de dívida pública.","Vigilância do mercado de capitais: a lei cita o BACEN, mas hoje a função principal é da CVM. Atenção ao contexto da questão."],
n:[["9","membros da Diretoria (1 + 8)"],["4 + 4","anos de mandato dos diretores"],["6 meses","consecutivos para descumprir a meta"],["2","diretores iniciam mandato por ano"],["100% e 60%","teto dos compulsórios (à vista e outros títulos)"],["2002","fim da emissão de títulos pelo BACEN"]],
p:["Zelar: BACEN (estabilidade e eficiência) x CMN (liquidez e solvência).","Emissão é do BACEN; impressão é da Casa da Moeda.","Vigilância do mercado de capitais: hoje, função da CVM.","Exoneração por desempenho: o CMN propõe e o Senado aprova.","O Presidente do BACEN começa no início do 3º ano do mandato presidencial."]},
{t:"Aula 4: Comissão de Valores Mobiliários (CVM)",o:"A autarquia que regula e fiscaliza o mercado de capitais e os valores mobiliários.",
r:["A CVM é uma autarquia em regime especial, vinculada ao Ministério da Fazenda, responsável pela regulação e fiscalização do mercado de capitais. É vinculada, mas não subordinada, e tem sede no Rio de Janeiro.","Tem personalidade jurídica e patrimônio próprios, autoridade administrativa e autonomia financeira e orçamentária.","Diretoria Colegiada de 5 membros (presidente + 4 diretores), nomeados pelo Presidente da República e aprovados pelo Senado, com mandato fixo de 5 anos, vedada a recondução. Requisitos: reputação ilibada e notória especialização em assuntos econômico-financeiros.","Exoneração: renúncia, condenação judicial transitada em julgado ou processo administrativo disciplinar.","Valores mobiliários: ações, debêntures, bônus de subscrição, cotas de fundos, notas comerciais, derivativos e contratos de investimento coletivo ofertados publicamente. Não são: títulos da dívida pública e títulos cambiais de instituição financeira (exceto debêntures).","Atribuições em cinco blocos: desenvolvimento do mercado, eficiência e funcionamento, proteção dos investidores, acesso à informação e fiscalização e punição.","Poderes: normativo (regula os agentes do mercado) e punitivo (com ampla defesa). Penalidades: advertência, multa, inabilitação, suspensão e proibição temporária. Também adota a autorregulação para aumentar a eficiência."],
d:["Regra de ouro: se a atribuição envolve valores mobiliários (ações, debêntures, fundos), pense em CVM.","Vinculação: a CVM é vinculada ao Ministério da Fazenda, mas não subordinada; o BACEN não tem vinculação a Ministério.","Mandatos: CVM, 5 anos sem recondução; BACEN, 4 anos com uma recondução.","Duas coisas não são valores mobiliários: títulos da dívida pública e títulos cambiais de instituição financeira (a exceção são as debêntures).","Na CVM, os poderes normativo e fiscalizador ficam no mesmo órgão; no sistema do BACEN, a normatização geral é do CMN.","A CVM segue as diretrizes do CMN e edita normas detalhadas (Resoluções CVM); uma norma da CVM não pode contrariar o CMN nem a lei."],
n:[["5","membros da Diretoria (1 + 4)"],["5 anos","mandato, sem recondução"],["20 anos","teto da inabilitação e da proibição de atividades ou operações"],["10 anos","teto da proibição para atuar no mercado"],["Rio de Janeiro","sede da CVM"]],
p:["Mandato da CVM é de 5 anos sem recondução; o do BACEN é de 4 anos com recondução.","A CVM é vinculada ao Ministério da Fazenda, mas não é subordinada.","Título da dívida pública não é valor mobiliário.","Debêntures de instituições financeiras são a exceção: são valores mobiliários.","A CVM pode punir, mas deve assegurar ampla defesa.","Arrependimento eficaz ou confissão espontânea podem atenuar as penalidades."]},
{"t":"Aula 5: Seguros e Previdência (CNSP, Susep, CNPC e Previc)","o":"Quem normatiza e quem supervisiona os seguros privados e a previdência complementar fechada.","r":["O SFN tem um segmento de seguros privados (CNSP normativo e Susep supervisora) e um de previdência complementar fechada (CNPC normativo e Previc supervisora).","CNSP: órgão do Ministério da Fazenda que fixa as diretrizes e normas da política de seguros privados, resseguros, previdência complementar aberta e capitalização. Representantes: Fazenda (presidente), Justiça, Previdência e Assistência Social, Susep, BACEN e CVM. Reúne-se ao menos a cada 3 meses; decide por maioria simples; reunião extraordinária por convocação do presidente ou proposta de pelo menos 2/3 dos membros.","Competências do CNSP: regular constituição, organização, funcionamento e fiscalização; estipular condições técnicas sobre tarifas e investimentos; fixar características gerais dos contratos e normas de contabilidade; delimitar o capital das seguradoras e resseguradores; estabelecer diretrizes de resseguro; disciplinar cosseguro, corretagem e Bolsas de Seguro.","Susep: autarquia especial vinculada à Fazenda, com sede e foro no Rio de Janeiro, que controla e fiscaliza os mercados de seguro, previdência complementar aberta, capitalização e resseguro, seguindo as diretrizes do CNSP.","Susep: Conselho Diretor de 5 membros (superintendente + 4 diretores), indicados pelo Ministro da Fazenda e nomeados pelo Presidente da República. Reúne-se quinzenalmente; extraordinária por convocação do superintendente ou de, no mínimo, 2 diretores; decisão por maioria simples.","Finalidades da Susep: proteger a poupança popular, promover desenvolvimento, concorrência e estabilidade, zelar pelos direitos dos segurados e pela liquidez e solvência das entidades, disciplinar e acompanhar investimentos e prover a secretaria do CNSP.","CNPC: órgão colegiado do Ministério da Previdência Social que regula o regime de previdência complementar das entidades fechadas. Presidido pelo Ministro da Previdência Social; 9 membros, com mandato de 2 anos e uma única recondução; reúne-se por maioria simples, com presença mínima de 5 membros.","Previc: autarquia especial vinculada ao Ministério da Previdência Social, com sede e foro no Distrito Federal, que fiscaliza e supervisiona as entidades fechadas e executa as políticas do regime. Diretoria de 5 membros (superintendente + 4 diretores), indicados pelo Ministro da Previdência e nomeados pelo Presidente.","Competências da Previc: fiscalizar, apurar e julgar infrações, aplicar penalidades, expedir instruções, autorizar constituição, funcionamento, fusão, cisão e incorporação, decretar intervenção e liquidação extrajudicial, nomear administrador especial e promover mediação e conciliação.","Previdência aberta: qualquer pessoa pode contratar, oferecida por bancos e seguradoras (CNSP e Susep). Previdência fechada: grupos específicos, como funcionários de uma empresa, em fundos de pensão (CNPC e Previc)."],"d":["Verbos: CNSP fixa, estabelece e regula (normativo); Susep executa, fiscaliza, supervisiona e zela.","Vinculação: CNSP e Susep ficam no Ministério da Fazenda; CNPC e Previc, no Ministério da Previdência Social.","Entidades fechadas ou fundos de pensão: pense em CNPC (normativo) e Previc (supervisor). Entidades abertas: CNSP e Susep.","Seguros privados inclui resseguro, previdência complementar aberta e capitalização.","Autorização para constituição ou funcionamento de entidade fechada: sempre a Previc.","A Previc pode decretar intervenção e liquidação extrajudicial das entidades fechadas que não sigam as normas.","Quando a Susep “zela”, trata-se de liquidez, solvência e defesa dos direitos dos segurados.","Os três conselhos normativos: CMN, CNSP e CNPC (C de Conselho, todos “Nacional”)."],"n":[["5","membros do Conselho Diretor da Susep"],["5","membros da Diretoria da Previc"],["9","membros do CNPC"],["2 anos","mandato no CNPC, com uma única recondução"],["3 meses","intervalo máximo das reuniões ordinárias do CNSP"],["2/3","dos membros para propor reunião extraordinária do CNSP"],["Quinzenal","reuniões ordinárias da Susep"],["5","presentes, no mínimo, para o CNPC se reunir"]],"p":["CNSP e Susep: Ministério da Fazenda. CNPC e Previc: Ministério da Previdência Social.","Previdência aberta é do mercado de seguros (CNSP e Susep); a fechada (fundos de pensão), de CNPC e Previc.","Sede: Susep no Rio de Janeiro; Previc no Distrito Federal.","Reuniões ordinárias: CNSP a cada 3 meses; Susep quinzenalmente.","Quórum: CNPC exige 5 membros presentes; a Previc, a maioria dos membros.","Mandato no CNPC: 2 anos, com uma única recondução."]},
{"t":"Aula 6: Operadores do SFN (bancos, cooperativas e operações)","o":"Como as instituições operam (ativas, passivas e acessórias) e quem são os bancos comerciais, múltiplos, cooperativos, as caixas econômicas e as cooperativas de crédito.","r":["Operações ativas: a instituição empresta recursos aos agentes deficitários e tem um direito a receber (ativo). Passivas: capta recursos dos superavitários e assume uma obrigação (passivo). Acessórias: presta serviços e é remunerada por tarifas.","Exemplos de ativas: abertura de crédito, desconto de títulos, crédito rural, capital de giro, aplicações próprias, depósitos interfinanceiros e repasses. Exemplos de passivas: depósito à vista, depósito a prazo, poupança, obrigações de repasses e emissão de CDI. Exemplos de acessórias: pagamentos, câmbio, custódia e fianças.","Empréstimo: o dinheiro não tem destinação obrigatória. Financiamento: o dinheiro está vinculado à compra de um bem ou serviço, como um veículo ou equipamento.","Instituições monetárias (bancárias) recebem depósitos à vista e criam moeda escritural: bancos comerciais, múltiplos com carteira comercial, cooperativas de crédito, bancos cooperativos e Caixa Econômica Federal. As não monetárias (não bancárias) não recebem depósitos à vista.","Banco comercial: instituição monetária, sociedade anônima, com “Banco” na denominação, que financia a curto e médio prazo comércio, indústria, serviços e pessoas físicas e capta por depósito à vista e a prazo.","Banco múltiplo: no mínimo duas carteiras, sendo uma comercial ou de investimento. Carteiras: comercial, investimento, desenvolvimento (exclusiva de bancos públicos), crédito imobiliário, arrendamento mercantil e crédito, financiamento e investimento. Cada carteira tem CNPJ, mas se publica um só balanço.","Caixas econômicas: empresas públicas com atividades típicas de banco comercial e prioridade social. Captam depósito à vista e poupança. A única em atividade é a Caixa Econômica Federal, vinculada ao Ministério da Fa fc:[["O que é o BACEN?","Autarquia de natureza especial.",0],["Qual o objetivo fundamental do BACEN?","Assegurar a estabilidade dos preços.",0],["Onde fica a sede do BACEN?","Em Brasília, com nove regionais.",0],["Quantos membros tem a Diretoria?","9: 1 presidente + 8 diretores.",0],["Mandato dos diretores?","4 anos, reconduzível uma vez.",0],["Quem aprova os diretores?","O Senado Federal.",0],["Quem nomeia os diretores?","O Presidente da República.",0],["Quais as quatro funções do BACEN?","Banco do governo, banco dos bancos, executor da política monetária e supervisor do SFN.",0],["Quando começa o mandato do Presidente do BACEN?","No início do 3º ano do mandato do Presidente da República.",1],["Quantos diretores iniciam mandato por ano?","2.",1],["Quando há descumprimento da meta de inflação?","Inflação fora da tolerância por 6 meses consecutivos.",1],["O que o BACEN divulga no descumprimento?","Nota no Relatório de Política Monetária e carta aberta ao Ministro da Fazenda.",1],["O que deve conter a carta aberta?","Causas, medidas necessárias e prazo esperado.",1],["Limites dos compulsórios?","Até 100% dos depósitos à vista e 60% de outros títulos.",1],["Emissão x impressão de moeda?","Emissão: BACEN. Impressão: Casa da Moeda.",1],["O que mudou em 2002?","O BACEN deixou de poder emitir títulos de dívida pública.",1],["Zelar: BACEN ou CMN?","Estabilidade e eficiência: BACEN. Liquidez e solvência: CMN.",1],["O que é o banco do governo?","Depositário das reservas e operador de compra e venda de títulos públicos federais.",1],["O que é o banco dos bancos?","Recebe compulsórios e depósitos e faz redesconto e empréstimos às instituições.",1],["O que faz como supervisor do SFN?","Autoriza, normatiza, fiscaliza e intervém nas instituições.",1],["Requisitos para ser diretor?","Brasileiros idôneos, reputação ilibada e notória capacidade.",1],["Dimensões da autonomia do BACEN?","Técnica, operacional, administrativa e financeira.",1],["A que Ministério o BACEN está vinculado?","A nenhum: não há vinculação, tutela nem subordinação hierárquica.",1],["Hipóteses de exoneração dos diretores?","A pedido, enfermidade, condenação com proibição de acesso a cargos públicos ou desempenho insuficiente.",2],["Como se exonera por desempenho insuficiente?","O CMN propõe, com prévia aprovação do Senado por maioria absoluta.",2],["Quando há nova comunicação após a primeira carta?","Se a inflação não voltar no prazo ou se for preciso atualizar as providências ou o prazo.",2],["O que o BACEN autoriza às instituições?","Funcionar, instalar ou transferir sedes, transformar-se, operar câmbio, alterar estatutos e transferir controle.",2],["Como o BACEN trata instituição estrangeira?","Análise técnica e reconhecimento de interesse do Governo para novas agências.",2],["Que lei regulamenta o câmbio hoje?","A Lei 14.286/2021, regulamentada pelo BACEN.",2],["Quais as matérias normativas do BACEN?","Portarias, Resoluções BCB, Instruções Normativas BCB e conjuntas.",2],["Qual o macete dos verbos?","Emitir, realizar, exercer e efetuar apontam para o BACEN; regular e regulamentar são mais do CMN (exceção: câmbio).",3],["Quando começam os dois primeiros diretores em um mandato presidencial?","Em 1º de março do primeiro ano; os demais, em 1º de janeiro.",3],["Quantos membros da Diretoria terão iniciado mandato ao fim do 2º ano?","4 (2 por ano; o presidente só no 3º ano).",3],["Associe: emissão, impressão, compulsórios e autorização de fusão.","BACEN, Casa da Moeda, BACEN e BACEN.",3],["Qual a ressalva sobre a vigilância do mercado de capitais?","A lei cita o BACEN, mas hoje a função é primordialmente da CVM.",3],["Quais os objetivos do BACEN além da estabilidade dos preços?","Estabilidade e eficiência do sistema financeiro, suavizar flutuações da atividade e fomentar o pleno emprego.",3],["Como diferem BACEN e CMN quanto aos membros?","BACEN: 9 diretores. CMN: 3 membros.",3],["Descreva o fluxo de nomeação de um diretor.","Presidente indica, Senado aprova, Presidente nomei fc:[["O que é a CVM?","Autarquia em regime especial que regula e fiscaliza o mercado de capitais.",0],["A CVM é subordinada à Fazenda?","Não. É vinculada, mas não subordinada.",0],["Qual a sede da CVM?","Rio de Janeiro.",0],["Quantos membros tem a Diretoria da CVM?","5: 1 presidente + 4 diretores.",0],["Mandato dos diretores da CVM?","5 anos, sem recondução.",0],["Quem nomeia os diretores da CVM?","O Presidente da República.",0],["Quem aprova os diretores da CVM?","O Senado Federal.",0],["Quais os dois poderes da CVM?","Normativo e punitivo.",0],["Hipóteses de exoneração na CVM?","Renúncia, condenação transitada em julgado ou processo administrativo disciplinar.",1],["Requisitos dos diretores da CVM?","Reputação ilibada, notória especialização em assuntos econômico-financeiros e aprovação do Senado.",1],["Exemplos de valores mobiliários?","Ações, debêntures, bônus de subscrição, cotas de fundos, notas comerciais e derivativos.",1],["O que NÃO é valor mobiliário?","Títulos da dívida pública e títulos cambiais de instituição financeira, exceto debêntures.",1],["Qual a regra de ouro das atribuições?","Envolve valores mobiliários? Pense em CVM.",1],["Quais os cinco blocos de atribuições?","Desenvolvimento do mercado; eficiência e funcionamento; proteção dos investidores; acesso à informação; fiscalização e punição.",1],["Teto da inabilitação temporária?","Até 20 anos.",1],["Teto da proibição para atuar no mercado?","Até 10 anos.",1],["Quais as penalidades da CVM?","Advertência, multa, inabilitação, suspensão e proibição temporária.",1],["O que atenua as penalidades?","Arrependimento eficaz ou posterior e confissão espontânea.",1],["Para quem a CVM denuncia indícios de ilícito?","Ministério Público (penal) e Receita Federal (fiscal).",1],["Fundamentos da regulação da CVM?","Interesse público, confiabilidade, eficiência do mercado, competitividade e mercado livre.",1],["O que é a autorregulação na CVM?","Sistema para aumentar a eficiência, evitando a centralização excessiva de normatizar e fiscalizar.",1],["Quais as matérias normativas da CVM?","Portarias, Resoluções CVM, Instruções Normativas CVM e conjuntas.",1],["Qual a área e o nível da CVM?","Área: capitais. Nível: supervisor.",1],["Quais os poderes de investigação da CVM?","Examinar livros e registros, intimar (com multa), requisitar informações a outros órgãos e apurar práticas não equitativas por inquérito.",2],["O que é a proteção dos investidores?","Proteger titulares contra emissões irregulares, atos ilegais de administradores e controladores e uso de informação relevante não divulgada.",2],["Que bloco inclui bolsa e balcão?","Eficiência e funcionamento do mercado.",2],["Pressupostos da autorregulação?","Menor custo do regulador, proximidade e conhecimento da entidade autorreguladora e maior aceitação das regras.",2],["Alcance da proibição de até 20 anos?","Atividades ou operações de integrantes do sistema de distribuição e entidades com registro na CVM.",2],["O que a inabilitação de até 20 anos alcança?","Cargo de administrador ou conselheiro fiscal de companhia aberta e demais atividades.",2],["Quais contratos de investimento coletivo são valores mobiliários?","Os ofertados publicamente, com direito de participação, parceria ou remuneração do esforço de empreendedor ou de terceiros.",2],["Compare a vinculação da CVM e do BACEN.","CVM: vinculada ao Ministério da Fazenda, sem subordinação. BACEN: sem vinculação a Ministério.",3],["Compare diretoria e mandato da CVM e do BACEN.","CVM: 5 membros, 5 anos sem recondução. BACEN: 9 membros, 4 anos com recondução.",3],["Título cambial de instituição financeira é valor mobiliário?","Não, exceto as debêntures.",3],["Inabilitação por 18 anos e proibição de atuar no mercado por 12: o que se afirma?","A primeira está no limite (20 anos); a segunda excede o limite (10 anos).",3],["Como se exerce o poder punitivo?","Assegurada a ampla defesa.",3],["Como difere a normatização na CVM e no sistema do BACEN?","A CVM tem poder normativo pró
