[1,"Spread",3,"Assinale a alternativa INCORRETA sobre o spread bancário.","O CMN fixa o spread de forma igual para os bancos.","O aumento do risco de crédito tende a elevar o spread.","Spread é a diferença entre as taxas de empréstimo e captação.","O spread remunera os custos e o risco da intermediação.","O spread remunera custos e risco da instituição; não é fixo nem igual para todas.",0,"",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. O spread remunera custos e risco da instituição; não é fixo nem igual para todas.","Maior risco de calote eleva a perda esperada que o spread precisa remunerar. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","A definição de spread é justamente a diferença entre a taxa cobrada e a paga. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","A intermediação envolve custos e risco, que são remunerados pelo spread. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[1,"Spread",3,"A captação de um banco sobe de 10% para 13% a.a. Ele quer manter uma margem líquida de 6 p.p., depois de cobrir custos de 1,5 p.p. e perdas de 0,5 p.p. Qual taxa de empréstimo deve cobrar?","21%","19%","19,5%","22,5%","13% + 6 + 1,5 + 0,5 = 21%.",0,"",["13% + 6 + 1,5 + 0,5 = 21%.","19% cobre captação e margem desejada, mas omite os 2 p.p. de custos e perdas.","19,5% ainda não cobre integralmente os custos de 1,5 p.p. e perdas de 0,5 p.p.","22,5% excede a taxa necessária: 13 + 6 + 1,5 + 0,5 = 21%."]],
[1,"Estrutura do SFN",3,"Associe cada segmento ao seu órgão normativo e ao seu supervisor: (a) seguros privados; (b) previdência fechada; (c) moeda, crédito, capitais e câmbio.","(a) CNSP e Susep; (b) CNPC e Previc; (c) CMN, com BCB e CVM.","(a) CNPC e Previc; (b) CNSP e Susep; (c) CMN, com BCB e CVM.","(a) CNSP e Susep; (b) CMN e BCB; (c) CNPC, com Previc e CVM.","(a) CMN e BCB; (b) CNPC e Previc; (c) CNSP, com Susep e CVM.","Seguros: CNSP e Susep. Previdência fechada: CNPC e Previc. Mercado financeiro: CMN, BCB e CVM.",0,"",["Seguros: CNSP e Susep. Previdência fechada: CNPC e Previc. Mercado financeiro: CMN, BCB e CVM.","Troca seguros com previdência fechada: seguros têm CNSP/Susep; fechada tem CNPC/Previc.","A fechada não é CMN/BCB e o financeiro não é CNPC/Previc; apenas seguros está certo.","O financeiro não é CNSP/Susep e seguros não é CMN/BCB; só a fechada está certa."]],
[1,"Estrutura do SFN",3,"Considere: I. Corretoras de valores são entidades operacionais. II. A CVM é supervisora do mercado de valores mobiliários. III. O CMN é a entidade que fiscaliza os bancos no dia a dia. IV. O mercado monetário opera no curtíssimo e curto prazo. Estão corretas:","Apenas I, II e IV.","Apenas I, II e III.","Apenas II, III e IV.","I, II, III e IV.","A III está errada: o CMN normatiza; a fiscalização é das supervisoras.",0,"",["A III está errada: o CMN normatiza; a fiscalização é das supervisoras.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir IV, que faz parte do conjunto correto. A III está errada: o CMN normatiza; a fiscalização é das supervisoras.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir I, que faz parte do conjunto correto. A III está errada: o CMN normatiza; a fiscalização é das supervisoras.","Inclui III, que não deve fazer parte do conjunto correto. A III está errada: o CMN normatiza; a fiscalização é das supervisoras."]],
[2,"Reuniões e normas",0,"Além das reuniões ordinárias, o CMN pode se reunir em caráter extraordinário mediante convocação de quem?","Presidente do CMN","Presidente da CVM","Presidente do Senado","Coordenador da Comoc","As reuniões extraordinárias são convocadas pelo presidente do CMN.",0,"É a mesma autoridade que dirige o conselho.",["As reuniões extraordinárias são convocadas pelo presidente do CMN.","A CVM não convoca as extraordinárias do CMN; cabe ao presidente do conselho.","O Senado não é responsável por essa convocação do conselho.","A Comoc assessora; quem convoca a extraordinária é o presidente do CMN."]],
[2,"CMN: papel e composição",0,"O CMN pode limitar taxas de juros, descontos e comissões?","Sim, por competência normativa, quando for necessário.","Não, pois limitar esses valores é competência da CVM.","Não, pois sua competência está restrita à política cambial.","Sim, desde que obtenha decisão prévia do Senado Federal.","Limitar juros, descontos e comissões está entre as competências do CMN.",0,"Limitar remunerações é uma regra geral. Pense em quem escreve regras sobre juros e comissões.",["Limitar juros, descontos e comissões está entre as competências do CMN.","A competência normativa para limitar essas taxas é do CMN, não exclusiva da CVM.","As competências do CMN abrangem moeda e crédito, além de câmbio.","Essa competência normativa não fica condicionada a decisão do Senado na regra apresentada."]],

[2,"CMN: papel e composição",3,"Considere: I. Orientar a aplicação dos recursos das instituições é objetivo do CMN. II. Executar diariamente a política cambial no mercado é objetivo do CMN. III. Zelar pela liquidez e solvência das instituições é objetivo do CMN. IV. Coordenar as políticas monetária, creditícia, orçamentária, fiscal e da dívida pública é objetivo do CMN. Estão corretas:","Apenas I, III e IV.","Apenas I, II e III.","Apenas II, III e IV.","I, II, III e IV.","A II está errada: o CMN fixa as diretrizes do câmbio; quem executa é o Banco Central.",0,"",["A II está errada: o CMN fixa as diretrizes do câmbio; quem executa é o Banco Central.","Inclui II, que não deve fazer parte do conjunto correto. Deixa de incluir IV, que faz parte do conjunto correto. A II está errada: o CMN fixa as diretrizes do câmbio; quem executa é o Banco Central.","Inclui II, que não deve fazer parte do conjunto correto. Deixa de incluir I, que faz parte do conjunto correto. A II está errada: o CMN fixa as diretrizes do câmbio; quem executa é o Banco Central.","Inclui II, que não deve fazer parte do conjunto correto. A II está errada: o CMN fixa as diretrizes do câmbio; quem executa é o Banco Central."]],

[3,"Diretoria e mandato",2,"Em um mandato presidencial de quatro anos, quando iniciam os mandatos dos dois primeiros diretores e do Presidente do BACEN?","Dois diretores: março do primeiro ano; presidente: início do terceiro.","Dois diretores: janeiro do primeiro ano; presidente: início do primeiro.","Dois diretores: início do segundo ano; presidente: início do quarto.","Oito diretores: início do primeiro ano; presidente: início do segundo.","Primeiro ano: 1º de março; o Presidente começa no 3º ano.",0,"No primeiro ano, a data de início dos dois primeiros diretores não é 1º de janeiro.",["Primeiro ano: 1º de março; o Presidente começa no 3º ano.","Os dois primeiros diretores começam em março; o Presidente do BACEN não começa no primeiro ano.","Os primeiros diretores começam no primeiro ano e o Presidente no terceiro.","Os oito diretores têm início escalonado; o Presidente começa no terceiro ano."]],
[3,"Diretoria e mandato",3,"Considere: I. Os diretores do BACEN são nomeados pelo Presidente da República, após aprovação do Senado. II. O Presidente do BACEN inicia o mandato no início do primeiro ano do mandato presidencial. III. A exoneração por desempenho insuficiente exige proposta do CMN e prévia aprovação do Senado. IV. Cada diretor tem mandato de 4 anos, reconduzível uma vez. Estão corretas:","Apenas I, III e IV.","Apenas I, II e III.","Apenas II, III e IV.","I, II, III e IV.","A II está errada: o Presidente do BACEN começa no início do 3º ano.",0,"",["A II está errada: o Presidente do BACEN começa no início do 3º ano.","Inclui II, que não deve fazer parte do conjunto correto. Deixa de incluir IV, que faz parte do conjunto correto. A II está errada: o Presidente do BACEN começa no início do 3º ano.","Inclui II, que não deve fazer parte do conjunto correto. Deixa de incluir I, que faz parte do conjunto correto. A II está errada: o Presidente do BACEN começa no início do 3º ano.","Inclui II, que não deve fazer parte do conjunto correto. A II está errada: o Presidente do BACEN começa no início do 3º ano."]],

[3,"Diretoria e mandato",3,"Quantos membros da Diretoria Colegiada do BACEN terão iniciado mandato ao fim do segundo ano de um mandato presidencial (primeiro e segundo anos)?","4","2","5","6","São 2 diretores por ano; o Presidente do BACEN só começa no 3º ano.",0,"",["São 2 diretores por ano; o Presidente do BACEN só começa no 3º ano.","O valor indicado nesta opção (2) não corresponde ao resultado ou requisito pedido (4). São 2 diretores por ano; o Presidente do BACEN só começa no 3º ano.","O valor indicado nesta opção (5) não corresponde ao resultado ou requisito pedido (4). São 2 diretores por ano; o Presidente do BACEN só começa no 3º ano.","O valor indicado nesta opção (6) não corresponde ao resultado ou requisito pedido (4). São 2 diretores por ano; o Presidente do BACEN só começa no 3º ano."]],

[4,"Poderes e penalidades",1,"O que a legislação prevê que pode atenuar as medidas punitivas aplicadas pela CVM?","Arrependimento eficaz ou posterior e confissão espontânea.","Apresentação de defesa, sem arrependimento ou confissão.","Contestação integral da infração, sem medidas de reparação.","Aprovação interna da conduta pelo próprio infrator investigado.","Arrependimento eficaz ou confissão espontânea podem atenuar as penalidades.",0,"Procure atitudes voluntárias do infrator, e não fatos externos.",["Arrependimento eficaz ou confissão espontânea podem atenuar as penalidades.","Apresentar defesa é um direito do acusado. Por si só, não equivale às circunstâncias de arrependimento ou confissão que a legislação admite considerar na atenuação.","Contestar integralmente os fatos não é confissão espontânea, e a opção não traz arrependimento ou medida eficaz. Não é a circunstância atenuante pedida.","Aprovação interna pelo infrator não afasta a infração nem substitui arrependimento ou confissão. A aplicação da sanção segue o processo da CVM."]],
[4,"Poderes e penalidades",1,"Quando a CVM identifica indícios de ilícito penal em um processo, qual é a sua responsabilidade?","Denunciar ao Ministério Público.","Arquivar o processo sem comunicação.","Transferir o caso ao Banco Central.","Pedir autorização ao CMN para investigar.","Denuncia ao Ministério Público (ilícito penal) e à Receita Federal (ilícito fiscal).",0,"Pense no que a CVM faz ao encontrar indícios de crime: ela não investiga nem pune crimes por conta própria.",["Denuncia ao Ministério Público (ilícito penal) e à Receita Federal (ilícito fiscal).","Indício de ilícito penal exige denúncia ao Ministério Público, não arquivamento sem comunicação.","O destinatário dos indícios penais é o Ministério Público, não o BACEN.","A CVM pode investigar na sua área; não precisa pedir ao CMN autorização para comunicar o indício."]],
[4,"Regulação e autorregulação",1,"Qual é o objetivo da autorregulação adotada pela CVM?","Dar eficiência à regulação, evitando centralização excessiva na CVM.","Tornar a regulação dispensável, encerrando a fiscalização do mercado.","Transferir ao Senado a aplicação de sanções administrativas do mercado.","Transferir às entidades privadas as competências integrais da CVM.","A autorregulação aumenta a eficiência e evita a centralização excessiva.",0,"Pense no problema que surge quando um único regulador faz tudo, e na solução que a CVM adota.",["A autorregulação aumenta a eficiência e evita a centralização excessiva.","A autorregulação complementa a regulação; não elimina a fiscalização.","O poder punitivo não é transferido ao Senado por essa prática.","A autorregulação não extingue nem substitui a CVM por agentes privados."]],
[4,"Regulação e autorregulação",1,"Qual dos itens é fundamento da regulação da CVM?","Interesse público no funcionamento do mercado","Lucro do Tesouro com as operações do mercado","Sigilo absoluto sobre as operações do mercado","Controle da Selic nas operações do mercado","Fundamentos: interesse público, confiabilidade, eficiência, competitividade e mercado livre.",0,"Pense no que um regulador deve proteger em primeiro lugar.",["Fundamentos: interesse público, confiabilidade, eficiência, competitividade e mercado livre.","A regulação visa interesse público e confiança do mercado, não lucro do Tesouro.","Transparência e acesso à informação são objetivos; sigilo absoluto é incompatível com eles.","Selic é definida pelo Copom e não é um fundamento da regulação da CVM."]],
[4,"CVM x BACEN",1,"Qual das opções diferencia corretamente a CVM do Banco Central quanto ao mandato dos diretores?","CVM: 5 anos sem recondução; BACEN: 4 anos com recondução.","CVM: 4 anos com recondução; BACEN: 5 anos sem recondução.","CVM: 4 anos com recondução; BACEN: 4 anos com recondução.","CVM: 5 anos sem recondução; BACEN: 5 anos sem recondução.","CVM: 5 anos sem recondução. BACEN: 4 anos com uma recondução.",0,"Compare os dois mandatos: um é maior e sem renovação; o outro é menor e renovável.",["CVM: 5 anos sem recondução. BACEN: 4 anos com uma recondução.","Inverte os regimes: CVM tem cinco anos sem recondução; BACEN quatro com uma.","Esse regime é do BACEN, não da CVM.","Esse regime é da CVM, não do BACEN."]],
[4,"Valores mobiliários",2,"Considere: I. Debêntures são valores mobiliários. II. Títulos da dívida pública municipal são valores mobiliários. III. Cotas de fundos de investimento em valores mobiliários são valores mobiliários. Está(ão) correta(s):","Apenas I e III.","Apenas I e II.","Apenas II e III.","I, II e III.","A II está errada: títulos da dívida pública não são valores mobiliários.",0,"Confira cada instrumento isoladamente. Os títulos emitidos pelo governo ficam de fora.",["A II está errada: títulos da dívida pública não são valores mobiliários.","Inclui II, que não deve fazer parte do conjunto correto. Deixa de incluir III, que faz parte do conjunto correto. A II está errada: títulos da dívida pública não são valores mobiliários.","Inclui II, que não deve fazer parte do conjunto correto. Deixa de incluir I, que faz parte do conjunto correto. A II está errada: títulos da dívida pública não são valores mobiliários.","Inclui II, que não deve fazer parte do conjunto correto. A II está errada: títulos da dívida pública não são valores mobiliários."]],
[4,"Natureza e vinculação",2,"Um enunciado afirma que a CVM é subordinada ao Ministério da Fazenda e que o BACEN não tem nenhuma relação com ministérios. Qual a correção adequada?","CVM vinculada à Fazenda, sem subordinação; BACEN sem vinculação ministerial.","CVM sem vinculação ministerial; BACEN subordinado hierarquicamente à Fazenda.","CVM e BACEN subordinados hierarquicamente ao Ministério da Fazenda.","CVM e BACEN sem qualquer vinculação institucional a ministério.","CVM: vinculada, sem subordinação. BACEN: ausência de vinculação.",0,"Vinculação e subordinação são coisas diferentes. Corrija as duas afirmações do enunciado.",["CVM: vinculada, sem subordinação. BACEN: ausência de vinculação.","Inverte as características: a CVM é vinculada à Fazenda; o BACEN não é subordinado a ela.","Vinculação da CVM não é subordinação; o BACEN também não tem essa subordinação.","A CVM tem vinculação ao Ministério da Fazenda, embora preserve autonomia."]],
[4,"Poderes e penalidades",2,"Qual alternativa descreve corretamente a proibição temporária prevista entre as penalidades da CVM?","20 anos para atividades na distribuição; 10 anos para atuar no mercado.","10 anos para atividades na distribuição; 10 anos para atuar no mercado.","20 anos para atividades na distribuição; 20 anos para atuar no mercado.","5 anos para atividades na distribuição; 5 anos para atuar no mercado.","Duas modalidades: até 20 anos (atividades ou operações) e até 10 anos (atuar no mercado).",0,"São duas proibições com tetos diferentes, e cada uma tem seu alcance.",["Duas modalidades: até 20 anos (atividades ou operações) e até 10 anos (atuar no mercado).","O teto de atividades e operações é 20 anos, não 10.","A proibição de atuar no mercado tem teto de 10 anos, não 20.","Os tetos citados são 20 e 10 anos; não existe esse limite geral de cinco na aula."]],
[4,"Poderes e penalidades",2,"Qual condição a aula destaca para o exercício do poder punitivo da CVM?","Que seja assegurado o direito de ampla defesa.","Que haja prévia autorização do Banco Central.","Que o Senado aprove cada penalidade.","Que a decisão seja tomada apenas pelo presidente da CVM.","O poder punitivo é exercido com ampla defesa.",0,"Penalizar exige respeitar um direito do acusado.",["O poder punitivo é exercido com ampla defesa.","O requisito destacado é assegurar ampla defesa; não se exige autorização prévia do BACEN para cada sanção da CVM.","O Senado não aprova cada penalidade aplicada pela CVM.","Decisão apenas do presidente não substitui a garantia de ampla defesa ao acusado."]],
[4,"Atribuições",2,"Qual alternativa associa corretamente o bloco de atribuições à ação da CVM?","Acesso à informação: dar ao público dados de emissores e valores mobiliários.","Proteção dos investidores: estimular a formação de poupança para investimento.","Desenvolvimento do mercado: aplicar penalidades por descumprimento de normas.","Fiscalização e punição: assegurar o acesso público a dados sobre os emissores.","Cada bloco corresponde a ações do mercado de valores mobiliários.",0,"Veja se a ação descrita pertence ao universo dos papéis negociados no mercado ou à política monetária.",["Acesso à informação adequada é garantir ao público informações sobre valores mobiliários e seus emissores. Estimular poupança é desenvolvimento; aplicar penalidades é fiscalização e punição.","Estimular a formação de poupança é desenvolvimento do mercado, não o bloco de proteção dos investidores contra fraude ou manipulação.","Aplicar penalidades por infrações pertence a fiscalização e punição, não a desenvolvimento do mercado.","Dar acesso público aos dados de emissores pertence a acesso à informação adequada, não ao bloco de fiscalização e punição."]],
[4,"Regulação e autorregulação",2,"Qual item NÃO é pressuposto da autorregulação?","Elevação do custo de fiscalização suportado pelo regulador.","Diminuição do custo suportado pelo regulador.","Proximidade da entidade autorreguladora com o mercado.","Maior aceitação das regras da entidade autorreguladora.","A autorregulação busca reduzir, e não aumentar, os custos do regulador.",0,"A autorregulação nasce da ideia de reduzir as despesas do regulador.",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. A autorregulação busca reduzir, e não aumentar, os custos do regulador.","Reduzir o custo do regulador é justamente um dos pressupostos favoráveis à autorregulação. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Conhecer de perto o mercado ajuda a entidade autorreguladora a estabelecer e aplicar regras. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Maior aceitação das regras é um dos benefícios esperados da autorregulação. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[4,"CVM x BACEN",2,"Na comparação entre CVM e BACEN quanto aos poderes sobre o respectivo mercado, qual afirmação reflete a aula?","CVM regula e fiscaliza capitais; CMN edita as diretrizes gerais para o BACEN.","BC define as diretrizes gerais do SFN; CVM atua sem competência normativa.","CMN fiscaliza diretamente capitais; CVM atua como operadora de valores mobiliários.","CVM regula capitais sem poder punitivo; BC supervisiona as instituições financeiras.","Na CVM, normativo e punitivo estão no próprio órgão; no BACEN, a normatização geral é do CMN.",0,"Compare onde ficam os poderes normativo e fiscalizador em cada sistema.",["Na CVM, normativo e punitivo estão no próprio órgão; no BACEN, a normatização geral é do CMN.","O CMN define as normas gerais do sistema; a CVM também tem poder normativo na sua área.","O CMN define diretrizes; a supervisão direta do mercado de capitais é da CVM.","A CVM possui poder fiscalizador e punitivo, respeitando a ampla defesa."]],
[4,"Diretoria e mandato",3,"Considere: I. Os diretores da CVM têm mandato de 5 anos, vedada a recondução. II. O Senado Federal nomeia os diretores da CVM. III. A CVM é vinculada ao Ministério da Fazenda, sem subordinação. IV. A sede da CVM é em Brasília. Estão corretas:","Apenas I e III.","Apenas I, II e III.","Apenas II e IV.","I, II, III e IV.","II e IV estão erradas: o Presidente da República nomeia, e a sede é no Rio de Janeiro.",0,"",["II e IV estão erradas: o Presidente da República nomeia, e a sede é no Rio de Janeiro.","Inclui II, que não deve fazer parte do conjunto correto. II e IV estão erradas: o Presidente da República nomeia, e a sede é no Rio de Janeiro.","Inclui IV, II, que não deve fazer parte do conjunto correto. Deixa de incluir I, III, que faz parte do conjunto correto. II e IV estão erradas: o Presidente da República nomeia, e a sede é no Rio de Janeiro.","Inclui IV, II, que não deve fazer parte do conjunto correto. II e IV estão erradas: o Presidente da República nomeia, e a sede é no Rio de Janeiro."]],
[4,"Valores mobiliários",3,"Assinale a alternativa INCORRETA sobre valores mobiliários.","Todo título cambial de instituição financeira é valor mobiliário.","Títulos da dívida pública federal, estadual ou municipal são excluídos.","Debêntures, inclusive no caso de instituições financeiras, são valores mobiliários.","Cotas de fundos de investimento em valores mobiliários integram o conceito.","Títulos cambiais de instituição financeira não são valores mobiliários, exceto as debêntures.",0,"",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. Títulos cambiais de instituição financeira não são valores mobiliários, exceto as debêntures.","A dívida pública federal, estadual e municipal está entre as exclusões desse conceito na aula. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Debêntures estão expressamente incluídas nos valores mobiliários. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Cotas de fundos em valores mobiliários também estão incluídas no conceito. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[4,"Poderes e penalidades",3,"Um administrador de companhia aberta é punido com inabilitação para o cargo por 18 anos e, em outro processo, com proibição de atuar no mercado de valores mobiliários por 12 anos. Considerando os limites da aula, o que se pode afirmar?","A primeira respeita 20 anos; a segunda excede 10 anos.","A primeira respeita 20 anos; a segunda respeita 20 anos.","A primeira excede 10 anos; a segunda excede 10 anos.","A primeira excede 10 anos; a segunda respeita 20 anos.","Inabilitação: até 20 anos. Proibição de atuar no mercado: até 10 anos.",0,"",["Inabilitação: até 20 anos. Proibição de atuar no mercado: até 10 anos.","Doze anos de proibição de atuar excedem o teto de dez; apenas a primeira está no limite.","Dezoito anos de inabilitação respeitam o teto de vinte; apenas a segunda excede.","Inverte a análise: dezoito respeita vinte e doze excede dez."]],
[4,"Poderes e penalidades",3,"Classifique: (a) regular a atuação dos agentes do mercado; (b) punir, com ampla defesa, quem descumpre normas; (c) assegurar o acesso do público a informações. Qual alternativa está correta?","(a) poder normativo; (b) poder punitivo; (c) atribuição de acesso à informação adequada.","(a) poder punitivo; (b) poder normativo; (c) atribuição de acesso à informação adequada.","(a) poder normativo; (b) atribuição de proteção; (c) poder punitivo.","(a) atribuição de fiscalização; (b) poder normativo; (c) poder punitivo.","Regular é poder normativo; punir é poder punitivo; informação é uma atribuição.",0,"",["Regular é poder normativo; punir é poder punitivo; informação é uma atribuição.","Inverte regular e punir: normas regulam; sanções exercem poder punitivo.","Punir é poder punitivo; divulgar informação não é punição.","Punir não é editar norma e assegurar informação não é aplicar sanção."]],
[4,"CVM x BACEN",3,"Uma diretoria de 9 membros com mandato de 4 anos, reconduzível uma vez, e outra de 5 membros com mandato de 5 anos, sem recondução, descrevem, respectivamente:","BACEN e CVM.","CVM e BACEN.","CMN e CVM.","BACEN e CMN.","BACEN: 9 membros, 4 + 4 anos. CVM: 5 membros, 5 anos sem recondução.",0,"",["BACEN: 9 membros, 4 + 4 anos. CVM: 5 membros, 5 anos sem recondução.","Inverte as diretorias e os mandatos: a primeira é BACEN; a segunda CVM.","CMN tem três membros e não corresponde à primeira diretoria de nove.","CMN não tem diretoria de cinco com mandato de cinco anos; essa é a CVM."]],
[4,"Regulação e autorregulação",3,"Considere: I. A autorregulação visa aumentar a eficiência da atividade regulatória. II. A diminuição de custos do regulador é um pressuposto. III. A autorregulação concentra na CVM todo o poder de editar normas. IV. A maior aceitação das regras é um pressuposto. Estão corretas:","Apenas I, II e IV.","Apenas I, II e III.","Apenas II, III e IV.","I, II, III e IV.","A III está errada: a autorregulação evita a centralização excessiva do poder.",0,"",["A III está errada: a autorregulação evita a centralização excessiva do poder.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir IV, que faz parte do conjunto correto. A III está errada: a autorregulação evita a centralização excessiva do poder.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir I, que faz parte do conjunto correto. A III está errada: a autorregulação evita a centralização excessiva do poder.","Inclui III, que não deve fazer parte do conjunto correto. A III está errada: a autorregulação evita a centralização excessiva do poder."]],
[4,"Valores mobiliários",3,"Uma companhia emite debêntures; uma instituição financeira emite um título cambial de sua responsabilidade; e o governo federal emite um título da dívida pública. Quais desses títulos são valores mobiliários?","As debêntures, excluídos o título cambial e o público.","As debêntures e o título cambial, excluído o público.","As debêntures e o título público, excluído o cambial.","As debêntures, o título cambial e o título público.","Dívida pública e títulos cambiais de instituição financeira não são valores mobiliários.",0,"",["Dívida pública e títulos cambiais de instituição financeira não são valores mobiliários.","O título cambial de instituição financeira está excluído, ressalvada a exceção de debêntures.","O título da dívida pública federal está excluído do conceito apresentado.","Inclui indevidamente título cambial e dívida pública; só a debênture está incluída nesse caso."]],
[4,"Poderes e penalidades",3,"Qual alternativa NÃO é um instrumento da CVM descrito na aula?","Fixar a meta da taxa básica de juros da economia.","Examinar livros e registros contábeis dos participantes do mercado.","Intimar participantes a prestar informações, com multa por descumprimento.","Requisitar a órgãos públicos informações sobre participantes do mercado.","A Selic é do Copom; os demais são poderes da CVM.",0,"",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. A Selic é do Copom; os demais são poderes da CVM.","Examinar livros e registros é instrumento de fiscalização da CVM. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Intimar pessoas para obter informações, com multa em caso de descumprimento, está entre seus instrumentos. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Requisitar informações de outros órgãos é instrumento previsto para a atuação da CVM. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[4,"CVM x BACEN",3,"Assinale a INCORRETA sobre a comparação entre CVM e BACEN.","CVM e BACEN: diretores com quatro anos e uma recondução.","CVM: vinculada à Fazenda; BACEN: sem vinculação ministerial.","CVM: colegiado de cinco membros; BACEN: colegiado de nove.","CVM: sede no Rio de Janeiro; BACEN: sede em Brasília.","CVM: 5 anos sem recondução. BACEN: 4 anos com uma recondução.",0,"",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. CVM: 5 anos sem recondução. BACEN: 4 anos com uma recondução.","A CVM tem vinculação ministerial sem subordinação; o BACEN não tem vinculação a ministério. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","As diretorias têm, respectivamente, um presidente mais quatro e um presidente mais oito diretores. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","As sedes citadas estão certas: CVM no Rio e BACEN em Brasília. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[4,"Atribuições",3,"Classifique: (i) estimular a formação de poupança; (ii) coibir fraude e manipulação; (iii) assegurar a observância das condições de utilização de crédito fixadas pelo CMN. Em quais blocos de atribuições se encaixam, respectivamente?","(i) desenvolvimento do mercado; (ii) proteção dos investidores; (iii) eficiência e funcionamento do mercado.","(i) proteção dos investidores; (ii) desenvolvimento do mercado; (iii) acesso à informação.","(i) eficiência e funcionamento; (ii) fiscalização e punição; (iii) proteção dos investidores.","(i) acesso à informação; (ii) eficiência e funcionamento; (iii) desenvolvimento do mercado.","Poupança: desenvolvimento; fraude: proteção; crédito do CMN: eficiência e funcionamento.",0,"",["Poupança: desenvolvimento; fraude: proteção; crédito do CMN: eficiência e funcionamento.","Formação de poupança é desenvolvimento, fraude é proteção e condições de crédito são eficiência.","Troca o primeiro e o último bloco; a classificação da questão é desenvolvimento, proteção e eficiência.","Informação ao público não é a formação de poupança; combater fraude é proteção, não eficiência."]],
[1,"Agentes",0,"No SFN, “poupador” se refere a:","Agente que dispõe de recursos excedentes para aplicar.","Produto bancário destinado ao depósito de recursos.","Agente que necessita captar recursos para suas despesas.","Intermediário que conecta aplicações e empréstimos.","Poupador é o agente com sobra de recursos, não o produto.",1,"Pense no papel econômico de quem tem dinheiro sobrando, e não em um produto de banco.",["Poupador é o agente com sobra de recursos, não o produto.","Caderneta é produto; poupador é o agente com recursos excedentes.","Deficitário precisa tomar recursos; poupador tem sobra para aplicar.","O intermediário conecta poupadores e tomadores. Poupador é o agente com recursos excedentes, mesmo que use aplicações diferentes da poupança."]],
[1,"Agentes",0,"Quem toma recursos emprestados no SFN é um agente:","Deficitário, pois precisa obter recursos por empréstimo.","Superavitário, por dispor de recursos excedentes.","Intermediário, por conectar aplicações e empréstimos.","Poupador, por fornecer recursos a outros agentes.","Tomador é quem precisa de recursos.",1,"Quem recebe o recurso é quem precisa dele.",["Tomador é quem precisa de recursos.","Superavitário é quem tem recursos excedentes e pode aplicá-los; não é quem precisa tomar recursos. Para esta pergunta: Tomador é quem precisa de recursos.","O intermediário conecta os agentes. O agente que precisa dos recursos e contrata o empréstimo ocupa a posição deficitária.","O poupador fornece recursos por dispor de sobra; o tomador necessita captá-los e ocupa a posição deficitária."]],
[1,"Spread",0,"O spread bancário é:","Diferença entre o juro cobrado e o pago na captação.","Resultado líquido depois de abater custos e perdas do banco.","Taxa básica de juros usada como referência para a economia.","Percentual dos depósitos que o banco recolhe ao Banco Central.","É a diferença entre as duas taxas, uma receita bruta.",1,"Pense na receita bruta de quem intermedeia dinheiro, e não no lucro final.",["É a diferença entre as duas taxas, uma receita bruta.","Lucro líquido exige descontar custos e perdas; spread é receita bruta da intermediação.","Selic é taxa básica definida pelo Copom; spread é diferença entre duas taxas.","Compulsório é recolhimento ao BC, não a diferença entre juros de empréstimo e captação."]],

[1,"Spread",1,"Se a remuneração paga ao poupador sobe e a taxa cobrada do tomador não muda, o spread:","Diminui","Aumenta","Não se altera","Torna-se necessariamente nulo","Spread é taxa cobrada menos taxa paga.",1,"Spread é uma diferença. Se o que o banco paga sobe e o que ele cobra fica igual, a diferença muda de tamanho.",["Spread é taxa cobrada menos taxa paga.","Subtrair uma taxa paga maior da mesma taxa cobrada reduz o spread.","A remuneração da captação participa da conta; aumentá-la muda a diferença.","O spread é a diferença entre a taxa cobrada e a paga. Ele diminui com o aumento da captação, mas só seria zero se as taxas se igualassem."]],
[1,"Estrutura",1,"O SFN também pode ser entendido como:","Instituições que regulam, fiscalizam ou facilitam a transferência de recursos.","Bancos comerciais que captam depósitos e concedem crédito, excluídos outros agentes.","O Banco Central e suas diretorias, excluídas as demais instituições do mercado.","Um conselho normativo único que executa todas as operações do mercado financeiro.","A aula admite essa visão ampla do SFN.",1,"A aula admite uma visão mais ampla do SFN, que vai além de um único órgão.",["A aula admite essa visão ampla do SFN.","O SFN inclui normativos, supervisoras e vários operadores, não apenas bancos comerciais.","O Banco Central é uma parte do sistema, não o sistema inteiro.","O SFN reúne diferentes instituições, não um único órgão normativo."]],
[1,"Vantagens",1,"Por que a intermediação por instituições é mais segura do que empréstimos diretos entre pessoas?","Instituições têm controles de regulação e supervisão nas operações.","A cobrança de uma taxa fixa de juros substitui a avaliação de crédito.","A instituição intermediária elimina os riscos de inadimplência do tomador.","A instituição intermediária emite a moeda necessária para cobrir as perdas.","Regulação e supervisão aumentam a confiança.",1,"Pense no que dá confiança ao sistema e não existe num empréstimo entre amigos.",["Regulação e supervisão aumentam a confiança.","A segurança apontada decorre de regulação e supervisão, não de cobrar uma taxa fixa.","Instituições também assumem risco; a intermediação não elimina todas as perdas possíveis.","A emissão é atribuição do BACEN; não explica a confiança em qualquer intermediário."]],
[1,"Desempenho",1,"Qual aproveitamento o professor recomenda buscar nos simulados?","Acima de 80%","Acima de 50%","Acima de 60%","Exatamente 100%","Abaixo de 80% indica revisar o material.",1,"Pense no limite que o professor usa para dizer que o desempenho já é confortável.",["Abaixo de 80% indica revisar o material.","A recomendação é superar 80%; um objetivo de apenas 50% fica abaixo dessa referência.","A recomendação de estudo é acima de 80%, e não apenas de 60%.","100% é desejável, mas o professor não exige exatamente 100%; recomenda acima de 80%."]],
[1,"Mercados",1,"O mercado de câmbio facilita:","Transações comerciais e financeiras em moedas diferentes.","Captação de capital das empresas por emissão de ações e debêntures.","Transferência de riscos por contratação de seguro e de resseguro.","Recolhimento de depósitos compulsórios para controle da liquidez.","Câmbio: negociação de moedas estrangeiras.",1,"Pense no que a troca entre moedas viabiliza.",["Câmbio: negociação de moedas estrangeiras.","Emitir debêntures é captar no mercado de capitais, não negociar moedas estrangeiras.","Seguros e resseguros transferem ou cobrem riscos. O câmbio tem por objeto moedas diferentes usadas nas transações, não essa cobertura.","Recolhimentos compulsórios são instrumentos administrados pelo BACEN, não operações de troca de moedas."]],
[1,"Quadro do SFN",1,"No quadro do SFN, o BCB é:","Supervisor do segmento financeiro, junto com a CVM.","Normativo do segmento de seguros, junto com o CNSP.","Operador da previdência fechada, junto com os fundos de pensão.","Operador do mercado de capitais, junto com as bolsas de valores.","O BCB é um dos supervisores desse segmento.",1,"Descarte os órgãos que pertencem a outros segmentos e os que não são supervisores.",["O BCB é um dos supervisores desse segmento.","O normativo de seguros é o CNSP; o BCB supervisiona o segmento financeiro.","Fundo de pensão é operador da previdência fechada, não uma autoridade supervisora.","Bolsa é operador do mercado de capitais, não o Banco Central supervisor."]],
[1,"Spread",2,"Um banco capta a 11% e empresta a 19%, com custos de 3 p.p. O resultado após custos é:","5 p.p.","8 p.p.","3 p.p.","11 p.p.","Spread de 8 p.p. menos custos de 3 p.p. resulta em 5 p.p.",1,"Calcule primeiro o spread e depois subtraia os custos.",["Spread de 8 p.p. menos custos de 3 p.p. resulta em 5 p.p.","8 p.p. é o spread bruto; ainda é necessário descontar os 3 p.p. de custos.","3 p.p. é o custo informado, não o resultado de 19 − 11 − 3.","11 p.p. é a taxa de captação, não a margem após custos."]],
[1,"Spread",2,"Considere: I. Spread é receita bruta. II. Spread é lucro líquido. III. O lucro exige abater custos. Estão corretas:","Apenas I e III","Apenas I e II","Apenas II e III","I, II e III","A II está errada: spread não é lucro líquido.",1,"Spread não é lucro. Veja quais afirmações separam receita bruta de lucro.",["A II está errada: spread não é lucro líquido.","Inclui II, que não deve fazer parte do conjunto correto. Deixa de incluir III, que faz parte do conjunto correto. A II está errada: spread não é lucro líquido.","Inclui II, que não deve fazer parte do conjunto correto. Deixa de incluir I, que faz parte do conjunto correto. A II está errada: spread não é lucro líquido.","Inclui II, que não deve fazer parte do conjunto correto. A II está errada: spread não é lucro líquido."]],
[1,"Lei da Usura",2,"Considere: I. O teto da Lei da Usura é de 12% ao ano. II. As instituições financeiras são exceção. III. Elas podem cobrar conforme o risco. Estão corretas:","I, II e III","Apenas I","Apenas I e II","Apenas II","Todas descrevem o que a aula afirma.",1,"Confira cada afirmação com o que a aula diz sobre o teto e sobre a exceção.",["Todas descrevem o que a aula afirma.","Deixa de incluir II, III, que faz parte do conjunto correto. Todas descrevem o que a aula afirma.","Deixa de incluir III, que faz parte do conjunto correto. Todas descrevem o que a aula afirma.","Deixa de incluir I, III, que faz parte do conjunto correto. Todas descrevem o que a aula afirma."]],
[1,"Quadro do SFN",2,"Associe normativo e supervisor de seguros e de previdência fechada, respectivamente:","CNSP e Susep; CNPC e Previc","CNPC e Susep; CNSP e Previc","CNSP e Previc; CNPC e Susep","Susep e CNSP; Previc e CNPC","Seguros: CNSP/Susep. Previdência fechada: CNPC/Previc.",1,"Associe por tipo: conselho (normativo) e superintendência (supervisor) em cada segmento.",["Seguros: CNSP/Susep. Previdência fechada: CNPC/Previc.","Troca os normativos: CNSP é de seguros; CNPC é da previdência fechada.","Troca os supervisores: Susep é de seguros; Previc é da previdência fechada.","Inverte os níveis: os conselhos normatizam e as superintendências supervisionam."]],
[1,"Quadro do SFN",2,"Qual alternativa lista apenas operadores do segmento de moeda, crédito, capitais e câmbio?","Bancos comerciais, cooperativas de crédito e bolsas de valores.","Seguradoras, corretoras de valores e bancos comerciais.","Fundos de pensão, bancos comerciais e bolsas de valores.","Cooperativas de crédito, corretoras de valores e resseguradoras.","Bancos, cooperativas e bolsas são operadores desse segmento.",1,"Procure a lista em que todos os itens operam no segmento financeiro, sem órgãos nem outros segmentos.",["Bancos, cooperativas e bolsas são operadores desse segmento.","Bancos e corretoras são operadores do segmento financeiro, mas seguradoras pertencem ao segmento de seguros. A lista não reúne apenas operadores do segmento pedido.","Bancos e bolsas são do segmento financeiro, mas fundos de pensão são operadores da previdência fechada. Esse item impede a combinação de atender ao enunciado.","Cooperativas e corretoras são do segmento financeiro; resseguradoras pertencem ao segmento de seguros. A combinação mistura segmentos."]],
[1,"Quadro do SFN",2,"Qual alternativa apresenta operadores, nesta ordem: segmento financeiro, seguros privados e previdência fechada?","Banco, seguradora e fundo de pensão.","Seguradora, banco e fundo de pensão.","Fundo de pensão, seguradora e banco.","Banco, fundo de pensão e seguradora.","Cada item pertence a um segmento diferente.",1,"Procure um operador de cada segmento, sem órgãos normativos ou supervisores.",["Cada item pertence a um segmento diferente.","Os dois primeiros segmentos estão trocados: seguradora é de seguros e banco é financeiro. O fundo de pensão está na terceira posição correta.","As posições do banco e do fundo de pensão estão trocadas. A ordem pedida é banco, seguradora e fundo de pensão.","O banco está correto, mas fundo de pensão é da previdência fechada e seguradora é de seguros; as duas últimas posições estão invertidas."]],
[1,"Estrutura",2,"Assinale a INCORRETA sobre a estrutura do SFN.","Supervisoras estabelecem diretrizes, sem funções executivas.","Normativas estabelecem diretrizes gerais, sem função executiva.","Supervisoras fiscalizam o cumprimento das regras pelas instituições.","Operacionais intermediam recursos e prestam serviços aos clientes.","Quem define as diretrizes gerais é a entidade normativa.",1,"Procure a frase que dá às supervisoras uma tarefa de quem define as regras.",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. Quem define as diretrizes gerais é a entidade normativa.","O normativo formula regras e diretrizes sem executar as operações. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Fiscalização do cumprimento das regras é a função das supervisoras. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Intermediar recursos e prestar serviços é a função das operacionais. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[1,"Regulação",2,"Assinale a INCORRETA sobre regulação.","Autorregulação é o controle por órgãos externos à indústria.","Na heterorregulação, o controle é externo às instituições reguladas.","Na autorregulação, a indústria estabelece e aplica suas próprias normas.","No SFN, há atuação de mecanismos de autorregulação e de heterorregulação.","Autorregulação é feita pela própria indústria.",1,"Verifique quem controla em cada tipo de regulação. Um dos itens troca os conceitos.",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. Autorregulação é feita pela própria indústria.","Na heterorregulação o controle vem de órgãos externos às instituições reguladas. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Na autorregulação a própria indústria participa da criação e aplicação das normas. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Heterorregulação e autorregulação coexistem no sistema; a frase é verdadeira. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[1,"Vantagens",2,"Assinale a INCORRETA sobre as vantagens das instituições financeiras.","Isenção de regulação e supervisão aumenta a confiança dos clientes.","A oferta de liquidez facilita o acesso dos agentes aos recursos.","A análise de dados dos clientes permite avaliar o risco de crédito.","A exceção ao teto da Lei da Usura permite cobrar juros conforme o risco.","As instituições são reguladas e supervisionadas.",1,"Procure a frase que contradiz a ideia de que são reguladas e supervisionadas.",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. As instituições são reguladas e supervisionadas.","Fornecer liquidez é uma das vantagens da intermediação pelas instituições. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Acesso a cadastros e históricos ajuda as instituições a avaliar clientes e riscos. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","A aula apresenta as instituições do SFN como exceção ao teto geral da Lei da Usura. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],
[1,"Mercados",2,"Associe: (a) títulos do governo e CDs de curto prazo; (b) ações e títulos corporativos; (c) seguros e capitalização. Mercados, respectivamente:","Monetário, capitais e seguros","Capitais, monetário e seguros","Monetário, seguros e capitais","Crédito, capitais e previdência fechada","(a) monetário; (b) capitais; (c) seguros.",1,"Associe pelo tipo de ativo e pelo prazo: curto prazo, títulos corporativos e proteção.",["(a) monetário; (b) capitais; (c) seguros.","Troca monetário e capitais: ativos de curto prazo são monetário e ações são capitais.","Ações não são seguros e apólices não são capitais; as duas últimas posições estão trocadas.","Ativos de curto prazo para liquidez são monetário; seguros e capitalização não são previdência fechada."]],
[1,"Agentes",2,"Afirmar que “poupador” é apenas quem tem caderneta de poupança está:","Incorreto: poupador é o agente que possui recursos excedentes para aplicar.","Correto: poupador designa um produto bancário específico, não o agente.","Correto: aplicar em CDB torna o agente um tomador, não um poupador.","Incorreto: poupador é o agente que toma recursos para cobrir um déficit.","No SFN, poupador é o agente superavitário.",1,"A palavra descreve um papel na relação financeira, e não um produto de banco.",["No SFN, poupador é o agente superavitário.","Poupador é o agente com sobra de recursos, não o nome de um produto bancário.","Aplicar em CDB também torna o agente fornecedor de recursos ao banco. Ele continua poupador/superavitário, sem precisar usar a caderneta de poupança.","A afirmação é de fato incorreta, mas a justificativa inverte o conceito: quem toma recursos para cobrir déficit é tomador deficitário, não poupador."]],
[1,"Serviços",2,"Qual combinação lista apenas serviços (e não intermediação)?","Custódia, processamento de pagamentos e prestação de garantias.","Custódia, concessão de empréstimos e financiamento de capital de giro.","Concessão de garantias, financiamento rural e processamento de pagamentos.","Processamento de pagamentos, custódia e desconto de duplicatas.","Custódia, processamento de pagamentos e prestação de garantias são serviços. Conceder crédito e antecipar títulos são operações de intermediação.",1,"Procure a lista só com serviços prestados, sem captar nem emprestar.",["Custódia, processamento de pagamentos e prestação de garantias são serviços. Conceder crédito e antecipar títulos são operações de intermediação.","Custódia é serviço, mas empréstimos e financiamento de capital de giro são concessões de crédito. A lista mistura serviços e intermediação.","Garantias e pagamentos são serviços; financiamento rural é concessão de crédito, portanto a combinação não contém apenas serviços.","Pagamentos e custódia são serviços, mas desconto de duplicatas antecipa recursos por operação de crédito. Não é uma lista exclusiva de serviços."]],
[1,"Mercados",2,"Qual alternativa diferencia corretamente crédito e capitais quanto ao prazo?","Crédito: curto e médio prazo; capitais: longo prazo.","Crédito: longo prazo; capitais: curto e médio prazo.","Crédito: curtíssimo prazo; capitais: curtíssimo prazo.","Crédito: longo prazo; capitais: longo prazo.","Crédito atende curto e médio prazo; capitais, longo prazo.",1,"Compare os prazos: um mercado atende prazos curtos e médios; o outro, prazos longos.",["Crédito atende curto e médio prazo; capitais, longo prazo.","Inverte os prazos da classificação: crédito atende curto/médio e capitais longo.","Curtíssimo prazo está ligado ao monetário; não é o prazo de ambos esses mercados.","Segundo a aula, o crédito atende curto e médio, não apenas longo como capitais."]],
[1,"Spread",3,"Banco A: capta a 9%, empresta a 17%, custos de 2 p.p. e perdas de 1 p.p. Banco B: capta a 10%, empresta a 18%, custos de 3 p.p. e perdas de 0,5 p.p. Qual afirmação é correta?","A: 5 p.p.; B: 4,5 p.p.","A: 4 p.p.; B: 4,5 p.p.","A: 5 p.p.; B: 5 p.p.","A: 4 p.p.; B: 5 p.p.","A: 8 menos 3 resulta em 5. B: 8 menos 3,5 resulta em 4,5.",1,"Calcule cada banco.",["A: 8 menos 3 resulta em 5. B: 8 menos 3,5 resulta em 4,5.","Erra o banco A: 17 − 9 − 2 − 1 = 5 p.p.; B está corretamente em 4,5.","O banco B tem 18 − 10 − 3 − 0,5 = 4,5 p.p., não cinco.","Inverte e altera as margens: A fica com 5 p.p. e B com 4,5 p.p."]],
[1,"Quadro do SFN",3,"Considere: I. CMN, CNSP e CNPC são conselhos normativos. II. BCB e CVM supervisionam moeda, crédito, capitais e câmbio. III. A Previc supervisiona seguros privados. IV. Fundos de pensão operam na previdência fechada. Estão corretas:","Apenas I, II e IV","Apenas I, II e III","Apenas II, III e IV","I, II, III e IV","A III está errada: a Previc supervisiona a previdência fechada.",1,"Confira a Previc.",["A III está errada: a Previc supervisiona a previdência fechada.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir IV, que faz parte do conjunto correto. A III está errada: a Previc supervisiona a previdência fechada.","Inclui III, que não deve fazer parte do conjunto correto. Deixa de incluir I, que faz parte do conjunto correto. A III está errada: a Previc supervisiona a previdência fechada.","Inclui III, que não deve fazer parte do conjunto correto. A III está errada: a Previc supervisiona a previdência fechada."]],
[1,"Lei da Usura",3,"Um aluno diz: “Como a Lei da Usura limita os juros a 12% ao ano, um banco jamais pode cobrar mais que isso.” Qual a correção?","O SFN é exceção ao teto geral; pode cobrar conforme o risco.","O teto de 12% é aplicável ao SFN, mesmo em operações de maior risco.","O teto de 12% é aplicável a bancos públicos, mas exclui bancos privados.","O teto para o SFN é de 6%, inferior ao limite geral da Lei da Usura.","As instituições financeiras são exceção ao teto.",1,"Exceção.",["As instituições financeiras são exceção ao teto.","A frase ignora a exceção aplicável às instituições financeiras do SFN.","A exceção ao teto alcança instituições do SFN, incluindo bancos públicos e privados. Não existe a distinção proposta que obrigue apenas bancos públicos a esse teto.","A regra apresentada não cria um teto bancário de 6%; trata da exceção ao teto geral citado."]],
[1,"Spread",3,"A taxa cobrada do tomador cai de 20% para 17% e a paga ao poupador sobe de 9% para 10%. O spread passa de:","11 p.p. para 7 p.p.","11 p.p. para 8 p.p.","10 p.p. para 7 p.p.","9 p.p. para 7 p.p.","20 menos 9 resulta em 11; 17 menos 10 resulta em 7.",1,"Calcule os dois.",["20 menos 9 resulta em 11; 17 menos 10 resulta em 7.","O spread final é 17 − 10 = 7 p.p., não oito.","O spread inicial é 20 − 9 = 11 p.p., não dez.","O spread inicial é 11 p.p.; nove é a taxa paga, não a diferença entre as taxas."]],
[1,"Quadro do SFN",3,"Associe cada operador ao segmento: (i) sociedade de capitalização; (ii) administradora de consórcios; (iii) entidade fechada de previdência complementar.","Seguros; moeda, crédito, capitais e câmbio; previdência fechada","Previdência fechada; seguros; moeda, crédito, capitais e câmbio","Moeda, crédito, capitais e câmbio; seguros; previdência fechada","Seguros; previdência fechada; moeda, crédito, capitais e câmbio","Capitalização: seguros. Consórcios: mercado financeiro. Fundos de pensão: previdência fechada.",1,"Veja o quadro.",["Capitalização: seguros. Consórcios: mercado financeiro. Fundos de pensão: previdência fechada.","Capitalização pertence a seguros; consórcios ao segmento financeiro; fundo de pensão à fechada.","Inverte capitalização e consórcios; só a previdência fechada está na posição certa.","Acerta capitalização, mas troca consórcios e fundo de pensão de segmento."]],
[1,"Quadro do SFN",3,"Qual alternativa associa corretamente segmento, normativo e supervisor?","Previdência fechada: normativo CNPC; supervisor Previc.","Seguros privados: normativo CNPC; supervisor Previc.","Mercado financeiro: normativo CNSP; supervisor BCB.","Seguros privados: normativo CMN; supervisor CVM.","Previdência fechada tem CNPC como normativo e Previc como supervisor.",1,"Pares do quadro.",["Previdência fechada tem CNPC como normativo e Previc como supervisor.","CNPC e Previc regulam e supervisionam a previdência fechada, não seguros privados.","O normativo do segmento financeiro é CMN, não CNSP.","Seguros privados têm CNSP e Susep, não CMN e CVM."]],
[1,"Regulação",3,"Classifique: (a) a Susep supervisiona as seguradoras; (b) a indústria cria e aplica suas próprias normas. Respectivamente:","Supervisão: heterorregulação; indústria: autorregulação.","Supervisão: autorregulação; indústria: heterorregulação.","Supervisão: heterorregulação; indústria: heterorregulação.","Supervisão: autorregulação; indústria: autorregulação.","Susep é órgão externo; a indústria regula a si mesma.",1,"Externo x próprio.",["Susep é órgão externo; a indústria regula a si mesma.","Inverte os tipos: Susep é externa e a indústria regula a si mesma.","O segundo caso é autorregulação, porque a própria indústria cria e aplica as normas.","O primeiro caso é heterorregulação, porque a supervisão vem de autarquia externa."]],
[1,"Liquidez",3,"O ativo X vira dinheiro em 1 dia sem perda; o ativo Y leva 6 meses e perde 15% do valor. Qual afirmação é correta?","X tem maior liquidez que Y","Y tem maior liquidez que X","Ambos têm a mesma liquidez","Liquidez independe de prazo e perda","Liquidez é rapidez e ausência de perda significativa.",1,"Compare os dois.",["Liquidez é rapidez e ausência de perda significativa.","X converte mais rápido e sem perda; Y é menos líquido, não mais.","Os tempos e perdas são diferentes; X tem maior liquidez.","Tempo e perda de valor são justamente critérios usados para medir liquidez."]],
[1,"Mercados",3,"Uma empresa vende ações (i), toma um empréstimo de 60 dias (ii) e compra euros (iii). Quais mercados, respectivamente?","Capitais, crédito e câmbio","Crédito, capitais e câmbio","Capitais, monetário e câmbio","Capitais, crédito e seguros","Ações: capitais; empréstimo curto: crédito; euros: câmbio.",1,"Um mercado para cada.",["Ações: capitais; empréstimo curto: crédito; euros: câmbio.","Troca as duas primeiras operações: vender ações é capitais e contratar empréstimo é crédito.","O empréstimo bancário é mercado de crédito, não monetário só por ter sessenta dias.","Comprar euros é câmbio; não envolve contratar um seguro."]],
[1,"Estrutura",3,"Assinale a INCORRETA sobre normatização e supervisão no SFN.","CMN, CNSP e CNPC são as entidades supervisoras.","O SFN tem níveis normativo, supervisor e operacional.","CMN, CNSP e CNPC pertencem ao nível normativo.","Susep e Previc pertencem ao nível supervisor do SFN.","Os conselhos são normativos; os supervisores são outros.",1,"Conselho não supervisiona.",["Esta é a resposta ao enunciado que pede a exceção ou afirmação incorreta. Os conselhos são normativos; os supervisores são outros.","Os três níveis indicados efetivamente compõem a estrutura do SFN. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","CMN, CNSP e CNPC definem diretrizes e normas nos respectivos segmentos. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada.","Susep e Previc supervisionam seguros e previdência fechada, respectivamente. Por isso, esta opção não é a exceção ou afirmação incorreta solicitada."]],

[6,"Classificação",1,"Qual é instituição de intermediação no mercado de capitais?","Corretora ou distribuidora","Banco comercial","Cooperativa de crédito","Caixa econômica","Corretoras e distribuidoras intermediam o mercado de capitais.",1,"O nome da instituição remete à intermediação de ações e valores.",["Corretoras e distribuidoras intermediam o mercado de capitais.","Banco comercial é operador monetário, capta depósitos à vista e a prazo e concede crédito; não é normativo nem supervisor. Para esta pergunta: Corretoras e distribuidoras intermediam o mercado de capitais.","Cooperativa de crédito atende associados, com capital em cotas e sem lucro como finalidade principal; captação é restrita aos associados. Para esta pergunta: Corretoras e distribuidoras intermediam o mercado de capitais.","Caixas econômicas são instituições públicas monetárias, com prioridade social; a CEF é a única em atividade indicada pela aula. Para esta pergunta: Corretoras e distribuidoras intermediam o mercado de capitais."]],
[6,"Classificação",1,"Qual é instituição de arrendamento mercantil?","Sociedade de arrendamento mercantil","Banco comercial de crédito a curto prazo","Corretora de títulos e valores mobiliários","Cooperativa de crédito aos associados","Há sociedades específicas de arrendamento mercantil.",1,"O nome remete a arrendar bens, como no leasing.",["Há sociedades específicas de arrendamento mercantil.","Banco comercial é operador monetário, capta depósitos à vista e a prazo e concede crédito; não é normativo nem supervisor. Para esta pergunta: Há sociedades específicas de arrendamento mercantil.","Corretora é operador não monetário do mercado de valores mobiliários; não é normativo, supervisor nem captador de depósitos à vista. Para esta pergunta: Há sociedades específicas de arrendamento mercantil.","Cooperativa de crédito atende associados, com capital em cotas e sem lucro como finalidade principal; captação é restrita aos associados. Para esta pergunta: Há sociedades específicas de arrendamento mercantil."]],

de e rapidez de converter um ativo em dinheiro sem perda significativa de valor.",1],["Cite exemplos de prestação de serviços do SFN.","Sistema de pagamentos, custódia, meios de pagamento e seguros.",1],["Qual o papel das entidades normativas?","Definir políticas e diretrizes gerais, sem função executiva.",1],["Qual o papel das entidades supervisoras?","Exercer funções executivas, como a fiscalização das instituições.",1],["Qual o papel das entidades operacionais?","Intermediar recursos entre poupadores e tomadores ou prestar serviços.",1],["O que é heterorregulação?","Regulação feita por órgãos governamentais ou entidades externas e independentes das instituições reguladas.",1],["O que é autorregulação?","A própria indústria financeira cria e aplica suas normas, por meio de entidades próprias.",1],["Quem são o normativo e o supervisor dos seguros privados?","CNSP (normativo) e Susep (supervisor).",1],["Quem são o normativo e o supervisor da previdência fechada?","CNPC (normativo) e Previc (supervisor).",1],["Quais os supervisores de moeda, crédito, capitais e câmbio?","BCB e CVM.",1],["Que vantagens as instituições têm como intermediárias?","Fornecem liquidez, acessam informações dos clientes, são reguladas e supervisionadas e podem cobrar juros acima do teto da Lei da Usura.",2],["O que diz a Lei da Usura (teto de 12% ao ano) sobre as instituições do SFN?","Elas são exceção ao teto e podem cobrar juros superiores, conforme o risco da operação.",2],["Spread é o mesmo que lucro bancário?","Não. Spread é receita bruta; o lucro exige abater custos como agências e funcionários.",2],["Qual aproveitamento o professor recomenda nos simulados?","Acima de 80%.",2],["Quem opera no segmento de seguros privados?","Seguradoras, resseguradoras, entidades abertas de previdência e sociedades de capitalização.",2],["Quem opera na previdência fechada?","Entidades fechadas de previdência complementar (fundos de pensão).",2],["Pelo mnemônico, quais os três principais órgãos normativos?","CMN, CNSP e CNPC: Conselhos, todos com C e com “Nacional” no nome.",2],["Compare o mercado monetário e o de capitais.","Monetário: ativos de curto prazo para gerenciar a liquidez. Capitais: ativos de longo prazo para captar recursos e investir.",3],["Como o spread reage a mais inadimplência?","Tende a subir, para compensar o risco de perdas.",3],["Diferencie intermediação de prestação de serviços quanto à receita.","Intermediação gera spread; serviços geram taxas e tarifas.",3],["Uma empresa converte dólares em reais, aplica o caixa por 30 dias e toma financiamento de 18 meses. Quais mercados e posições?","Câmbio; superavitária na aplicação; crédito no financiamento.",3],["Um banco capta a 8% e empresta a 20%, com 3% de perdas e 2% de custos. Que margem sobra?","7 pontos percentuais.",3],["Por que o CMN não fiscaliza os bancos?","Porque é normativo, sem função executiva; a fiscalização é das supervisoras.",3],["Associe segmento, normativo e supervisor: seguros, previdência fechada e mercado financeiro.","Seguros: CNSP e Susep. Previdência fechada: CNPC e Previc. Moeda, crédito, capitais e câmbio: CMN, com BCB e CVM.",3],["Captação de 10% e empréstimo a 16%: qual o spread? E se a captação sobe a 13% e se quer manter 6 p.p. líquidos, com 2 p.p. de custos e perdas?","Spread de 6 p.p. A taxa de empréstimo necessária seria 21%.",3],["O que é o “poupador” no vocabulário do SFN?","O agente superavitário (quem tem sobra), e não a caderneta de poupança.",3],["Diferencie heterorregulação de autorregulação.","Hetero: órgão externo regula e supervisiona. Auto: entidades da própria indústria criam e aplicam suas regras.",3]]},

fc:[["O CMN tem funções executivas?","Não. É normativo.",0],["Quantos membros tem o CMN?","3.",0],["Quem preside o CMN?","O Ministro da Fazenda.",0],["Quem define a meta de inflação?","O CMN.",0],["Quem persegue a meta de inflação?","O Banco Central.",0],["Frequência das reuniões ordinárias do CMN?","Uma vez por mês.",0],["Como saem as normas do CMN?","Resoluções CMN, publicadas no DOU.",0],["Quem exerce a Secretaria-Executiva do CMN?","O Banco Central.",0],["Quem compõe o CMN?","Ministro da Fazenda (preside), Ministro do Planejamento e Orçamento e Presidente do Banco Central.",1],["Quais os objetivos do CMN (O-P-Z-C)?","Orientar, Propiciar, Zelar (liquidez e solvência) e Coordenar.",1],["O que é a meta contínua?","Inflação acumulada em 12 meses, comparada com a meta mês a mês.",1],["Antecedência para alterar a meta?","36 meses.",1],["Desde quando há regime de metas?","Desde 1999.",1],["Quem define a meta da Selic?","O Copom, do Banco Central.",1],["Como o CMN decide?","Por maioria simples.",1],["O que é decidir ad referendum?","O presidente decide em urgência e os demais confirmam na reunião seguinte.",1],["Quem convoca as reuniões extraordinárias do CMN?","O presidente do CMN.",1],["O que é a Comoc?","Órgão de assessoramento técnico que se manifesta previamente sobre assuntos do CMN.",1],["Quem coordena a Comoc?","O Presidente do Banco Central.",1],["As reuniões da Comoc são abertas?","Não. Têm caráter reservado.",1],["O CMN prepara ou aprova os orçamentos monetários?","Aprova; quem prepara é o Banco Central.",1],["Por que o CMN é conselho de política econômica?","Coordena as políticas monetária, creditícia, orçamentária, fiscal e da dívida pública.",1],["Que competências o CMN tem sobre câmbio?","Fixar diretrizes e, em grave desequilíbrio, outorgar o monopólio ao BC.",1],["Quais os membros da Comoc?","Presidente do BC (coordenador), Presidente da CVM, secretários-executivos da Fazenda e do Planejamento, Secretário do Tesouro, secretários de Reformas Econômicas e de Política Econômica e 4 diretores do BC.",2],["Quantos membros tem a Comoc?","11.",2],["Quais os elementos do regime de metas?","Meta pública e prévia, autonomia do BC, comunicação transparente e prestação de contas.",2],["O que o CMN pode limitar?","Taxas de juros, descontos, comissões e outras remunerações de operações e serviços.",2],["O que o CMN determina sobre empréstimos a um mesmo cliente?","O percentual máximo que as instituições podem emprestar a um cliente ou grupo.",2],["Qual o papel do CMN em empréstimos externos de estados e municípios?","Colabora com o Senado na instrução dos processos.",2],["O que o CMN disciplina no mercado de capitais?","As atividades das Bolsas de Valores e dos corretores de fundos públicos.",2],["Por que o CMN não fiscaliza?","Cria regras e diretrizes; a execução e a fiscalização cabem ao BC ou à CVM.",3],["Meta anunciada em março de 2026: a partir de quando pode valer?","Março de 2029 (36 meses de antecedência).",3],["Diferencie Comoc e Copom.","Comoc: assessoria técnica ao CMN. Copom: define a meta da Selic, no BC.",3],["Dois votos a favor e um contra no CMN: o que ocorre?","A proposta é aprovada, pois a decisão é por maioria simples.",3],["Em que ordem se dá o orçamento monetário?","O BC prepara, a Comoc se manifesta e o CMN aprova.",3],["Quais as cinco políticas que o CMN coordena?","Monetária, creditícia, orçamentária, fiscal e da dívida pública.",3],["Qual a diferença entre regular e fiscalizar no caso do CMN?","O CMN regula (escreve regras, inclusive sobre a fiscalização); a fiscalização é do BC.",3],["Algum Ministro integra a Comoc?","Não: na Comoc estão os secretários-executivos dos ministérios, não os ministros.",3],["Qual destes não é objetivo do CMN: orientar, propiciar, zelar ou executar?","Executar.",3],["Como a meta contínua é comparada ao longo do ano?","Todo mês, a inflação de 12 meses é comparada com a meta e o intervalo de tolerância.",3]]},

fc:[["O que é o BACEN?","Autarquia de natureza especial.",0],["Qual o objetivo fundamental do BACEN?","Assegurar a estabilidade dos preços.",0],["Onde fica a sede do BACEN?","Em Brasília, com nove regionais.",0],["Quantos membros tem a Diretoria?","9: 1 presidente + 8 diretores.",0],["Mandato dos diretores?","4 anos, reconduzível uma vez.",0],["Quem aprova os diretores?","O Senado Federal.",0],["Quem nomeia os diretores?","O Presidente da República.",0],["Quais as quatro funções do BACEN?","Banco do governo, banco dos bancos, executor da política monetária e supervisor do SFN.",0],["Quando começa o mandato do Presidente do BACEN?","No início do 3º ano do mandato do Presidente da República.",1],["Quantos diretores iniciam mandato por ano?","2.",1],["Quando há descumprimento da meta de inflação?","Inflação fora da tolerância por 6 meses consecutivos.",1],["O que o BACEN divulga no descumprimento?","Nota no Relatório de Política Monetária e carta aberta ao Ministro da Fazenda.",1],["O que deve conter a carta aberta?","Causas, medidas necessárias e prazo esperado.",1],["Limites dos compulsórios?","Até 100% dos depósitos à vista e 60% de outros títulos.",1],["Emissão x impressão de moeda?","Emissão: BACEN. Impressão: Casa da Moeda.",1],["O que mudou em 2002?","O BACEN deixou de poder emitir títulos de dívida pública.",1],["Zelar: BACEN ou CMN?","Estabilidade e eficiência: BACEN. Liquidez e solvência: CMN.",1],["O que é o banco do governo?","Depositário das reservas e operador de compra e venda de títulos públicos federais.",1],["O que é o banco dos bancos?","Recebe compulsórios e depósitos e faz redesconto e empréstimos às instituições.",1],["O que faz como supervisor do SFN?","Autoriza, normatiza, fiscaliza e intervém nas instituições.",1],["Requisitos para ser diretor?","Brasileiros idôneos, reputação ilibada e notória capacidade.",1],["Dimensões da autonomia do BACEN?","Técnica, operacional, administrativa e financeira.",1],["A que Ministério o BACEN está vinculado?","A nenhum: não há vinculação, tutela nem subordinação hierárquica.",1],["Hipóteses de exoneração dos diretores?","A pedido, enfermidade, condenação com proibição de acesso a cargos públicos ou desempenho insuficiente.",2],["Como se exonera por desempenho insuficiente?","O CMN propõe, com prévia aprovação do Senado por maioria absoluta.",2],["Quando há nova comunicação após a primeira carta?","Se a inflação não voltar no prazo ou se for preciso atualizar as providências ou o prazo.",2],["O que o BACEN autoriza às instituições?","Funcionar, instalar ou transferir sedes, transformar-se, operar câmbio, alterar estatutos e transferir controle.",2],["Como o BACEN trata instituição estrangeira?","Análise técnica e reconhecimento de interesse do Governo para novas agências.",2],["Que lei regulamenta o câmbio hoje?","A Lei 14.286/2021, regulamentada pelo BACEN.",2],["Quais as matérias normativas do BACEN?","Portarias, Resoluções BCB, Instruções Normativas BCB e conjuntas.",2],["Qual o macete dos verbos?","Emitir, realizar, exercer e efetuar apontam para o BACEN; regular e regulamentar são mais do CMN (exceção: câmbio).",3],["Quando começam os dois primeiros diretores em um mandato presidencial?","Em 1º de março do primeiro ano; os demais, em 1º de janeiro.",3],["Quantos membros da Diretoria terão iniciado mandato ao fim do 2º ano?","4 (2 por ano; o presidente só no 3º ano).",3],["Associe: emissão, impressão, compulsórios e autorização de fusão.","BACEN, Casa da Moeda, BACEN e BACEN.",3],["Qual a ressalva sobre a vigilância do mercado de capitais?","A lei cita o BACEN, mas hoje a função é primordialmente da CVM.",3],["Quais os objetivos do BACEN além da estabilidade dos preços?","Estabilidade e eficiência do sistema financeiro, suavizar flutuações da atividade e fomentar o pleno emprego.",3],["Como diferem BACEN e CMN quanto aos membros?","BACEN: 9 diretores. CMN: 3 membros.",3],["Descreva o fluxo de nomeação de um diretor.","Presidente indica, Senado aprova, Presidente nomeia e começa o mandato de 4 + 4 anos.",3],["Inflação fora da tolerância por 5 meses e por 6 consecutivos: qual a diferença?","Só 6 meses consecutivos configuram descumprimento.",3],["Como diferem CVM e BACEN quanto ao mandato?","CVM: 5 anos sem recondução. BACEN: 4 anos com recondução.",3]]},

fc:[["O que é a CVM?","Autarquia em regime especial que regula e fiscaliza o mercado de capitais.",0],["A CVM é subordinada à Fazenda?","Não. É vinculada, mas não subordinada.",0],["Qual a sede da CVM?","Rio de Janeiro.",0],["Quantos membros tem a Diretoria da CVM?","5: 1 presidente + 4 diretores.",0],["Mandato dos diretores da CVM?","5 anos, sem recondução.",0],["Quem nomeia os diretores da CVM?","O Presidente da República.",0],["Quem aprova os diretores da CVM?","O Senado Federal.",0],["Quais os dois poderes da CVM?","Normativo e punitivo.",0],["Hipóteses de exoneração na CVM?","Renúncia, condenação transitada em julgado ou processo administrativo disciplinar.",1],["Requisitos dos diretores da CVM?","Reputação ilibada, notória especialização em assuntos econômico-financeiros e aprovação do Senado.",1],["Exemplos de valores mobiliários?","Ações, debêntures, bônus de subscrição, cotas de fundos, notas comerciais e derivativos.",1],["O que NÃO é valor mobiliário?","Títulos da dívida pública e títulos cambiais de instituição financeira, exceto debêntures.",1],["Qual a regra de ouro das atribuições?","Envolve valores mobiliários? Pense em CVM.",1],["Quais os cinco blocos de atribuições?","Desenvolvimento do mercado; eficiência e funcionamento; proteção dos investidores; acesso à informação; fiscalização e punição.",1],["Teto da inabilitação temporária?","Até 20 anos.",1],["Teto da proibição para atuar no mercado?","Até 10 anos.",1],["Quais as penalidades da CVM?","Advertência, multa, inabilitação, suspensão e proibição temporária.",1],["O que atenua as penalidades?","Arrependimento eficaz ou posterior e confissão espontânea.",1],["Para quem a CVM denuncia indícios de ilícito?","Ministério Público (penal) e Receita Federal (fiscal).",1],["Fundamentos da regulação da CVM?","Interesse público, confiabilidade, eficiência do mercado, competitividade e mercado livre.",1],["O que é a autorregulação na CVM?","Sistema para aumentar a eficiência, evitando a centralização excessiva de normatizar e fiscalizar.",1],["Quais as matérias normativas da CVM?","Portarias, Resoluções CVM, Instruções Normativas CVM e conjuntas.",1],["Qual a área e o nível da CVM?","Área: capitais. Nível: supervisor.",1],["Quais os poderes de investigação da CVM?","Examinar livros e registros, intimar (com multa), requisitar informações a outros órgãos e apurar práticas não equitativas por inquérito.",2],["O que é a proteção dos investidores?","Proteger titulares contra emissões irregulares, atos ilegais de administradores e controladores e uso de informação relevante não divulgada.",2],["Que bloco inclui bolsa e balcão?","Eficiência e funcionamento do mercado.",2],["Pressupostos da autorregulação?","Menor custo do regulador, proximidade e conhecimento da entidade autorreguladora e maior aceitação das regras.",2],["Alcance da proibição de até 20 anos?","Atividades ou operações de integrantes do sistema de distribuição e entidades com registro na CVM.",2],["O que a inabilitação de até 20 anos alcança?","Cargo de administrador ou conselheiro fiscal de companhia aberta e demais atividades.",2],["Quais contratos de investimento coletivo são valores mobiliários?","Os ofertados publicamente, com direito de participação, parceria ou remuneração do esforço de empreendedor ou de terceiros.",2],["Compare a vinculação da CVM e do BACEN.","CVM: vinculada ao Ministério da Fazenda, sem subordinação. BACEN: sem vinculação a Ministério.",3],["Compare diretoria e mandato da CVM e do BACEN.","CVM: 5 membros, 5 anos sem recondução. BACEN: 9 membros, 4 anos com recondução.",3],["Título cambial de instituição financeira é valor mobiliário?","Não, exceto as debêntures.",3],["Inabilitação por 18 anos e proibição de atuar no mercado por 12: o que se afirma?","A primeira está no limite (20 anos); a segunda excede o limite (10 anos).",3],["Como se exerce o poder punitivo?","Assegurada a ampla defesa.",3],["Como difere a normatização na CVM e no sistema do BACEN?","A CVM tem poder normativo próprio; no BACEN, a normatização geral cabe ao CMN.",3],["Companhia emite debêntures, banco emite título cambial e o governo, título público. Quais são valores mobiliários?","Apenas as debêntures.",3],["Como a CVM se relaciona com o CMN?","Segue as diretrizes do CMN e edita normas detalhadas; norma que contraria o CMN ou a lei perde a validade.",3],["Como o colegiado da CVM é renovado?","Um quinto a cada ano; o presidente começa em 15 de julho e os diretores em 1º de janeiro.",3],["Classifique: estimular poupança, coibir fraude e observar o crédito fixado pelo CMN.","Desenvolvimento do mercado, proteção dos investidores e eficiência e funcionamento.",3]]},
