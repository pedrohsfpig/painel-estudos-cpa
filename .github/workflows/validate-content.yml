name: Validar conteúdo das questões

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Conferir feedback de todas as alternativas
        run: python3 tests/validate_bank.py
      - name: Detectar pistas de tamanho nas alternativas
        run: python3 tests/audit_alternatives.py --check
      - name: Conferir a auditoria de alternativas
        run: python3 tests/test_alternative_quality.py
