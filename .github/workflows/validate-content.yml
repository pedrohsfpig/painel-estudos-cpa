name: Validar feedbacks das questões

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Conferir feedback de todas as alternativas
        run: python3 tests/validate_bank.py
